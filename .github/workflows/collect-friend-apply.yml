name: 友链申请自动入库

# 别人在前台「关于我 → 申请友链」提交后，会开一个带「友链申请」标签的 Issue。
# 这个工作流把它解析出来，追加到 data.json 的 friendApplies 数组，
# 这样站长在后台「友链」面板就能直接看到，并一键转成正式友链。

on:
  issues:
    types: [opened, labeled]

permissions:
  contents: write
  issues: read

jobs:
  collect:
    runs-on: ubuntu-latest
    # 只看标题以 [友链申请] 开头的，或打了「友链申请」标签的 Issue
    if: >-
      contains(github.event.issue.title, '[友链申请]') ||
      contains(join(github.event.issue.labels.*.name, ','), '友链申请')
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 解析 Issue 并写入 data.json
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_TIME: ${{ github.event.issue.created_at }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: node .github/scripts/collect-friend-apply.mjs

      - name: 提交改动
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.json
          if git diff --cached --quiet; then
            echo "没有新内容，跳过提交"
          else
            git commit -m "自动收录友链申请 (#${{ github.event.issue.number }})"
            git push
          fi
