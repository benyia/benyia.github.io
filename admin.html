<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>管理后台 - 思齐个人主页</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--primary:#10b981;--primary-light:#d1fae5;--bg:#f0fdf4;--card:#fff;--text:#1e293b;--text2:#64748b;--text3:#94a3b8;--border:#e2e8f0;--radius:12px}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;color:var(--text);line-height:1.6;background-image:url("image1.png");background-size:cover;background-attachment:fixed;background-position:center;min-height:100vh}
body::before{content:"";position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(255,255,255,.5);z-index:-1}
.login-screen{max-width:400px;margin:70px auto;padding:36px 32px;background:var(--card);border-radius:16px;box-shadow:0 10px 40px rgba(0,0,0,.09)}
.login-screen h1{text-align:center;margin-bottom:26px;font-size:1.4rem;font-weight:700}
.login-screen .lg-label{display:block;font-size:.85rem;color:var(--text2);margin-bottom:7px}
.login-screen .lg-input{display:block;width:100%;padding:11px 14px;border:1px solid var(--border);border-radius:10px;font-size:.92rem;margin-bottom:16px;outline:none;font-family:inherit;background:#fff;color:var(--text);box-sizing:border-box}
.login-screen .lg-input:focus{border-color:var(--primary);box-shadow:0 0 0 3px rgba(16,185,129,.15)}
.login-screen .lg-pwdwrap{position:relative}
.login-screen .lg-pwdwrap .lg-input{padding-right:72px}
.login-screen .lg-eye{position:absolute;right:9px;top:22px;width:auto;padding:5px 11px;background:#f1f5f9;color:#475569;border:none;border-radius:7px;font-size:.75rem;cursor:pointer;line-height:1.4;font-family:inherit}
.login-screen .lg-eye:hover{background:#e2e8f0}
.login-screen .lg-row{display:flex;justify-content:space-between;align-items:center;margin:-6px 0 20px;font-size:.82rem}
.login-screen .lg-check{display:flex;align-items:center;gap:6px;color:var(--text2);cursor:pointer}
.login-screen .lg-check input{width:auto;margin:0}
.login-screen .lg-link{color:var(--primary);cursor:pointer}
.login-screen .lg-submit{display:block;width:100%;padding:13px;background:#111827;color:#fff;border:none;border-radius:10px;font-size:.95rem;cursor:pointer;font-family:inherit;font-weight:600}
.login-screen .lg-submit:hover{background:#000}
.login-hint{font-size:.78rem;color:var(--text3);text-align:center;margin-top:18px;line-height:1.6;white-space:pre-wrap}
.main{display:none}
.topbar{background:var(--card);border-bottom:1px solid var(--border);padding:12px 24px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:100;flex-wrap:wrap;gap:8px}
.topbar h1{font-size:1.1rem}
.topbar a{color:var(--primary);text-decoration:none;font-size:.88rem;cursor:pointer}
.container{max-width:1000px;margin:24px auto;padding:0 24px}
.tabs{display:flex;gap:4px;margin-bottom:20px;flex-wrap:wrap}
.tabs button{padding:8px 16px;border:none;background:var(--card);border:1px solid var(--border);border-radius:8px;cursor:pointer;font-size:.88rem}
.tabs button.active{background:var(--primary);color:#fff;border-color:var(--primary)}
.panel{display:none}
.panel.active{display:block}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:16px}
.card h2{font-size:1rem;margin-bottom:12px;padding-bottom:8px;border-bottom:1px solid var(--border)}
.item-row{padding:12px;border:1px solid var(--border);border-radius:8px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px}
.item-row .info{flex:1;min-width:200px}
.item-row .title{font-weight:600}
.item-row .desc{font-size:.82rem;color:var(--text2)}
.item-row .actions{display:flex;gap:6px;flex-wrap:wrap}
.form-row{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.form-row input,.form-row select,.form-row textarea{padding:8px 12px;border:1px solid var(--border);border-radius:8px;font-size:.88rem;font-family:inherit}
.form-row input{flex:1;min-width:120px}
.form-row textarea{width:100%;min-height:100px;flex:1 1 100%}
.btn{padding:8px 16px;border:none;border-radius:8px;cursor:pointer;font-size:.85rem}
.btn:disabled{opacity:.55;cursor:not-allowed}
.btn-primary{background:var(--primary);color:#fff}
.btn-primary:hover:not(:disabled){background:#059669}
.btn-danger{background:#ef4444;color:#fff}
.btn-ghost{background:#f1f5f9;color:var(--text)}
.btn-sm{padding:4px 10px;font-size:.78rem}
.stat-bar{display:flex;gap:12px;margin-bottom:16px;flex-wrap:wrap}
.stat-bar .card{flex:1;min-width:110px;text-align:center;margin:0}
.stat-bar .num{font-size:1.4rem;font-weight:700;color:var(--primary)}
.progress-input{width:80px}
.tag-chip{display:inline-block;padding:2px 8px;background:var(--primary-light);color:var(--primary);border-radius:99px;font-size:.75rem;margin:2px}
.log-list{font-size:.82rem;color:var(--text2)}
.log-list .log-item{padding:6px 0;border-bottom:1px dashed var(--border)}
.toast{position:fixed;top:20px;right:20px;padding:12px 24px;border-radius:8px;color:#fff;font-size:.9rem;z-index:1000;animation:slideIn .3s ease;max-width:min(90vw,360px)}
.toast.success{background:#10b981}
.toast.error{background:#ef4444}
.toast.info{background:#3b82f6}
@keyframes slideIn{from{transform:translateX(100%)}to{transform:translateX(0)}}
.file-list{margin:0 0 12px}
.file-item{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 12px;border:1px solid var(--border);border-radius:8px;margin-bottom:6px;background:#f8fafc;flex-wrap:wrap}
.file-item .fname{font-size:.84rem;word-break:break-all;flex:1;min-width:160px}
.file-item .fsize{font-size:.75rem;color:var(--text3)}
.upload-box{border:2px dashed var(--border);border-radius:10px;padding:16px;text-align:center;cursor:pointer;transition:.2s;background:#fcfdfe}
.upload-box:hover{border-color:var(--primary);background:var(--primary-light)}
.upload-box .up-hint{font-size:.82rem;color:var(--text2);margin-bottom:6px}
.upload-box .up-status{font-size:.78rem;color:var(--text3);word-break:break-all}
.progress-track{height:6px;background:var(--border);border-radius:99px;overflow:hidden;margin-top:8px;display:none}
.progress-track.on{display:block}
.progress-bar{height:100%;width:0;background:var(--primary);transition:width .15s}
.status-msg{font-size:.8rem;margin-top:8px;min-height:1.2em}
.status-msg.ok{color:#059669}
.status-msg.err{color:#ef4444}
.status-msg.warn{color:#d97706}
.token-box{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:8px}
.token-box input{flex:1;min-width:220px;padding:8px 12px;border:1px solid var(--border);border-radius:8px;font-size:.88rem;font-family:ui-monospace,Consolas,monospace}
.note{font-size:.8rem;color:var(--text2);background:#f8fafc;border:1px solid var(--border);border-radius:8px;padding:10px 12px;margin-bottom:12px}
.note code{background:#eef2f7;padding:1px 5px;border-radius:4px;font-size:.78rem}
.editing-bar{background:#fffbeb;border:1px solid #fcd34d;color:#92400e;font-size:.82rem;padding:8px 12px;border-radius:8px;margin-bottom:10px;display:none}
.editing-bar.on{display:block}
/* ===== 新皮肤：现代 SaaS 表单风（只调外观，不动任何功能/HTML/JS） ===== */
body::before{background:rgba(255,255,255,.5)}
.topbar{background:rgba(255,255,255,.85);backdrop-filter:blur(12px);border-bottom:1px solid rgba(226,232,240,.6)}
.container{max-width:1060px}
.tabs{gap:2px;background:rgba(255,255,255,.75);border:1px solid rgba(226,232,240,.6);border-radius:16px;padding:6px 8px}
.tabs button{border:none;background:transparent;border-radius:10px;padding:9px 16px;color:#64748b;font-weight:500;transition:all .2s}
.tabs button:hover{background:#f1f5f9;color:#0f172a}
.tabs button.active{background:#fff;color:var(--primary);box-shadow:0 2px 10px rgba(16,185,129,.18);font-weight:600}
.card{background:rgba(255,255,255,.88);border:1px solid rgba(226,232,240,.55);border-radius:18px;box-shadow:0 4px 22px rgba(15,23,42,.05);padding:22px 24px}
.card h2{font-size:.95rem;border-bottom:1px dashed rgba(226,232,240,.8);color:#0f172a}
.form-row{gap:10px}
.form-row input,.form-row select,.form-row textarea,.token-box input{background:#f3f4f6!important;border:1.5px solid transparent!important;border-radius:12px!important;padding:11px 14px!important;transition:all .2s;color:#0f172a}
.form-row input:focus,.form-row select:focus,.form-row textarea:focus,.token-box input:focus{outline:none;background:#fff!important;border-color:var(--primary)!important;box-shadow:0 0 0 4px rgba(16,185,129,.12)}
textarea{resize:vertical}
.btn{border-radius:12px;font-weight:500;padding:9px 18px;transition:all .2s}
.btn-primary{background:linear-gradient(135deg,#10b981,#06b6d4);box-shadow:0 4px 14px rgba(16,185,129,.3)}
.btn-primary:hover:not(:disabled){filter:brightness(1.06);transform:translateY(-1px)}
.btn-ghost{background:#f1f5f9;color:#334155}
.btn-ghost:hover:not(:disabled){background:#e2e8f0}
.btn-danger{background:rgba(239,68,68,.08)!important;color:#ef4444!important}
.btn-danger:hover:not(:disabled){background:#ef4444!important;color:#fff!important;box-shadow:0 4px 12px rgba(239,68,68,.3)}
.stat-bar .card{border-radius:16px}
.item-row{border:1px solid rgba(226,232,240,.6);border-radius:14px;background:rgba(255,255,255,.72);transition:all .2s}
.upload-box{border-radius:14px;background:rgba(241,245,249,.6)}
.login-screen{border-radius:20px;box-shadow:0 20px 60px rgba(0,0,0,.12)}
.lg-input{background:#f3f4f6!important;border:1.5px solid transparent!important;border-radius:12px!important}
.lg-input:focus{background:#fff!important}
.lg-submit{border-radius:12px;background:linear-gradient(135deg,#10b981,#06b6d4)}
.lg-submit:hover{filter:brightness(1.06)}
/* ===== 悬停放大动效：所有图片缩略图 + 内容卡片/列表行 ===== */
.item-row:hover{transform:translateY(-3px) scale(1.008);box-shadow:0 12px 28px rgba(15,23,42,.12)}
.card:hover{box-shadow:0 10px 30px rgba(15,23,42,.1)}
.tag-chip{transition:all .18s ease;cursor:default}
.tag-chip:hover{transform:translateY(-2px) scale(1.1);box-shadow:0 4px 10px rgba(16,185,129,.25)}
.item-row img,[id^="imgList_"] img,[id^="prev_"] img,.stat-bar img,.file-item img{transition:transform .28s cubic-bezier(.2,.8,.2,1),box-shadow .28s ease;position:relative;will-change:transform}
.item-row img:hover,[id^="imgList_"] img:hover,[id^="prev_"] img:hover,.stat-bar img:hover,.file-item img:hover{transform:scale(1.4);z-index:30;box-shadow:0 14px 34px rgba(0,0,0,.32);border-radius:8px}
</style>
</head>
<body>
</body>
</html>
