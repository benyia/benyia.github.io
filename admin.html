<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>管理后台 - 思齐个人主页</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--primary:#10b981;--primary-light:#d1fae5;--bg:#f0fdf4;--card:#fff;--text:#1e293b;--text2:#64748b;--border:#e2e8f0;--radius:12px}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text);line-height:1.6}
.login-screen{max-width:400px;margin:100px auto;padding:40px;background:var(--card);border-radius:var(--radius);box-shadow:0 4px 20px rgba(0,0,0,.08)}
.login-screen h1{text-align:center;margin-bottom:24px;font-size:1.4rem}
.login-screen input{width:100%;padding:12px;border:1px solid var(--border);border-radius:8px;margin-bottom:12px;font-size:.95rem}
.login-screen button{width:100%;padding:12px;background:var(--primary);color:#fff;border:none;border-radius:8px;font-size:1rem;cursor:pointer}
.login-screen button:hover{background:#059669}
.main{display:none}
.topbar{background:var(--card);border-bottom:1px solid var(--border);padding:12px 24px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:100}
.topbar h1{font-size:1.1rem}
.topbar a{color:var(--primary);text-decoration:none;font-size:.88rem}
.container{max-width:1000px;margin:24px auto;padding:0 24px}
.tabs{display:flex;gap:4px;margin-bottom:20px;flex-wrap:wrap}
.tabs button{padding:8px 16px;border:none;background:var(--card);border:1px solid var(--border);border-radius:8px;cursor:pointer;font-size:.88rem}
.tabs button.active{background:var(--primary);color:#fff;border-color:var(--primary)}
.panel{display:none}
.panel.active{display:block}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:16px}
.card h2{font-size:1rem;margin-bottom:12px;padding-bottom:8px;border-bottom:1px solid var(--border)}
.item-row{padding:12px;border:1px solid var(--border);border-radius:8px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px}
.item-row .info{flex:1;min-width:200px}
.item-row .title{font-weight:600}
.item-row .desc{font-size:.82rem;color:var(--text2)}
.form-row{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.form-row input,.form-row select,.form-row textarea{padding:8px 12px;border:1px solid var(--border);border-radius:8px;font-size:.88rem;font-family:inherit}
.form-row input{flex:1;min-width:120px}
.form-row textarea{width:100%;min-height:100px;flex:1 1 100%}
.btn{padding:8px 16px;border:none;border-radius:8px;cursor:pointer;font-size:.85rem}
.btn-primary{background:var(--primary);color:#fff}
.btn-danger{background:#ef4444;color:#fff}
.btn-sm{padding:4px 10px;font-size:.78rem}
.stat-bar{display:flex;gap:12px;margin-bottom:16px}
.stat-bar .card{flex:1;text-align:center;margin:0}
.stat-bar .num{font-size:1.4rem;font-weight:700;color:var(--primary)}
.progress-input{width:80px}
.tag-chip{display:inline-block;padding:2px 8px;background:var(--primary-light);color:var(--primary);border-radius:99px;font-size:.75px;margin:2px}
.log-list{font-size:.82rem;color:var(--text2)}
.log-list .log-item{padding:6px 0;border-bottom:1px dashed var(--border)}
.notice{padding:10px 16px;background:var(--primary-light);border-radius:8px;margin-bottom:16px;font-size:.85rem;color:#065f46}
</style>
</head>
<body>

<div class="login-screen" id="loginScreen">
  <h1>🔐 管理后台</h1>
  <input type="password" id="pwdInput" placeholder="请输入密码" onkeydown="if(event.key==='Enter')login()">
  <button onclick="login()">登录</button>
</div>

<div class="main" id="mainPanel">
  <div class="topbar">
    <h1>思齐博客管理后台</h1>
    <div>
      <a href="/" target="_blank">查看前台</a> ·
      <a href="#" onclick="logout()">退出</a>
    </div>
  </div>
  <div class="container">
    <div class="notice" id="saveNotice" style="display:none">✅ 已自动保存到 GitHub</div>
    <div class="stat-bar">
      <div class="card"><div class="num" id="statC">0</div><div>课程</div></div>
      <div class="card"><div class="num" id="statP">0</div><div>论文</div></div>
      <div class="card"><div class="num" id="statN">0</div><div>通知</div></div>
      <div class="card"><div class="num" id="statT">0</div><div>时间记录</div></div>
    </div>
    <div class="tabs">
      <button class="active" data-p="site">站点设置</button>
      <button data-p="courses">课程</button>
      <button data-p="papers">论文</button>
      <button data-p="notices">通知</button>
      <button data-p="class">班级事务</button>
      <button data-p="life">生活服务</button>
      <button data-p="timeline">时间记录</button>
      <button data-p="ledger">记账</button>
      <button data-p="diary">日记</button>
      <button data-p="advisor">导师指导</button>
      <button data-p="logs">修改日志</button>
    </div>

    <div class="panel active" id="panel-site">
      <div class="card">
        <h2>站点设置</h2>
        <div class="form-row"><input type="text" id="cfgTitle" placeholder="网站标题"><input type="text" id="cfgSub" placeholder="副标题"></div>
        <div class="form-row"><textarea id="cfgAbout" placeholder="关于我的介绍..." style="min-height:150px"></textarea></div>
        <button class="btn btn-primary" onclick="saveSiteConfig()">保存设置</button>
      </div>
    </div>

    <div class="panel" id="panel-courses">
      <div class="card">
        <h2>添加课程</h2>
        <div class="form-row">
          <input type="text" id="cIcon" placeholder="图标(如📐)" style="flex:0.5">
          <input type="text" id="cTitle" placeholder="课程名称">
          <input type="text" id="cDesc" placeholder="简介">
          <input type="number" id="cProgress" placeholder="进度%" class="progress-input" value="0">
        </div>
        <div class="form-row"><textarea id="cIntro" placeholder="课程详细介绍..."></textarea></div>
        <button class="btn btn-primary" onclick="addCourse()">添加课程</button>
      </div>
      <div class="card"><h2>课程列表</h2><div id="courseList"></div></div>
    </div>

    <div class="panel" id="panel-papers">
      <div class="card">
        <h2>添加论文</h2>
        <div class="form-row">
          <input type="text" id="pTitle" placeholder="论文标题" style="flex:2">
          <select id="pStatus"><option>在投</option><option>审稿中</option><option>已接收</option><option>已发表</option><option>撰写中</option></select>
          <input type="text" id="pYear" placeholder="年份" style="flex:0.5">
        </div>
        <div class="form-row">
          <label style="font-size:.85rem;display:flex;align-items:center;gap:4px"><input type="checkbox" class="paper-tag" value="阅读"> 阅读</label>
          <label style="font-size:.85rem;display:flex;align-items:center;gap:4px"><input type="checkbox" class="paper-tag" value="撰写"> 撰写</label>
          <label style="font-size:.85rem;display:flex;align-items:center;gap:4px"><input type="checkbox" class="paper-tag" value="中文"> 中文</label>
          <label style="font-size:.85rem;display:flex;align-items:center;gap:4px"><input type="checkbox" class="paper-tag" value="英文"> 英文</label>
          <label style="font-size:.85rem;display:flex;align-items:center;gap:4px"><input type="checkbox" class="paper-tag" value="查重"> 查重</label>
          <label style="font-size:.85rem;display:flex;align-items:center;gap:4px"><input type="checkbox" class="paper-tag" value="投稿"> 投稿</label>
        </div>
        <div class="form-row"><input type="text" id="pDesc" placeholder="备注"></div>
        <button class="btn btn-primary" onclick="addPaper()">添加论文</button>
      </div>
      <div class="card"><h2>论文列表</h2><div id="paperList"></div></div>
    </div>

    <div class="panel" id="panel-notices">
      <div class="card">
        <h2>发布通知</h2>
        <div class="form-row">
          <input type="text" id="nTitle" placeholder="通知标题" style="flex:2">
          <input type="text" id="nSource" placeholder="来源(如研究生院)" style="flex:1">
          <input type="date" id="nDate" style="flex:1">
        </div>
        <div class="form-row"><textarea id="nContent" placeholder="通知正文..."></textarea></div>
        <button class="btn btn-primary" onclick="addNotice()">发布通知</button>
      </div>
      <div class="card"><h2>通知列表</h2><div id="noticeList"></div></div>
    </div>

    <div class="panel" id="panel-class">
      <div class="card">
        <h2>添加班级事务</h2>
        <div class="form-row">
          <input type="text" id="clTitle" placeholder="标题" style="flex:2">
          <select id="clType"><option>通知</option><option>作业</option><option>考试</option><option>活动</option></select>
          <input type="date" id="clDate" style="flex:1">
        </div>
        <div class="form-row"><textarea id="clContent" placeholder="详细内容..."></textarea></div>
        <button class="btn btn-primary" onclick="addClass()">添加</button>
      </div>
      <div class="card"><h2>班级事务列表</h2><div id="classList"></div></div>
    </div>

    <div class="panel" id="panel-life">
      <div class="card">
        <h2>添加生活服务链接</h2>
        <div class="form-row">
          <input type="text" id="lsIcon" placeholder="图标" style="flex:0.5">
          <input type="text" id="lsTitle" placeholder="名称" style="flex:1">
          <input type="text" id="lsDesc" placeholder="描述" style="flex:1">
          <input type="text" id="lsUrl" placeholder="链接URL" style="flex:1.5">
        </div>
        <button class="btn btn-primary" onclick="addLife()">添加</button>
      </div>
      <div class="card"><h2>生活服务列表</h2><div id="lifeList"></div></div>
    </div>

    <div class="panel" id="panel-timeline">
      <div class="card">
        <h2>添加时间记录</h2>
        <div class="form-row">
          <input type="date" id="tlDate" style="flex:1">
          <input type="text" id="tlTitle" placeholder="事件标题" style="flex:1.5">
          <input type="text" id="tlDesc" placeholder="描述" style="flex:1.5">
        </div>
        <button class="btn btn-primary" onclick="addTimeline()">添加</button>
      </div>
      <div class="card"><h2>时间记录列表</h2><div id="timelineList"></div></div>
    </div>

    <div class="panel" id="panel-ledger">
      <div class="card"><h2>记账列表</h2><div id="ledgerList"></div></div>
    </div>

    <div class="panel" id="panel-diary">
      <div class="card">
        <h2>写日记</h2>
        <div class="form-row"><textarea id="diaryContent" placeholder="今天发生了什么..."></textarea></div>
        <button class="btn btn-primary" onclick="addDiary()">保存日记</button>
      </div>
      <div class="card"><h2>日记列表</h2><div id="diaryList"></div></div>
    </div>

    <div class="panel" id="panel-advisor">
      <div class="card">
        <h2>导师指导记录</h2>
        <div class="form-row"><textarea id="advContent" placeholder="和导师聊了什么..."></textarea></div>
        <button class="btn btn-primary" onclick="addAdvisor()">保存记录</button>
      </div>
      <div class="card"><h2>指导记录列表</h2><div id="advisorList"></div></div>
    </div>

    <div class="panel" id="panel-logs">
      <div class="card"><h2>修改日志</h2><div class="log-list" id="logList"></div></div>
    </div>
  </div>
</div>

<script>
const GH_OWNER = "benyia";
const GH_REPO = "benyia.github.io";
const GH_TOKEN = "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";
const ADMIN_PWD = "syj3008338";

const DEFAULT_DATA = {
  siteConfig:{title:"思齐个人主页",subtitle:"钟爱奥迪A6"},
  courses:[],papers:[],notices:[],classItems:[],lifeServices:[],softwares:[],
  timeline:[],ledger:[],diary:[],advisor:[],logs:[]
};

let blogData=null, dataSha="";

function esc(s){return String(s||"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}

function login(){
  const p=document.getElementById("pwdInput").value;
  if(p===ADMIN_PWD){
    document.getElementById("loginScreen").style.display="none";
    document.getElementById("mainPanel").style.display="block";
    loadData();
  } else alert("密码错误");
}
function logout(){location.reload();}

async function loadData(){
  try{
    const res=await fetch("data.json?v="+Date.now());
    if(res.ok){blogData=await res.json();for(const k in DEFAULT_DATA){if(!blogData[k])blogData[k]=DEFAULT_DATA[k];}}
    else blogData=JSON.parse(JSON.stringify(DEFAULT_DATA));
  }catch(e){blogData=JSON.parse(JSON.stringify(DEFAULT_DATA));}
  renderAll();
}

async function saveData(action){
  if(action){
    blogData.logs=blogData.logs||[];
    blogData.logs.unshift({time:new Date().toLocaleString("zh-CN"),action});
    if(blogData.logs.length>100)blogData.logs=blogData.logs.slice(0,100);
  }
  try{
    const content=btoa(unescape(encodeURIComponent(JSON.stringify(blogData,null,2))));
    if(!dataSha){
      try{
        const res=await fetch(`https://api.github.com/repos/${GH_OWNER}/${GH_REPO}/contents/data.json`);
        if(res.ok){const d=await res.json();dataSha=d.sha;}
      }catch(e){}
    }
    const r=await fetch(`https://api.github.com/repos/${GH_OWNER}/${GH_REPO}/contents/data.json`,{
      method:"PUT",
      headers:{"Authorization":"token "+GH_TOKEN,"Content-Type":"application/json"},
      body:JSON.stringify({message:"Update: "+(action||"blog"),content,sha:dataSha})
    });
    if(r.ok){
      const d=await r.json();dataSha=d.content.sha;
      showNotice();
    }
  }catch(e){console.error("保存失败",e);alert("保存失败: "+e.message);}
}

function showNotice(){
  const n=document.getElementById("saveNotice");
  n.style.display="block";
  setTimeout(()=>n.style.display="none",2000);
}

function renderAll(){
  document.getElementById("cfgTitle").value=blogData.siteConfig.title||"";
  document.getElementById("cfgSub").value=blogData.siteConfig.subtitle||"";
  document.getElementById("cfgAbout").value=blogData.siteConfig.about||"";
  document.getElementById("statC").textContent=(blogData.courses||[]).length;
  document.getElementById("statP").textContent=(blogData.papers||[]).length;
  document.getElementById("statN").textContent=(blogData.notices||[]).length;
  document.getElementById("statT").textContent=(blogData.timeline||[]).length;
  renderCourses();renderPapers();renderNotices();renderClass();renderLife();
  renderTimeline();renderLedger();renderDiary();renderAdvisor();renderLogs();
}

function saveSiteConfig(){
  blogData.siteConfig.title=document.getElementById("cfgTitle").value;
  blogData.siteConfig.subtitle=document.getElementById("cfgSub").value;
  blogData.siteConfig.about=document.getElementById("cfgAbout").value;
  saveData("修改站点设置");
}

function addCourse(){
  const icon=document.getElementById("cIcon").value||"📚";
  const title=document.getElementById("cTitle").value.trim();
  const desc=document.getElementById("cDesc").value.trim();
  const progress=parseInt(document.getElementById("cProgress").value)||0;
  const intro=document.getElementById("cIntro").value.trim();
  if(!title){alert("请输入课程名称");return;}
  blogData.courses.push({icon,title,desc,intro,progress,files:[]});
  saveData("添加课程："+title);
  renderCourses();
  ["cIcon","cTitle","cDesc","cIntro"].forEach(id=>document.getElementById(id).value="");
  document.getElementById("cProgress").value=0;
}

function renderCourses(){
  document.getElementById("courseList").innerHTML=(blogData.courses||[]).map((c,i)=>`
    <div class="item-row">
      <div class="info"><div class="title">${c.icon} ${esc(c.title)}</div><div class="desc">${esc(c.desc)} · 进度${c.progress||0}%</div></div>
      <button class="btn btn-danger btn-sm" onclick="delCourse(${i})">删除</button>
    </div>`).join("")||'<div style="color:#94a3b8;font-size:.85rem">暂无</div>';
}
function delCourse(i){if(confirm("确定删除？")){blogData.courses.splice(i,1);saveData("删除课程");renderCourses();}}

function addPaper(){
  const title=document.getElementById("pTitle").value.trim();
  const status=document.getElementById("pStatus").value;
  const year=document.getElementById("pYear").value;
  const desc=document.getElementById("pDesc").value;
  const tags=[...document.querySelectorAll(".paper-tag:checked")].map(c=>c.value);
  if(!title){alert("请输入论文标题");return;}
  blogData.papers.push({title,status,year,desc,tags,file:"",fileName:""});
  saveData("添加论文："+title);
  renderPapers();
  document.getElementById("pTitle").value="";
  document.getElementById("pDesc").value="";
  document.querySelectorAll(".paper-tag").forEach(c=>c.checked=false);
}
function renderPapers(){
  document.getElementById("paperList").innerHTML=(blogData.papers||[]).map((p,i)=>`
    <div class="item-row">
      <div class="info"><div class="title">${esc(p.title)}</div><div class="desc">${p.status} · ${p.year||""} ${(p.tags||[]).map(t=>`<span class="tag-chip">${t}</span>`).join("")}</div></div>
      <button class="btn btn-danger btn-sm" onclick="delPaper(${i})">删除</button>
    </div>`).join("")||'<div style="color:#94a3b8;font-size:.85rem">暂无</div>';
}
function delPaper(i){if(confirm("确定删除？")){blogData.papers.splice(i,1);saveData("删除论文");renderPapers();}}

function addNotice(){
  const title=document.getElementById("nTitle").value.trim();
  const source=document.getElementById("nSource").value.trim();
  const date=document.getElementById("nDate").value||new Date().toISOString().slice(0,10);
  const content=document.getElementById("nContent").value.trim();
  if(!title){alert("请输入标题");return;}
  blogData.notices.push({title,source,date,level:"normal",content});
  saveData("发布通知："+title);
  renderNotices();
  ["nTitle","nSource","nContent"].forEach(id=>document.getElementById(id).value="");
}
function renderNotices(){
  document.getElementById("noticeList").innerHTML=(blogData.notices||[]).map((n,i)=>`
    <div class="item-row">
      <div class="info"><div class="title">${esc(n.title)}</div><div class="desc">${n.source} · ${n.date}</div></div>
      <button class="btn btn-danger btn-sm" onclick="delNotice(${i})">删除</button>
    </div>`).join("")||'<div style="color:#94a3b8;font-size:.85rem">暂无</div>';
}
function delNotice(i){if(confirm("确定删除？")){blogData.notices.splice(i,1);saveData("删除通知");renderNotices();}}

function addClass(){
  const title=document.getElementById("clTitle").value.trim();
  const type=document.getElementById("clType").value;
  const date=document.getElementById("clDate").value||new Date().toISOString().slice(0,10);
  const content=document.getElementById("clContent").value.trim();
  if(!title){alert("请输入标题");return;}
  blogData.classItems.push({title,type,date,content,file:"",fileName:""});
  saveData("添加班级事务："+title);
  renderClass();
  ["clTitle","clContent"].forEach(id=>document.getElementById(id).value="");
}
function renderClass(){
  document.getElementById("classList").innerHTML=(blogData.classItems||[]).map((c,i)=>`
    <div class="item-row">
      <div class="info"><div class="title">${esc(c.title)}</div><div class="desc">${c.type} · ${c.date}</div></div>
      <button class="btn btn-danger btn-sm" onclick="delClass(${i})">删除</button>
    </div>`).join("")||'<div style="color:#94a3b8;font-size:.85rem">暂无</div>';
}
function delClass(i){if(confirm("确定删除？")){blogData.classItems.splice(i,1);saveData("删除班级事务");renderClass();}}

function addLife(){
  const icon=document.getElementById("lsIcon").value||"🔗";
  const title=document.getElementById("lsTitle").value.trim();
  const desc=document.getElementById("lsDesc").value.trim();
  const url=document.getElementById("lsUrl").value.trim();
  if(!title||!url){alert("请输入名称和链接");return;}
  blogData.lifeServices.push({icon,title,desc,url});
  saveData("添加生活服务："+title);
  renderLife();
  ["lsIcon","lsTitle","lsDesc","lsUrl"].forEach(id=>document.getElementById(id).value="");
}
function renderLife(){
  document.getElementById("lifeList").innerHTML=(blogData.lifeServices||[]).map((s,i)=>`
    <div class="item-row">
      <div class="info"><div class="title">${s.icon} ${esc(s.title)}</div><div class="desc">${esc(s.desc)} · ${esc(s.url)}</div></div>
      <button class="btn btn-danger btn-sm" onclick="delLife(${i})">删除</button>
    </div>`).join("")||'<div style="color:#94a3b8;font-size:.85rem">暂无</div>';
}
function delLife(i){if(confirm("确定删除？")){blogData.lifeServices.splice(i,1);saveData("删除生活服务");renderLife();}}

function addTimeline(){
  const date=document.getElementById("tlDate").value;
  const title=document.getElementById("tlTitle").value.trim();
  const desc=document.getElementById("tlDesc").value.trim();
  if(!date||!title){alert("请输入日期和事件标题");return;}
  blogData.timeline.push({date,title,desc});
  saveData("添加时间记录："+title);
  renderTimeline();
  ["tlDate","tlTitle","tlDesc"].forEach(id=>document.getElementById(id).value="");
}
function renderTimeline(){
  document.getElementById("timelineList").innerHTML=(blogData.timeline||[]).map((t,i)=>`
    <div class="item-row">
      <div class="info"><div class="title">${esc(t.title)}</div><div class="desc">${t.date} · ${esc(t.desc)}</div></div>
      <button class="btn btn-danger btn-sm" onclick="delTimeline(${i})">删除</button>
    </div>`).join("")||'<div style="color:#94a3b8;font-size:.85rem">暂无</div>';
}
function delTimeline(i){if(confirm("确定删除？")){blogData.timeline.splice(i,1);saveData("删除时间记录");renderTimeline();}}

function renderLedger(){
  document.getElementById("ledgerList").innerHTML=(blogData.ledger||[]).slice().reverse().map((r,i)=>`
    <div class="item-row">
      <div class="info"><div class="title">${r.type==="income"?"收入":"支出"} ¥${parseFloat(r.amount).toFixed(2)}</div><div class="desc">${r.date} · ${esc(r.desc||"")}</div></div>
      <button class="btn btn-danger btn-sm" onclick="delLedger(${i})">删除</button>
    </div>`).join("")||'<div style="color:#94a3b8;font-size:.85rem">暂无</div>';
}
function delLedger(i){
  const realIdx=blogData.ledger.length-1-i;
  if(confirm("确定删除？")){blogData.ledger.splice(realIdx,1);saveData("删除记账");renderLedger();}
}

function addDiary(){
  const content=document.getElementById("diaryContent").value.trim();
  if(!content){alert("请写点内容");return;}
  blogData.diary.push({date:new Date().toISOString().slice(0,10),content});
  saveData("写日记");
  renderDiary();
  document.getElementById("diaryContent").value="";
}
function renderDiary(){
  document.getElementById("diaryList").innerHTML=(blogData.diary||[]).slice().reverse().map((d,i)=>`
    <div class="item-row">
      <div class="info"><div class="title">${d.date}</div><div class="desc" style="white-space:pre-wrap">${esc(d.content)}</div></div>
      <button class="btn btn-danger btn-sm" onclick="delDiary(${i})">删除</button>
    </div>`).join("")||'<div style="color:#94a3b8;font-size:.85rem">暂无</div>';
}
function delDiary(i){
  const realIdx=blogData.diary.length-1-i;
  if(confirm("确定删除？")){blogData.diary.splice(realIdx,1);saveData("删除日记");renderDiary();}
}

function addAdvisor(){
  const content=document.getElementById("advContent").value.trim();
  if(!content){alert("请写点内容");return;}
  blogData.advisor.push({date:new Date().toISOString().slice(0,10),content});
  saveData("添加导师指导记录");
  renderAdvisor();
  document.getElementById("advContent").value="";
}
function renderAdvisor(){
  document.getElementById("advisorList").innerHTML=(blogData.advisor||[]).slice().reverse().map((d,i)=>`
    <div class="item-row">
      <div class="info"><div class="title">${d.date}</div><div class="desc" style="white-space:pre-wrap">${esc(d.content)}</div></div>
      <button class="btn btn-danger btn-sm" onclick="delAdvisor(${i})">删除</button>
    </div>`).join("")||'<div style="color:#94a3b8;font-size:.85rem">暂无</div>';
}
function delAdvisor(i){
  const realIdx=blogData.advisor.length-1-i;
  if(confirm("确定删除？")){blogData.advisor.splice(realIdx,1);saveData("删除导师记录");renderAdvisor();}
}

function renderLogs(){
  document.getElementById("logList").innerHTML=(blogData.logs||[]).map(l=>`
    <div class="log-item"><b>${esc(l.time)}</b> — ${esc(l.action)}</div>`).join("")||'<div style="color:#94a3b8">暂无日志</div>';
}

document.querySelectorAll(".tabs button").forEach(btn=>{
  btn.onclick=()=>{
    document.querySelectorAll(".tabs button").forEach(b=>b.classList.remove("active"));
    document.querySelectorAll(".panel").forEach(p=>p.classList.remove("active"));
    btn.classList.add("active");
    document.getElementById("panel-"+btn.dataset.p).classList.add("active");
  };
});
</script>
</body>
