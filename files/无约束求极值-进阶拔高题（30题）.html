    const state = {
      typeFilter: "all",
      statusFilter: "all",
      searchQuery: "",
      visibility: {},
      progress: {}
    };

    function typesetMath(targetEl) {
      if (window.MathJax && typeof window.MathJax.typesetPromise === "function") {
        window.MathJax.typesetPromise(targetEl ? [targetEl] : undefined).catch(() => {});
      }
    }

    function loadProgress() {
      try {
        const raw = localStorage.getItem("unconstrained_opt_30_progress_v1");
        if (raw) {
          const parsed = JSON.parse(raw);
          if (parsed && typeof parsed === "object") {
            state.progress = parsed;
          }
        }
      } catch (e) {}
    }

    function saveProgress() {
      try {
        localStorage.setItem("unconstrained_opt_30_progress_v1", JSON.stringify(state.progress));
      } catch (e) {}
    }

    function initState() {
      loadProgress();
      QUESTION_CATEGORIES.forEach(cat => {
        cat.questions.forEach(q => {
          // Default to expanded so detailed solutions are immediately visible, while still allowing 1-click hide for self-testing
          state.visibility[q.qid] = { showShort: true, showDetail: true };
          if (!state.progress[q.qid]) {
            state.progress[q.qid] = { mastered: false, starred: false };
          }
        });
      });
    }

    function syncQuestionCardDOM(qid) {
      const card = document.getElementById(`card-${qid}`);
      if (!card) return;
      const vis = state.visibility[qid] || { showShort: true, showDetail: true };
      const prog = state.progress[qid] || { mastered: false, starred: false };

      const shortBox = document.getElementById(`short-box-${qid}`);
      const detailBox = document.getElementById(`detail-box-${qid}`);
      const btnShort = card.querySelector('[data-action="toggle-short"]');
      const btnDetail = card.querySelector('[data-action="toggle-detail"]');
      const btnStar = card.querySelector('[data-action="toggle-star"]');
      const btnMaster = card.querySelector('[data-action="toggle-master"]');

      if (shortBox) {
        shortBox.classList.toggle("hidden", !vis.showShort);
        shortBox.classList.toggle("block", vis.showShort);
      }
      if (detailBox) {
        detailBox.classList.toggle("hidden", !vis.showDetail);
        detailBox.classList.toggle("block", vis.showDetail);
      }
      if (btnShort) {
        btnShort.textContent = vis.showShort ? "🙈 隐藏最终结论" : "👁️ 查看最终结论";
        btnShort.className = `px-4 py-2 rounded-xl text-xs sm:text-sm font-semibold transition ${vis.showShort ? 'bg-amber-600 text-white shadow-sm' : 'bg-amber-50 text-amber-800 border border-amber-200 hover:bg-amber-100'}`;
      }
      if (btnDetail) {
        btnDetail.textContent = vis.showDetail ? "🙈 隐藏详细解析" : "📖 查看详细分步解析";
        btnDetail.className = `px-4 py-2 rounded-xl text-xs sm:text-sm font-semibold transition ${vis.showDetail ? 'bg-indigo-600 text-white shadow-sm' : 'bg-indigo-50 text-indigo-800 border border-indigo-200 hover:bg-indigo-100'}`;
      }
      if (btnStar) {
        btnStar.textContent = prog.starred ? "⭐ 已标重点" : "☆ 标为重点";
        btnStar.className = `px-3 py-1.5 rounded-xl text-xs sm:text-sm font-medium border transition ${prog.starred ? 'bg-amber-100 border-amber-300 text-amber-800' : 'bg-slate-50 border-slate-200 text-slate-600 hover:bg-slate-100'}`;
      }
      if (btnMaster) {
        btnMaster.textContent = prog.mastered ? "✅ 已掌握" : "○ 标记掌握";
        btnMaster.className = `px-3 py-1.5 rounded-xl text-xs sm:text-sm font-medium border transition ${prog.mastered ? 'bg-emerald-100 border-emerald-300 text-emerald-800' : 'bg-slate-50 border-slate-200 text-slate-600 hover:bg-slate-100'}`;
      }

      card.className = `bg-white rounded-2xl border ${prog.mastered ? 'border-emerald-300 bg-emerald-50/10' : (prog.starred ? 'border-amber-300' : 'border-slate-200/90')} shadow-sm p-6 sm:p-8 transition`;
      updateDashboardCounts();
    }

    function updateDashboardCounts() {
      let masteredTotal = 0;
      let starredTotal = 0;
      QUESTION_CATEGORIES.forEach(cat => {
        cat.questions.forEach(q => {
          const prog = state.progress[q.qid] || {};
          if (prog.mastered) masteredTotal++;
          if (prog.starred) starredTotal++;
        });
      });
      document.getElementById("statMasteredCount").textContent = masteredTotal;
      document.getElementById("statStarredCount").textContent = starredTotal;
    }

    function renderQuestions() {
      const container = document.getElementById("questionsView");
      const qLower = state.searchQuery.trim().toLowerCase();

      let visibleQuestionsCount = 0;
      const sectionsHtml = [];

      QUESTION_CATEGORIES.forEach(cat => {
        if (state.typeFilter !== "all" && cat.id !== state.typeFilter) return;

        const filteredQs = cat.questions.filter(q => {
          const prog = state.progress[q.qid] || {};
          if (state.statusFilter === "mastered" && !prog.mastered) return false;
          if (state.statusFilter === "unmastered" && prog.mastered) return false;
          if (state.statusFilter === "starred" && !prog.starred) return false;

          if (qLower) {
            const hay = (cat.title + " " + q.qid + " " + q.sourceTag + " " + q.difficulty + " " + q.stem + " " + q.shortAnswer).toLowerCase();
            if (!hay.includes(qLower)) return false;
          }
          return true;
        });

        if (filteredQs.length === 0) return;
        visibleQuestionsCount += filteredQs.length;

        const cardsHtml = filteredQs.map(q => {
          const vis = state.visibility[q.qid] || { showShort: true, showDetail: true };
          const prog = state.progress[q.qid] || { mastered: false, starred: false };

          return `
            <article id="card-${q.qid}" class="bg-white rounded-2xl border ${prog.mastered ? 'border-emerald-300 bg-emerald-50/10' : (prog.starred ? 'border-amber-300' : 'border-slate-200/90')} shadow-sm p-6 sm:p-8 transition">
              <!-- Question Top Metadata Bar -->
              <div class="flex flex-wrap items-center justify-between gap-3 pb-4 mb-5 border-b border-slate-100">
                <div class="flex flex-wrap items-center gap-2.5">
                  <span class="px-3 py-1 rounded-lg bg-slate-900 text-white text-xs sm:text-sm font-bold tracking-wide">${q.qid}</span>
                  <span class="px-3 py-1 rounded-lg bg-sky-50 text-sky-700 text-xs sm:text-sm font-semibold border border-sky-200">${q.sourceTag}</span>
                  <span class="px-2.5 py-1 rounded-lg bg-indigo-50 text-indigo-700 font-medium text-xs sm:text-sm">${q.difficulty}</span>
                </div>

                <div class="flex items-center gap-2 no-print">
                  <button data-action="toggle-star" data-qid="${q.qid}" class="px-3 py-1.5 rounded-xl text-xs sm:text-sm font-medium border transition ${prog.starred ? 'bg-amber-100 border-amber-300 text-amber-800' : 'bg-slate-50 border-slate-200 text-slate-600 hover:bg-slate-100'}">
                    ${prog.starred ? '⭐ 已标重点' : '☆ 标为重点'}
                  </button>
                  <button data-action="toggle-master" data-qid="${q.qid}" class="px-3 py-1.5 rounded-xl text-xs sm:text-sm font-medium border transition ${prog.mastered ? 'bg-emerald-100 border-emerald-300 text-emerald-800' : 'bg-slate-50 border-slate-200 text-slate-600 hover:bg-slate-100'}">
                    ${prog.mastered ? '✅ 已掌握' : '○ 标记掌握'}
                  </button>
                </div>
              </div>

              <!-- Spacious Question Stem -->
              <div class="text-base sm:text-lg text-slate-800 font-medium leading-loose mb-6">
                ${q.stem}
              </div>

              <!-- Toggle Answer Buttons -->
              <div class="flex flex-wrap items-center gap-3 pt-4 border-t border-slate-100 no-print">
                <button data-action="toggle-short" data-qid="${q.qid}" class="px-4 py-2 rounded-xl text-xs sm:text-sm font-semibold transition ${vis.showShort ? 'bg-amber-600 text-white shadow-sm' : 'bg-amber-50 text-amber-800 border border-amber-200 hover:bg-amber-100'}">
                  ${vis.showShort ? '🙈 隐藏最终结论' : '👁️ 查看最终结论'}
                </button>
                <button data-action="toggle-detail" data-qid="${q.qid}" class="px-4 py-2 rounded-xl text-xs sm:text-sm font-semibold transition ${vis.showDetail ? 'bg-indigo-600 text-white shadow-sm' : 'bg-indigo-50 text-indigo-800 border border-indigo-200 hover:bg-indigo-100'}">
                  ${vis.showDetail ? '🙈 隐藏详细解析' : '📖 查看详细分步解析'}
                </button>
              </div>

              <!-- Collapsible Short Answer Box -->
              <div id="short-box-${q.qid}" class="${vis.showShort ? 'block' : 'hidden'} print-expand mt-5 p-5 rounded-2xl bg-amber-50/80 border border-amber-200 text-sm sm:text-base text-slate-800 leading-relaxed">
                <div class="font-bold text-amber-900 mb-2 flex items-center gap-1.5">
                  <span>🎯 最终结论汇总</span>
                </div>
                <div>${q.shortAnswer}</div>
              </div>

              <!-- Collapsible Detailed Step-by-Step Solution Box -->
              <div id="detail-box-${q.qid}" class="${vis.showDetail ? 'block' : 'hidden'} print-expand mt-5 p-6 sm:p-7 rounded-2xl bg-slate-50/90 border border-indigo-200/90 text-sm sm:text-base text-slate-800 leading-loose">
                <div class="font-bold text-indigo-950 text-base sm:text-lg mb-4 pb-3 border-b border-indigo-100 flex flex-wrap items-center justify-between gap-2">
                  <span>📐 详细分步解题与推导过程</span>
                  <span class="text-xs sm:text-sm font-normal text-indigo-600">${cat.title}</span>
                </div>
                <div class="space-y-4">
                  ${q.detailedSolution}
                </div>
              </div>
            </article>
          `;
        }).join("");

        sectionsHtml.push(`
          <div class="bg-white/80 rounded-3xl border border-slate-200/90 p-6 sm:p-9 shadow-sm">
            <!-- Category Header -->
            <div class="flex flex-wrap items-center justify-between gap-3 mb-6 pb-4 border-b border-slate-200/80">
              <div>
                <h2 class="text-lg sm:text-xl font-bold text-slate-900">${cat.title}</h2>
              </div>
              <div class="flex items-center gap-2.5 no-print">
                <button data-cat-action="show-cat" data-cat="${cat.id}" class="text-xs sm:text-sm px-3.5 py-1.5 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-700 font-medium transition">展开本组 5 题解析</button>
                <button data-cat-action="hide-cat" data-cat="${cat.id}" class="text-xs sm:text-sm px-3.5 py-1.5 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-700 font-medium transition">隐藏本组 5 题答案</button>
              </div>
            </div>

            <!-- Spacious 5 Questions Stack -->
            <div class="space-y-7">
              ${cardsHtml}
            </div>
          </div>
        `);
      });

      if (sectionsHtml.length === 0) {
        container.innerHTML = `
          <div class="bg-white rounded-3xl border border-slate-200 p-14 text-center">
            <div class="text-4xl mb-3">🔍</div>
            <h3 class="text-lg font-bold text-slate-800">没有找到匹配的题目</h3>
            <p class="text-sm text-slate-500 mt-1.5">请尝试切换题型筛选、状态筛选或清空搜索关键词。</p>
            <button id="btnResetFiltersEmpty" class="mt-5 px-5 py-2.5 rounded-xl bg-blue-600 text-white text-sm font-semibold hover:bg-blue-500 transition">恢复显示全部 30 道题</button>
          </div>
        `;
        const resetBtn = document.getElementById("btnResetFiltersEmpty");
        if (resetBtn) {
          resetBtn.addEventListener("click", () => {
            state.typeFilter = "all";
            state.statusFilter = "all";
            state.searchQuery = "";
            document.getElementById("typeSelect").value = "all";
            document.getElementById("searchInput").value = "";
            document.getElementById("btnClearSearch").classList.add("hidden");
            updateStatusFilterUI();
            renderQuestions();
          });
        }
      } else {
        container.innerHTML = sectionsHtml.join("");
      }

      document.getElementById("statVisibleCount").textContent = visibleQuestionsCount;
      updateDashboardCounts();
      typesetMath(container);
    }

    function updateStatusFilterUI() {
      document.querySelectorAll(".status-filter-btn").forEach(btn => {
        const val = btn.getAttribute("data-status-filter");
        if (val === state.statusFilter) {
          btn.className = "status-filter-btn px-3 py-1 rounded-lg bg-white text-slate-800 font-medium shadow-sm";
        } else {
          btn.className = "status-filter-btn px-3 py-1 rounded-lg text-slate-600 hover:text-slate-900";
        }
      });
    }

    document.addEventListener("DOMContentLoaded", () => {
      initState();
      renderQuestions();

      document.getElementById("btnHideAll").addEventListener("click", () => {
        Object.keys(state.visibility).forEach(qid => {
          state.visibility[qid] = { showShort: false, showDetail: false };
          syncQuestionCardDOM(qid);
        });
        document.getElementById("statModeLabel").textContent = "全部已隐藏 (自测模式)";
        document.getElementById("statModeLabel").className = "text-emerald-700";
      });

      document.getElementById("btnShowAnswersOnly").addEventListener("click", () => {
        Object.keys(state.visibility).forEach(qid => {
          state.visibility[qid] = { showShort: true, showDetail: false };
          syncQuestionCardDOM(qid);
        });
        document.getElementById("statModeLabel").textContent = "仅看全部最终结论";
        document.getElementById("statModeLabel").className = "text-amber-700";
        typesetMath(document.getElementById("questionsView"));
      });

      document.getElementById("btnShowAllFull").addEventListener("click", () => {
        Object.keys(state.visibility).forEach(qid => {
          state.visibility[qid] = { showShort: true, showDetail: true };
          syncQuestionCardDOM(qid);
        });
        document.getElementById("statModeLabel").textContent = "已展开全部答案与详解";
        document.getElementById("statModeLabel").className = "text-indigo-700";
        typesetMath(document.getElementById("questionsView"));
      });

      document.getElementById("typeSelect").addEventListener("change", (e) => {
        state.typeFilter = e.target.value;
        renderQuestions();
      });

      document.querySelectorAll(".status-filter-btn").forEach(btn => {
        btn.addEventListener("click", () => {
          state.statusFilter = btn.getAttribute("data-status-filter");
          updateStatusFilterUI();
          renderQuestions();
        });
      });

      const searchInput = document.getElementById("searchInput");
      const btnClearSearch = document.getElementById("btnClearSearch");
      searchInput.addEventListener("input", (e) => {
        state.searchQuery = e.target.value;
        btnClearSearch.classList.toggle("hidden", !state.searchQuery);
        renderQuestions();
      });
      btnClearSearch.addEventListener("click", () => {
        state.searchQuery = "";
        searchInput.value = "";
        btnClearSearch.classList.add("hidden");
        renderQuestions();
      });

      document.getElementById("btnResetProgress").addEventListener("click", () => {
        Object.keys(state.progress).forEach(qid => {
          state.progress[qid] = { mastered: false, starred: false };
          syncQuestionCardDOM(qid);
        });
        saveProgress();
        if (state.statusFilter !== "all") renderQuestions();
      });

      document.getElementById("questionsView").addEventListener("click", (e) => {
        const actionBtn = e.target.closest("[data-action]");
        if (actionBtn) {
          const action = actionBtn.getAttribute("data-action");
          const qid = actionBtn.getAttribute("data-qid");
          if (!qid) return;

          if (action === "toggle-short") {
            state.visibility[qid].showShort = !state.visibility[qid].showShort;
            syncQuestionCardDOM(qid);
            typesetMath(document.getElementById(`card-${qid}`));
          } else if (action === "toggle-detail") {
            const nextState = !state.visibility[qid].showDetail;
            state.visibility[qid].showDetail = nextState;
            if (nextState) state.visibility[qid].showShort = true;
            syncQuestionCardDOM(qid);
            typesetMath(document.getElementById(`card-${qid}`));
          } else if (action === "toggle-master") {
            state.progress[qid].mastered = !state.progress[qid].mastered;
            saveProgress();
            if (state.statusFilter === "mastered" || state.statusFilter === "unmastered") {
              renderQuestions();
            } else {
              syncQuestionCardDOM(qid);
            }
          } else if (action === "toggle-star") {
            state.progress[qid].starred = !state.progress[qid].starred;
            saveProgress();
            if (state.statusFilter === "starred") {
              renderQuestions();
            } else {
              syncQuestionCardDOM(qid);
            }
          }
          return;
        }

        const catBtn = e.target.closest("[data-cat-action]");
        if (catBtn) {
          const catAction = catBtn.getAttribute("data-cat-action");
          const catId = catBtn.getAttribute("data-cat");
          const catObj = QUESTION_CATEGORIES.find(c => c.id === catId);
          if (!catObj) return;
          catObj.questions.forEach(q => {
            if (catAction === "show-cat") {
              state.visibility[q.qid] = { showShort: true, showDetail: true };
            } else {
              state.visibility[q.qid] = { showShort: false, showDetail: false };
            }
            syncQuestionCardDOM(q.qid);
          });
          typesetMath(document.getElementById("questionsView"));
        }
      });
    });
  </script>
</body>
</html>
