g_ref": "原题26第5空 [E]", "explanation": "固定搭配 the inner workings of a computer 意为“计算机的内部运行机制”。"}, {"num": 6, "word": "obsessive", "opt": "C", "pos": "adj.", "pos_type": "adj", "meaning": "执着的，痴迷的", "orig_ref": "原题26第6空 [C]", "explanation": "obsessive about facts and truthfulness 意为“对事实与真极其执着”。"}, {"num": 7, "word": "controlling", "opt": "L", "pos": "adj.", "pos_type": "adj", "meaning": "控制欲强的", "orig_ref": "原题26第7空 [L]", "explanation": "与 brash, ambitious 并列描述乔布斯的性格：鲁莽、雄心勃勃且“控制欲极强（controlling）”。"}, {"num": 8, "word": "neat", "opt": "F", "pos": "adj.", "pos_type": "adj", "meaning": "精巧的，绝妙的", "orig_ref": "原题26第8空 [F]", "explanation": "coming up with a neat invention 意为“想出一项精巧绝妙的发明”。"}, {"num": 9, "word": "away", "opt": "B", "pos": "adv.", "pos_type": "adv", "meaning": "免费送人 (give away)", "orig_ref": "原题26第9空 [B]", "explanation": "固定短语 give away 意为“免费赠送（沃兹尼亚克很乐意把发明免费分享出去，而乔布斯则负责把它包装上市赚钱）”。"}, {"num": 10, "word": "nurtured", "opt": "G", "pos": "v.", "pos_type": "verb", "meaning": "培养，维系", "orig_ref": "原题26第10空 [G]", "explanation": "how are they nurtured? 指“这样的合作关系是如何培育和维系的？”。"}], "vocab": [["intriguing", "adj. 引人入胜的，非常有趣的"], ["a host of", "phr. 许多，一大群"], ["synergy", "n. 协同作用，合力"], ["inner workings", "n. 内部运作机制"], ["brash", "adj. 狂妄的，鲁莽自信的"], ["give away", "phr. 免费赠送，分发"]], "translation": "如果一个人对科技感兴趣，那么书中对乔布斯大学时期及二十多岁经历的记载就会变得十分引人入胜（intriguing）。那段时间里，乔布斯开始热衷于电子技术、迷幻药、文学以及许多（a host of）其他体验。但那一时期最重要的事件之一，是他结识了沃兹尼亚克——后来与他一起创立（founding）苹果公司的合伙人。当其他男孩还在打球时，乔布斯和沃兹尼亚克已经在乔布斯家的车库里造出了他们的第一台电脑。他们俩形成了强大的（powerful）技能互补：沃兹尼亚克精通计算机的内部（inner）运行机制，而乔布斯则对产品的设计与实用性有着天生的直觉。沃兹尼亚克生性腼腆，对公众的赞誉感到局促不安，却对事实与真极其执着（obsessive）。相反，乔布斯则狂妄、野心勃勃且控制欲极强（controlling）。沃兹尼亚克就像一位温和的魔法师，能捣鼓出精巧的（neat）发明，而且很乐意免费送人（give away）；而乔布斯则会想办法让它变得简单易用，将它整合包装起来推向市场，顺便赚上一笔。他们的合伙关系放在今天依然能引发丰富的探讨：这种伙伴关系是如何被培育（nurtured）出来的？而人与上帝的关系本质又是怎样的？"}, {"unit_id": "4.4", "unit_title": "单元 4.4：第一台 iPad 的开箱震撼、至简设计与日本禅宗美学", "orig_questions": [12], "is_merged": false, "error_note": null, "word_bank": [["A", "recalled", "v.", "回忆起"], ["B", "perhaps", "adv.", "或许，大概"], ["C", "honorably", "adv.", "体面地，光荣地"], ["D", "reminded", "v.", "使想起 (remind sb. of sth.)"], ["E", "design", "n.", "设计"], ["F", "brought", "v.", "结合 (bring together)"], ["G", "clear", "adj.", "透明的，清晰的"], ["H", "impression", "n.", "印象"], ["I", "instinct", "n.", "本能，直觉"], ["J", "reaction", "n.", "反应 (reaction to)"], ["K", "building", "v.", "打造，建造"], ["L", "marvellous", "adj.", "绝妙的，极好的"], ["M", "reverently", "adv.", "恭敬地，虔诚地"], ["N", "motive", "n.", "动机"], ["O", "using", "v.", "使用"]], "orig_q_keys": [{"q_num": 12, "summary": "1-D (reminded) | 2-G (clear) | 3-I (instinct) | 4-M (reverently) | 5-J (reaction) | 6-K (building) | 7-L (marvellous) | 8-F (brought) | 9-E (design) | 10-B (perhaps)"}], "passage_parts": ["When I obtained my first iPad, it came in a box that ", {"b": 1}, " me of rich European chocolates. The iPad inside was wrapped in a ", {"b": 2}, " film. When I lifted the iPad from the box, my first ", {"b": 3}, " was to hold it ", {"b": 4}, " in my hands as I might a piece of art. Everything about it — its appearance, its feel, its solidity — evoked a kind of awe. When its screen lit up and I acquainted myself with the many things the iPad could do, I was dazzled — just as Steve Jobs had willed it to be. My first ", {"b": 5}, " to my iPad was first imagined in the Apple labs where Jobs and his people spent thousands of hours ", {"b": 6}, " something that was not only easy to use but ", {"b": 7}, " to look at. It was art and technology ", {"b": 8}, " together in one elegant package. Apple products are known for their simplicity in both ", {"b": 9}, " and utility. ", {"b": 10}, " this was inspired by Jobs's attraction to Japanese Zen Buddhism. In this frame of reference, simplicity, wholeness, integrity, freedom from numbing complexity all reflect a sense of calmness."], "blanks": [{"num": 1, "word": "reminded", "opt": "D", "pos": "v.", "pos_type": "verb", "meaning": "使想起", "orig_ref": "原题12第1空 [D]", "explanation": "固定搭配 remind sb. of sth. 意为“使我想起了精致的欧洲巧克力礼盒”（注意 recalled 不能直接用于 recall sb. of sth.）。"}, {"num": 2, "word": "clear", "opt": "G", "pos": "adj.", "pos_type": "adj", "meaning": "透明的", "orig_ref": "原题12第2空 [G]", "explanation": "wrapped in a clear film 意为“包裹在一层透明薄膜里”。"}, {"num": 3, "word": "instinct", "opt": "I", "pos": "n.", "pos_type": "noun", "meaning": "本能，直觉反应", "orig_ref": "原题12第3空 [I]", "explanation": "my first instinct was to hold it... 意为“我的第一本能反应就是像捧着艺术品一样捧着它”。"}, {"num": 4, "word": "reverently", "opt": "M", "pos": "adv.", "pos_type": "adv", "meaning": "恭敬地，虔诚地", "orig_ref": "原题12第4空 [M]", "explanation": "修饰动词 hold，与后文 as I might a piece of art 及 evoked a kind of awe 呼应，表示“虔诚恭敬地（reverently）捧在手里”。"}, {"num": 5, "word": "reaction", "opt": "J", "pos": "n.", "pos_type": "noun", "meaning": "反应", "orig_ref": "原题12第5空 [J]", "explanation": "与介词 to 搭配，My first reaction to my iPad 意为“我对 iPad 的第一反应（其实早在苹果实验室里就被乔布斯预先设想好了）”。"}, {"num": 6, "word": "building", "opt": "K", "pos": "v.", "pos_type": "verb", "meaning": "打造，制造", "orig_ref": "原题12第6空 [K]", "explanation": "spend time (in) doing sth.，spent thousands of hours building something 意为“花费数千小时打造出一件产品”。"}, {"num": 7, "word": "marvellous", "opt": "L", "pos": "adj.", "pos_type": "adj", "meaning": "绝妙的，极好看的", "orig_ref": "原题12第7空 [L]", "explanation": "与 easy to use 并列，not only easy to use but marvellous to look at 意为“不仅易于使用，而且外观惊艳”。"}, {"num": 8, "word": "brought", "opt": "F", "pos": "v.", "pos_type": "verb", "meaning": "融合 (brought together)", "orig_ref": "原题12第8空 [F]", "explanation": "过去分词短语 brought together 作后置定语，art and technology brought together in one elegant package 意为“融合在一个优雅包装中的艺术与科技”。"}, {"num": 9, "word": "design", "opt": "E", "pos": "n.", "pos_type": "noun", "meaning": "设计", "orig_ref": "原题12第9空 [E]", "explanation": "simplicity in both design and utility 意为“在设计与实用性两方面的极简主义”。"}, {"num": 10, "word": "Perhaps", "opt": "B", "pos": "adv.", "pos_type": "adv", "meaning": "或许", "orig_ref": "原题12第10空 [B]", "explanation": "位于句首修饰全句，Perhaps this was inspired by... 意为“或许这一理念受到了乔布斯对日本禅宗着迷的启发”。"}], "vocab": [["remind sb. of sth.", "phr. 使某人想起某物"], ["reverently", "adv. 虔诚地，恭敬地"], ["evoke a kind of awe", "phr. 唤起一种敬畏感"], ["acquaint oneself with", "phr. 熟悉，了解"], ["Zen Buddhism", "n. 禅宗"], ["frame of reference", "n. 参照系，思维框架"]], "translation": "当我拿到自己的第一台 iPad 时，它的包装盒让我联想到（reminded）精致的欧洲巧克力。里面的 iPad 包裹在一层透明（clear）薄膜中。当我把 iPad 从盒子里托起时，我的第一本能（instinct）就是像捧着一件艺术品那样，虔诚恭敬地（reverently）将它捧在手中。关于它的一切——它的外观、触感、厚重扎实感——都唤起了一种敬畏之情。当屏幕亮起，我逐渐熟悉了 iPad 所能完成的众多功能时，我深深为之折服——这正是史蒂夫·乔布斯想要达到的效果。我对 iPad 的第一反应（reaction），其实早在苹果实验室里就被预先设想出来了，乔布斯和他的团队在那里花费了数千个小时，只为打造（building）出一件不仅简单易用、而且赏心悦目（marvellous）的产品。那是融汇（brought together）于一个优雅整体中的艺术与科技。苹果产品以其在设计（design）与实用性两方面的至简风格而闻名。或许（Perhaps）这是受到了乔布斯对日本禅宗着迷的启发。在这一思维框架下，极简、完整、纯粹以及摆脱令人麻木的繁复，全都映照出一种宁静感。"}, {"unit_id": "4.5", "unit_title": "单元 4.5：“现实扭曲力场”、任务驱动型领导力与领导者的隐秘诱惑（合并原题 4 & 原题 32）", "orig_questions": [4, 32], "is_merged": true, "error_note": "⚠️【原图错题重点纠偏】原PDF第2页截图中，第4题第6空（a chosen one, an ___ one）被误填为 I (dishonest)！首先不定冠词 `an` 后必须接元音音素开头的词（`enlightened` 以元音开头，而 `dishonest` 以辅音开头）；其次语境指乔布斯受禅宗影响自视为“天选之子、开悟者（an enlightened one）”，故第6空正确答案为 L. enlightened！本单元同时合并了后半段重叠的【原题32】。", "word_bank": [["原题4-E", "borrowed", "v.", "借用 (borrowed from)"], ["原题4-M", "Plainly", "adv.", "直白地说，坦率地"], ["原题4-J", "convinced", "v.", "说服，使确信"], ["原题4-A", "apply", "v.", "适用 (apply to)"], ["原题4-O", "willfulness", "n.", "任性，固执"], ["原题4-L", "enlightened", "adj.", "开悟的，觉悟的【修正原图错填I】"], ["原题32-A", "atmosphere", "n.", "氛围，环境"], ["原题32-C", "conundrum", "n.", "难题，吊诡之处"], ["原题4-B", "shipped", "v.", "出货，上市交付"], ["原题32-D", "demanded", "v.", "要求"], ["原题4-K", "leadership", "n.", "领导力，领导方式"], ["原题32-F", "ascended", "v.", "晋升，攀升"], ["原题32-O", "pattern", "n.", "模式"], ["原题32-H", "harshly", "adv.", "严厉地，苛刻地"], ["原题4-N", "criticize", "v.", "批评"], ["原题4-F / 32-L", "latent", "adj.", "潜在的，潜伏的"], ["原题32-I", "included", "v./adj.", "包括在内的 (Christians included)"], ["原题32-E", "enhances", "v.", "夸大，拔高"], ["原题32-M", "raised", "v.", "筹集 (raise money)"]], "orig_q_keys": [{"q_num": 4, "summary": "1-E (borrowed) | 2-M (Plainly) | 3-J (convinced) | 4-A (apply) | 5-O (willfulness) | 6-L (enlightened)【修正原图错填I】 | 7-B (shipped) | 8-K (leadership) | 9-N (criticize) | 10-F (latent)"}, {"q_num": 32, "summary": "1-A (atmosphere) | 2-C (conundrum) | 3-D (demanded) | 4-F (ascended) | 5-O (pattern) | 6-H (harshly) | 7-L (latent) | 8-I (included) | 9-E (enhances) | 10-M (raised)"}], "passage_parts": ["Those who worked around Jobs spoke, and sometimes joked, about his reality distortion field, a term ", {"b": 1}, " from the Star Trek TV series. In a few words, Steve Jobs often tried to talk things into existence. ", {"b": 2}, " put [out], Jobs could lie, make unkeepable promises, and reframe facts. He not only ", {"b": 3}, " others but also himself. At the root of the reality distortion was Jobs's belief that the rules didn't ", {"b": 4}, " to him. Rebelliousness and ", {"b": 5}, " were ingrained in his character. He had the sense that he was special, a chosen one, an ", {"b": 6}, " one. In the Steve Jobs world, the casualty rate in such a Darwinian ", {"b": 7}, " was great. But — and here is the ", {"b": 8}, " — the work usually got done, the objectives were achieved, the products ", {"b": 9}, ". More often than not, people delivered the impossible that Jobs ", {"b": 10}, ". Call it a task-driven ", {"b": 11}, ". But it wasn't a place where people with values ", {"b": 12}, ". Only the toughest survived. It's not difficult to see this ", {"b": 13}, " of task-driven leadership in a larger-than-life man like Steve Jobs and to ", {"b": 14}, " ", {"b": 15}, " it. What is more challenging is seeing that this same tendency lies ", {"b": 16}, " in the hearts of most leaders — Christians ", {"b": 17}, ". A great goal, a strong passion, a consuming need: they are the stuff of self-justification when a leader comes to believe that something must be achieved for the noblest of reasons. It is the temptation of the preacher who, in seeking to persuade, ", {"b": 18}, " or diminishes the truth to make his point. It is the temptation of any organizational leader when additional money must be ", {"b": 19}, " to keep the cause afloat."], "blanks": [{"num": 1, "word": "borrowed", "opt": "原题4-E", "pos": "v.", "pos_type": "verb", "meaning": "借用", "orig_ref": "原题4第1空 [E]", "explanation": "过去分词短语 borrowed from the Star Trek TV series 作后置定语修饰 a term，意为“一个借自《星际迷航》电视剧的词”。"}, {"num": 2, "word": "Plainly", "opt": "原题4-M", "pos": "adv.", "pos_type": "adv", "meaning": "直白地说", "orig_ref": "原题4第2空 [M]", "explanation": "Plainly put（题干误印为 Plainly out）为固定表达，意为“直白地说、坦率地讲”，且首字母大写。"}, {"num": 3, "word": "convinced", "opt": "原题4-J", "pos": "v.", "pos_type": "verb", "meaning": "说服，使相信", "orig_ref": "原题4第3空 [J]", "explanation": "He not only convinced others but also himself 意为“他不仅说服了别人，连他自己也信以为真”。"}, {"num": 4, "word": "apply", "opt": "原题4-A", "pos": "v.", "pos_type": "verb", "meaning": "适用", "orig_ref": "原题4第4空 [A]", "explanation": "固定搭配 the rules didn't apply to him 意为“规则对他不适用”。"}, {"num": 5, "word": "willfulness", "opt": "原题4-O", "pos": "n.", "pos_type": "noun", "meaning": "任性，固执", "orig_ref": "原题4第5空 [O]", "explanation": "与名词 Rebelliousness（叛逆）并列作主语，填名词 willfulness（任性）。"}, {"num": 6, "word": "enlightened", "opt": "原题4-L", "pos": "adj.", "pos_type": "adj", "meaning": "开悟的，觉悟的", "orig_ref": "原题4第6空 [L]（纠偏）", "explanation": "【纠偏：原图误填I】不定冠词 an 后必须接元音音素开头的词；special, a chosen one, an enlightened one 意为“与众不同的人、天选之子、开悟者”。"}, {"num": 7, "word": "atmosphere", "opt": "原题32-A", "pos": "n.", "pos_type": "noun", "meaning": "氛围，环境", "orig_ref": "原题32第1空 [A]", "explanation": "in such a Darwinian atmosphere 意为“在这样一种弱肉强食的达尔文式氛围中”。"}, {"num": 8, "word": "conundrum", "opt": "原题32-C", "pos": "n.", "pos_type": "noun", "meaning": "难题，矛盾吊诡之处", "orig_ref": "原题32第2空 [C]", "explanation": "here is the conundrum 指“但吊诡/令人困惑的地方就在这里（虽然淘汰率极高，但工作总能完成）”。"}, {"num": 9, "word": "shipped", "opt": "原题4-B", "pos": "v.", "pos_type": "verb", "meaning": "出货，交付上市", "orig_ref": "原题4第7空 [B]", "explanation": "与 the work usually got done, the objectives were achieved 并列，the products shipped 意为“产品按期出货上市”。"}, {"num": 10, "word": "demanded", "opt": "原题32-D", "pos": "v.", "pos_type": "verb", "meaning": "要求", "orig_ref": "原题32第3空 [D]", "explanation": "delivered the impossible that Jobs demanded 意为“完成了乔布斯所要求的不可能完成的任务”。"}, {"num": 11, "word": "leadership", "opt": "原题4-K", "pos": "n.", "pos_type": "noun", "meaning": "领导方式，领导力", "orig_ref": "原题4第8空 [K]", "explanation": "Call it a task-driven leadership 意为“不妨称之为任务驱动型领导方式”。"}, {"num": 12, "word": "ascended", "opt": "原题32-F", "pos": "v.", "pos_type": "verb", "meaning": "晋升，得势", "orig_ref": "原题32第4空 [F]", "explanation": "it wasn't a place where people with values ascended 意为“但那不是一个坚守道德价值观的人能够步步高升的地方”。"}, {"num": 13, "word": "pattern", "opt": "原题32-O", "pos": "n.", "pos_type": "noun", "meaning": "模式", "orig_ref": "原题32第5空 [O]", "explanation": "see this pattern (of task-driven leadership) 意为“看清这种任务驱动型领导力的模式”。"}, {"num": 14, "word": "harshly", "opt": "原题32-H", "pos": "adv.", "pos_type": "adv", "meaning": "严厉地", "orig_ref": "原题32第6空 [H]", "explanation": "修饰动词 criticize，to harshly criticize it 意为“严厉地批评它”。"}, {"num": 15, "word": "criticize", "opt": "原题4-N", "pos": "v.", "pos_type": "verb", "meaning": "批评", "orig_ref": "原题4第9空 [N]", "explanation": "to harshly criticize it 意为“严厉地批评它”。"}, {"num": 16, "word": "latent", "opt": "原题4-F / 32-L", "pos": "adj.", "pos_type": "adj", "meaning": "潜在的，潜伏的", "orig_ref": "原题4第10空 [F] / 原题32第7空 [L]", "explanation": "【两题共考】固定搭配 lie latent in... 意为“潜伏在大多数领导者的内心深处”。"}, {"num": 17, "word": "included", "opt": "原题32-I", "pos": "adj./v.", "pos_type": "adj", "meaning": "包括在内的", "orig_ref": "原题32第8空 [I]", "explanation": "Christians included 为独立主格结构，意为“包括基督教领袖在内”。"}, {"num": 18, "word": "enhances", "opt": "原题32-E", "pos": "v.", "pos_type": "verb", "meaning": "夸大，拔高", "orig_ref": "原题32第9空 [E]", "explanation": "与 or diminishes（弱化/缩小）构成反义并列，enhances or diminishes the truth 意为“夸大或弱化事实真相”。"}, {"num": 19, "word": "raised", "opt": "原题32-M", "pos": "v.", "pos_type": "verb", "meaning": "筹集 (raise money)", "orig_ref": "原题32第10空 [M]", "explanation": "additional money must be raised 意为“必须筹集更多资金以维持事业运转”。"}], "vocab": [["reality distortion field", "n. 现实扭曲力场"], ["reframe", "v. 重新包装，重构"], ["willfulness", "n. 任性，固执己见"], ["ingrained", "adj. 根深蒂固的"], ["conundrum", "n. 难题，吊诡之处"], ["larger-than-life", "adj. 极具传奇色彩的，非凡的"], ["lie latent", "phr. 潜伏，潜在"]], "translation": "在乔布斯身边工作的人常谈起、有时也调侃他的“现实扭曲力场”——一个借自（borrowed）《星际迷航》电视剧的词。简而言之，史蒂夫·乔布斯常常试图单凭言辞就把事情变成现实。直白地说（Plainly put），乔布斯会撒谎、许下无法兑现的诺言、肆意重构事实。他不仅说服了（convinced）别人，甚至连他自己都信以为真。现实扭曲力场的根源在于乔布斯深信常规法则对他并不适用（apply）。叛逆与任性（willfulness）深深植根于他的性格之中。他觉得自己与众不同，是天选之子，是一个开悟者（enlightened）。在史蒂夫·乔布斯的世界里，这种优胜劣汰的达尔文式氛围（atmosphere）下的淘汰率极高。然而——吊诡之处（conundrum）正在于此——工作通常都能完成，目标得以实现，产品按期出货上市（shipped）。十有八九，人们真的完成了乔布斯所要求（demanded）的不可能完成的任务。不妨称之为一种任务驱动型领导力（leadership）。但那里绝不是一个讲究温和价值观的人能够步步高升（ascended）的地方，只有最坚韧的人才能生存下来。在史蒂夫·乔布斯这样极具传奇色彩的人物身上看清这种任务驱动型领导力的模式（pattern），并对其加以严厉（harshly）批评（criticize），其实并不难。真正更具挑战性的，是看清这种同样的倾向其实潜伏（lies latent）在大多数领导者的内心深处——包括（included）基督教领袖在内。远大的目标、强烈的激情、迫切的需要：当一位领导者相信为了最崇高的理由必须不惜一切达成某事时，这些就会成为自我开脱的借口。这正是传道者为了说服听众、证明自己的观点而去夸大（enhances）或缩减事实真相时的诱惑；这也是任何组织领导者在必须筹集（raised）更多资金以维持事业运转时所面临的诱惑。"}, {"unit_id": "4.6", "unit_title": "单元 4.6：暴躁多变的性格、30岁被苹果抛弃的屈辱与自我审视", "orig_questions": [29], "is_merged": false, "error_note": null, "word_bank": [["A", "adjusted to", "phr.", "适应，顺应"], ["B", "motivated", "adj.", "有动力的，积极进取的"], ["C", "root", "n.", "根源"], ["D", "happens", "v.", "发生 (As often happens)"], ["E", "personality", "n.", "性格，个性"], ["F", "winner", "n.", "赢家"], ["G", "motion", "n.", "运动"], ["H", "intolerable", "adj.", "无法忍受的"], ["I", "incurable", "adj.", "不可治愈的"], ["J", "expectations", "n.", "期望，预期"], ["K", "abandoned", "v.", "抛弃，遗弃"], ["L", "rare", "adj.", "罕见的"], ["M", "humiliation", "n.", "屈辱，羞辱"], ["N", "turns", "v.", "转变"], ["O", "terms", "n.", "方面 (in terms of)"]], "orig_q_keys": [{"q_num": 29, "summary": "1-D (happens) | 2-A (adjusted to) | 3-E (personality) | 4-B (motivated) | 5-J (expectations) | 6-O (terms) | 7-H (intolerable) | 8-K (abandoned) | 9-M (humiliation) | 10-C (root)"}], "passage_parts": ["As often ", {"b": 1}, ", the people at Apple mostly ", {"b": 2}, " Steve Jobs's way because, in spite of his volatile ", {"b": 3}, ", he caused highly talented and ", {"b": 4}, " people to achieve things beyond their own wildest ", {"b": 5}, ". If one was tough enough to accept the abuse involved in working for and with Steve Jobs, the success in ", {"b": 6}, " of wealth, fame, and professional satisfaction was enormous. But one day the board of Apple reached a point of ", {"b": 7}, " frustration with Jobs. At the age of 30, Steve Jobs found himself out of a job. He once again experienced the echoes of rejection, abandonment — but this time at the age of 30. The man who'd often abandoned others was himself ", {"b": 8}, ". Those had to be moments of massive ", {"b": 9}, " and self-searching. Was anything to be learned? While Jobs may have been able to identify his failures in executive leadership, I doubt if he ever looked inside himself to seek the ", {"b": 10}, " of the many faults and flaws that often made working with him an intolerable experience."], "blanks": [{"num": 1, "word": "happens", "opt": "D", "pos": "v.", "pos_type": "verb", "meaning": "发生", "orig_ref": "原题29第1空 [D]", "explanation": "固定习语 As often happens 意为“正如经常发生的那样/通常情况下”。"}, {"num": 2, "word": "adjusted to", "opt": "A", "pos": "phr.", "pos_type": "verb", "meaning": "适应", "orig_ref": "原题29第2空 [A]", "explanation": "adjusted to Steve Jobs's way 意为“大多数苹果员工都适应了乔布斯的行事方式”。"}, {"num": 3, "word": "personality", "opt": "E", "pos": "n.", "pos_type": "noun", "meaning": "性格", "orig_ref": "原题29第3空 [E]", "explanation": "his volatile personality 意为“他喜怒无常/暴躁多变的性格”。"}, {"num": 4, "word": "motivated", "opt": "B", "pos": "adj.", "pos_type": "adj", "meaning": "有干劲的，积极的", "orig_ref": "原题29第4空 [B]", "explanation": "highly talented and motivated people 意为“才华横溢且充满干劲的人”。"}, {"num": 5, "word": "expectations", "opt": "J", "pos": "n.", "pos_type": "noun", "meaning": "预期，期望", "orig_ref": "原题29第5空 [J]", "explanation": "beyond their own wildest expectations 意为“超越他们自己最狂野的预期/想象”。"}, {"num": 6, "word": "terms", "opt": "O", "pos": "n.", "pos_type": "noun", "meaning": "方面 (in terms of)", "orig_ref": "原题29第6空 [O]", "explanation": "固定短语 in terms of wealth, fame, and professional satisfaction 意为“在财富、名声和职业成就感方面”。"}, {"num": 7, "word": "intolerable", "opt": "H", "pos": "adj.", "pos_type": "adj", "meaning": "无法忍受的", "orig_ref": "原题29第7空 [H]", "explanation": "reached a point of intolerable frustration 意为“对乔布斯的挫败与不满达到了无法忍受的地步”（末句 intolerable experience 原词复现）。"}, {"num": 8, "word": "abandoned", "opt": "K", "pos": "v.", "pos_type": "verb", "meaning": "被抛弃", "orig_ref": "原题29第8空 [K]", "explanation": "The man who'd often abandoned others was himself abandoned 形成首尾对称，“那个经常抛弃别人的人，如今自己也被抛弃了”。"}, {"num": 9, "word": "humiliation", "opt": "M", "pos": "n.", "pos_type": "noun", "meaning": "屈辱，羞辱", "orig_ref": "原题29第9空 [M]", "explanation": "moments of massive humiliation and self-searching 意为“巨大屈辱与自我反省的时刻”。"}, {"num": 10, "word": "root", "opt": "C", "pos": "n.", "pos_type": "noun", "meaning": "根源", "orig_ref": "原题29第10空 [C]", "explanation": "seek the root of the many faults and flaws 意为“探寻诸多过错与缺陷的根源”。"}], "vocab": [["volatile", "adj. 喜怒无常的，易变的"], ["beyond one's wildest expectations", "phr. 超出某人最狂野的预期"], ["in terms of", "phr. 在……方面，就……而言"], ["intolerable", "adj. 无法忍受的"], ["self-searching", "n. 自我反省，内省"]], "translation": "正如通常发生的那样（As often happens），苹果公司的大多数人基本上都适应了（adjusted to）史蒂夫·乔布斯的行事方式，因为尽管他性格（personality）喜怒无常，但他却能促使那些才华横溢且充满干劲的（motivated）人取得超出他们自己最大预期（expectations）的成就。如果一个人足够坚强，能够忍受为乔布斯工作以及与他共事所伴随的百般辱骂，那么他在财富、名声和职业满足感方面（in terms of）所获得的成功将是巨大的。但有一天，苹果董事会对乔布斯的不满达到了无法忍受的（intolerable）地步。30岁那年，史蒂夫·乔布斯发现自己失业了。他再一次体验到了被拒绝、被遗弃的回响（呼应他幼年被亲生父母送养的经历）——只不过这一次是在30岁。那个经常抛弃别人的人，如今自己也被抛弃了（abandoned）。那必定是一段充满巨大屈辱（humiliation）与自我反省的时刻 却就这么烟消云散了，实在让人觉得不可思议。所以我真的希望相信有些东西会留存下来，也许你的意识会继续长存（endures）。但另一方面，也许生命就像一个电源开关。啪的一声！你就没了。也许正因如此，我才从来不喜欢在苹果设备上安装电源开关。”在斯坦福大学的一次毕业典礼演讲（commencement address）中，乔布斯曾告诉毕业生们：死亡或许是生命最伟大的礼物，因为对死亡真正的敬畏，会迫使一个人在每一个醒着的（waking）日子里都全力以赴。"}]}];

        t.units.forEach(u => {
          const st = quizState[u.unit_id];
          u.blanks.forEach(b => {
            const ans = st.answers[b.num];
            if (ans) {
              attempted++;
              if (st.checked && ans === b.word) {
                correct++;
              }
            }
          });
        });
      });
      document.getElementById('quiz-Attempted-count').textContent = attempted;
      document.getElementById('quiz-correct-count').textContent = correct;
    }

    function renderAll() {
      const unitsContainer = document.getElementById('units-container');
      const indexContainer = document.getElementById('index-container');
      const legendBar = document.getElementById('legend-bar');
      const quizStatsBar = document.getElementById('quiz-stats-bar');

      if (currentMode === 'index') {
        unitsContainer.classList.add('hidden');
        indexContainer.classList.remove('hidden');
        legendBar.classList.add('hidden');
        renderIndexView();
        return;
      }

      unitsContainer.classList.remove('hidden');
      indexContainer.classList.add('hidden');
      legendBar.classList.remove('hidden');

      if (currentMode === 'quiz') {
        quizStatsBar.classList.remove('hidden');
        quizStatsBar.classList.add('flex');
        updateQuizStats();
      } else {
        quizStatsBar.classList.add('hidden');
        quizStatsBar.classList.remove('flex');
      }

      let html = '';
      let visibleCount = 0;

      THEMES_DATA.forEach(theme => {
        if (currentTheme !== 'all' && currentTheme !== theme.id) return;

        const matchingUnits = theme.units.filter(matchesSearch);
        if (matchingUnits.length === 0) return;

        visibleCount += matchingUnits.length;

        html += `
          <section class="space-y-5">
            <div class="rounded-2xl p-5 text-white shadow-md" style="background: linear-gradient(135deg, ${theme.color}, #0F172A);">
              <div class="flex flex-wrap items-center justify-between gap-2">
                <div>
                  <h2 class="text-lg sm:text-xl font-bold">${escapeHtml(theme.title)}</h2>
                  <p class="text-xs sm:text-sm text-slate-200 mt-1">${escapeHtml(theme.subtitle)}</p>
                </div>
                <div class="flex flex-wrap gap-1.5">
                  ${theme.orig_q_list.map(q => `<span class="px-2.5 py-1 rounded-full text-xs font-bold bg-white/15 backdrop-blur">原题 ${q}</span>`).join('')}
                </div>
              </div>
            </div>
            <div class="space-y-6">
              ${matchingUnits.map(u => renderUnitCard(theme, u)).join('')}
            </div>
          </section>
        `;
      });

      if (visibleCount === 0) {
        html = `
          <div class="bg-white rounded-2xl p-12 text-center border border-slate-200 shadow-sm">
            <p class="text-base font-semibold text-slate-700">未找到匹配的题目或关键词</p>
            <p class="text-xs text-slate-500 mt-1">请尝试搜索原题号（1~33）或英文关键词，或点击上方“全部专题”</p>
          </div>
        `;
      }

      unitsContainer.innerHTML = html;
    }

    function renderUnitCard(theme, unit) {
      const uid = unit.unit_id;
      const pState = panelState[uid];
      const qState = quizState[uid];
      const blankMap = {};
      unit.blanks.forEach(b => { blankMap[b.num] = b; });

      // Build passage HTML
      let passageHtml = '';
      unit.passage_parts.forEach(part => {
        if (typeof part === 'string') {
          passageHtml += escapeHtml(part);
        } else {
          const b = blankMap[part.b];
          if (currentMode === 'memorize') {
            const posCls = getPosClass(b.pos_type);
            passageHtml += `<span class="blank-pill ${posCls}" data-action="show-blank-pop" data-uid="${uid}" data-bnum="${b.num}" title="点击查看第${b.num}空语法解析 (${escapeHtml(b.orig_ref)})">
              <span class="text-xs opacity-75">[${b.num}]</span>
              <span>${escapeHtml(b.word)}</span>
              <span class="text-xs font-normal opacity-80">(${escapeHtml(b.pos)} ${escapeHtml(b.meaning)})</span>
            </span>`;
          } else {
            // Quiz mode
            const userAns = qState.answers[b.num] || '';
            const isSelected = qState.selectedBlank === b.num;
            let slotCls = 'quiz-slot';
            let statusIcon = '';
            if (qState.checked) {
              if (userAns === b.word) {
                slotCls += ' correct-slot';
                statusIcon = ' ✓';
              } else {
                slotCls += ' wrong-slot';
                statusIcon = ` ✗ (正: ${escapeHtml(b.word)})`;
              }
            } else if (isSelected) {
              slotCls += ' active-slot';
            } else if (userAns) {
              slotCls += ' filled-slot';
            }
            const displayLabel = userAns ? `${b.num}. ${escapeHtml(userAns)}${statusIcon}` : `(${b.num}) 点击选词`;
            passageHtml += `<button type="button" class="${slotCls}" data-action="select-slot" data-uid="${uid}" data-bnum="${b.num}">${displayLabel}</button>`;
          }
        }
      });

      // Error/Merger note banner
      const noteHtml = unit.error_note ? `
        <div class="px-4 py-2.5 bg-amber-50 border-l-4 border-amber-500 text-amber-900 text-xs sm:text-sm rounded-r-lg leading-relaxed">
          ${escapeHtml(unit.error_note)}
        </div>
      ` : '';

      // Original Question Quick Answer Keys
      const origKeysHtml = unit.orig_q_keys.map(k => `
        <div class="p-2.5 rounded-lg bg-slate-50 border border-slate-200 text-xs">
          <span class="inline-block px-2 py-0.5 rounded bg-slate-800 text-white font-bold mr-2">原题 ${k.q_num} 标准答案</span>
          <span class="font-mono text-slate-700 font-medium">${escapeHtml(k.summary)}</span>
        </div>
      `).join('');

      // Word bank HTML
      const usedWords = new Set(Object.values(qState.answers));
      const wordBankItemsHtml = unit.word_bank.map(([opt, w, pos, mean]) => {
        if (opt === '干扰项') {
          return `<div class="col-span-full text-xs text-slate-500 pt-1 border-t border-slate-100"><strong>其余干扰项：</strong>${escapeHtml(w)}</div>`;
        }
        const isUsed = currentMode === 'quiz' && usedWords.has(w);
        if (currentMode === 'quiz') {
          return `
            <button type="button" data-action="pick-word" data-uid="${uid}" data-word="${escapeHtml(w)}"
              class="word-chip text-left p-2 rounded-lg border text-xs flex flex-col justify-between ${isUsed ? 'bg-slate-100 border-slate-200 text-slate-400 line-through' : 'bg-white border-slate-300 hover:border-blue-500 hover:bg-blue-50 text-slate-800 shadow-sm'}">
              <div class="font-bold text-sm"><span class="text-blue-700 mr-1">${escapeHtml(opt)}.</span>${escapeHtml(w)}</div>
              <div class="text-slate-500 mt-0.5">${escapeHtml(pos)} ${escapeHtml(mean)}</div>
            </button>
          `;
        } else {
          return `
            <div class="p-2 rounded-lg border border-slate-200 bg-slate-50/70 text-xs">
              <div class="font-bold text-slate-800"><span class="text-blue-700 mr-1">${escapeHtml(opt)}.</span>${escapeHtml(w)}</div>
              <div class="text-slate-500 mt-0.5">${escapeHtml(pos)} ${escapeHtml(mean)}</div>
            </div>
          `;
        }
      }).join('');

      // Quiz action bar if in quiz mode
      const quizBarHtml = currentMode === 'quiz' ? `
        <div class="bg-blue-50/70 border border-blue-200 rounded-xl p-4 space-y-3">
          <div class="flex flex-wrap items-center justify-between gap-2">
            <div class="text-xs sm:text-sm font-semibold text-blue-950">
              👇 点击上方正文中的空白格 <span class="px-1.5 py-0.5 rounded bg-blue-600 text-white text-xs">当前选中: 第 ${qState.selectedBlank} 空</span>，再点击下方词库填入：
            </div>
            <div class="flex flex-wrap items-center gap-2">
              <button type="button" data-action="check-unit" data-uid="${uid}" class="px-3 py-1.5 rounded-lg bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-bold shadow-sm">
                ✓ 提交判分
              </button>
              <button type="button" data-action="fill-unit" data-uid="${uid}" class="px-3 py-1.5 rounded-lg bg-blue-600 hover:bg-blue-700 text-white text-xs font-bold shadow-sm">
                💡 一键填入答案
              </button>
              <button type="button" data-action="reset-unit" data-uid="${uid}" class="px-3 py-1.5 rounded-lg bg-white hover:bg-slate-100 text-slate-700 border border-slate-300 text-xs font-semibold">
                ↺ 清空重做
              </button>
            </div>
          </div>
          <div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-5 gap-2">
            ${wordBankItemsHtml}
          </div>
        </div>
      ` : `
        <div class="${pState.wordbank ? '' : 'hidden'} bg-slate-50 border border-slate-200 rounded-xl p-4">
          <h4 class="text-xs font-bold uppercase tracking-wider text-slate-500 mb-2.5">15选10 备选词库与词义对照</h4>
          <div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-5 gap-2">
            ${wordBankItemsHtml}
          </div>
        </div>
      `;

      // Key Vocab HTML
      const vocabHtml = unit.vocab.map(([w, m]) => `
        <div class="px-3 py-1.5 rounded-lg bg-slate-50 border border-slate-200 text-xs flex items-baseline justify-between gap-2">
          <span class="font-bold text-slate-800">${escapeHtml(w)}</span>
          <span class="text-slate-600">${escapeHtml(m)}</span>
        </div>
      `).join('');

      // Explanations HTML
      const explanationsHtml = unit.blanks.map(b => {
        const posCls = getPosClass(b.pos_type);
        return `
          <div class="p-3 rounded-lg bg-slate-50 border border-slate-200 text-xs sm:text-sm space-y-1">
            <div class="flex flex-wrap items-center justify-between gap-2">
              <div class="flex items-center gap-2">
                <span class="px-2 py-0.5 rounded font-bold ${posCls}">第 ${b.num} 空：${escapeHtml(b.word)} (${escapeHtml(b.pos)} ${escapeHtml(b.meaning)})</span>
              </div>
              <span class="text-xs font-mono font-semibold text-slate-500">${escapeHtml(b.orig_ref)}</span>
            </div>
            <p class="text-slate-700 leading-relaxed pl-1">${escapeHtml(b.explanation)}</p>
          </div>
        `;
      }).join('');

      return `
        <article id="unit-${uid}" class="bg-white rounded-2xl border border-slate-200 shadow-sm overflow-hidden">
          <!-- Unit Header -->
          <div class="px-5 py-3.5 bg-slate-50 border-b border-slate-200 flex flex-wrap items-center justify-between gap-2">
            <div class="flex flex-wrap items-center gap-2">
              <span class="px-2.5 py-1 rounded-md text-xs font-bold text-white" style="background-color: ${theme.color};">${escapeHtml(uid)}</span>
              <h3 class="text-base font-bold text-slate-900">${escapeHtml(unit.unit_title)}</h3>
              ${unit.is_merged ? '<span class="px-2 py-0.5 rounded text-xs font-semibold bg-amber-100 text-amber-800 border border-amber-300">合并去重题组</span>' : ''}
            </div>
            <div class="flex flex-wrap items-center gap-1.5 text-xs">
              ${currentMode === 'memorize' ? `
                <button type="button" data-action="toggle-panel" data-uid="${uid}" data-panel="wordbank"
                  class="px-2.5 py-1 rounded-md border font-medium ${pState.wordbank ? 'bg-slate-800 text-white border-slate-800' : 'bg-white text-slate-700 border-slate-300 hover:bg-slate-100'}">
                  ${pState.wordbank ? '隐藏词库' : '查看15选10词库'}
                </button>
              ` : ''}
              <button type="button" data-action="toggle-panel" data-uid="${uid}" data-panel="vocab"
                class="px-2.5 py-1 rounded-md border font-medium ${pState.vocab ? 'bg-indigo-600 text-white border-indigo-600' : 'bg-white text-slate-700 border-slate-300 hover:bg-slate-100'}">
                ${pState.vocab ? '隐藏重点词汇' : '重点词汇'}
              </button>
              <button type="button" data-action="toggle-panel" data-uid="${uid}" data-panel="trans"
                class="px-2.5 py-1 rounded-md border font-medium ${pState.trans ? 'bg-emerald-600 text-white border-emerald-600' : 'bg-white text-slate-700 border-slate-300 hover:bg-slate-100'}">
                ${pState.trans ? '隐藏全文译文' : '全文译文'}
              </button>
              <button type="button" data-action="toggle-panel" data-uid="${uid}" data-panel="exp"
                class="px-2.5 py-1 rounded-md border font-medium ${pState.exp ? 'bg-amber-600 text-white border-amber-600' : 'bg-white text-slate-700 border-slate-300 hover:bg-slate-100'}">
                ${pState.exp ? '隐藏答案与逐空解析' : '展开答案与逐空解析'}
              </button>
            </div>
          </div>

          <div class="p-5 space-y-4">
            ${noteHtml}
            ${quizBarHtml}

            <!-- English Passage -->
            <div class="p-4 rounded-xl bg-slate-50/50 border border-slate-200/80 text-sm sm:text-base leading-8 text-slate-800">
              ${passageHtml}
            </div>

            <!-- Key Vocabulary Panel -->
            <div class="${pState.vocab ? '' : 'hidden'} space-y-2 pt-1">
              <h4 class="text-xs font-bold uppercase tracking-wider text-indigo-700 flex items-center gap-1.5">
                <span>📌 核心重点词汇与短语</span>
              </h4>
              <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-2">
                ${vocabHtml}
              </div>
            </div>

            <!-- Full Translation Panel -->
            <div class="${pState.trans ? '' : 'hidden'} p-4 rounded-xl bg-emerald-50/60 border border-emerald-200 space-y-1.5">
              <h4 class="text-xs font-bold uppercase tracking-wider text-emerald-800">📖 全文精准中文译文（括号内标注对应填空词）</h4>
              <p class="text-xs sm:text-sm text-slate-700 leading-relaxed">${escapeHtml(unit.translation)}</p>
            </div>

            <!-- Answer Key & Blank-by-Blank Explanation Panel -->
            <div class="${pState.exp ? '' : 'hidden'} space-y-3 pt-2 border-t border-slate-200">
              <h4 class="text-xs font-bold uppercase tracking-wider text-amber-800">🔑 原题标准答案速查与逐空语法/语境深度解析</h4>
              <div class="space-y-2">
                ${origKeysHtml}
              </div>
              <div class="grid grid-cols-1 md:grid-cols-2 gap-2.5">
                ${explanationsHtml}
              </div>
            </div>
          </div>
        </article>
      `;
    }

    function renderIndexView() {
      const indexContainer = document.getElementById('index-container');
      // Build flat map of all 33 original questions
      const qMap = {};
      THEMES_DATA.forEach(theme => {
        theme.units.forEach(unit => {
          unit.orig_q_keys.forEach(k => {
            qMap[k.q_num] = {
              q_num: k.q_num,
              summary: k.summary,
              theme_title: theme.title,
              unit_id: unit.unit_id,
              unit_title: unit.unit_title,
              error_note: unit.error_note
            };
          });
        });
      });

      let rowsHtml = '';
      for (let i = 1; i <= 33; i++) {
        const item = qMap[i];
        if (!item) continue;
        if (searchQuery.trim()) {
          const q = searchQuery.trim().toLowerCase();
          const match = String(i) === q || item.summary.toLowerCase().includes(q) || item.unit_title.toLowerCase().includes(q);
          if (!match) continue;
        }
        rowsHtml += `
          <div class="p-4 rounded-xl bg-white border border-slate-200 shadow-sm flex flex-col sm:flex-row sm:items-center justify-between gap-3 hover:border-blue-400 transition">
            <div class="space-y-1">
              <div class="flex flex-wrap items-center gap-2">
                <span class="px-2.5 py-0.5 rounded-md bg-slate-900 text-white text-xs font-bold">原题 ${item.q_num}</span>
                <span class="text-xs font-semibold text-blue-700">${escapeHtml(item.unit_title)}</span>
                ${(item.q_num === 4 || item.q_num === 5 || item.q_num === 16 || item.q_num === 28) ? '<span class="px-2 py-0.5 rounded bg-rose-100 text-rose-800 text-xs font-bold">⚠️ 含原图纠偏/勘误</span>' : ''}
              </div>
              <div class="font-mono text-xs sm:text-sm text-slate-800 font-semibold">${escapeHtml(item.summary)}</div>
            </div>
            <button type="button" data-action="jump-unit" data-uid="${item.unit_id}"
              class="shrink-0 px-3 py-1.5 rounded-lg bg-blue-50 hover:bg-blue-100 text-blue-700 text-xs font-bold border border-blue-200">
              定位至单元 ${item.unit_id} →
            </button>
          </div>
        `;
      }

      indexContainer.innerHTML = `
        <div class="bg-white rounded-2xl p-5 border border-slate-200 shadow-sm space-y-2">
          <h2 class="text-lg font-bold text-slate-900">🔢 全部 33 道原题标准答案速查总表（按原题号 1~33 排序）</h2>
          <p class="text-xs sm:text-sm text-slate-600">考场上遇到任何一道原题，可直接按题号核对下方 1~10 空标准选项字母，或点击右侧按钮跳转到对应的精编段落单元查看全文翻译与解析。</p>
        </div>
        <div class="space-y-2.5">
          ${rowsHtml}
        </div>
      `;
    }

    // Event Delegation & Handlers
    document.getElementById('mode-memorize-btn').addEventListener('click', () => {
      currentMode = 'memorize';
      updateModeButtons();
      renderAll();
    });

    document.getElementById('mode-quiz-btn').addEventListener('click', () => {
      currentMode = 'quiz';
      updateModeButtons();
      renderAll();
    });

    document.getElementById('mode-index-btn').addEventListener('click', () => {
      currentMode = 'index';
      updateModeButtons();
      renderAll();
    });

    function updateModeButtons() {
      const mBtn = document.getElementById('mode-memorize-btn');
      const qBtn = document.getElementById('mode-quiz-btn');
      const iBtn = document.getElementById('mode-index-btn');
      [mBtn, qBtn, iBtn].forEach(btn => {
        btn.className = 'px-3.5 py-1.5 rounded-lg text-xs sm:text-sm font-semibold transition text-slate-300 hover:text-white';
      });
      const activeBtn = currentMode === 'memorize' ? mBtn : (currentMode === 'quiz' ? qBtn : iBtn);
      activeBtn.className = 'px-3.5 py-1.5 rounded-lg text-xs sm:text-sm font-semibold transition bg-blue-600 text-white shadow';
    }

    document.getElementById('theme-filters').addEventListener('click', (e) => {
      const btn = e.target.closest('.theme-btn');
      if (!btn) return;
      currentTheme = btn.getAttribute('data-theme');
      document.querySelectorAll('.theme-btn').forEach(b => {
        if (b.getAttribute('data-theme') === currentTheme) {
          b.className = 'theme-btn px-2.5 py-1 rounded-md font-medium bg-white text-slate-900';
        } else {
          b.className = 'theme-btn px-2.5 py-1 rounded-md font-medium bg-slate-800 text-slate-300 hover:bg-slate-700';
        }
      });
      if (currentMode === 'index') {
        currentMode = 'memorize';
        updateModeButtons();
      }
      renderAll();
    });

    const searchInput = document.getElementById('search-input');
    const clearSearchBtn = document.getElementById('clear-search-btn');
    searchInput.addEventListener('input', (e) => {
      searchQuery = e.target.value;
      clearSearchBtn.classList.toggle('hidden', !searchQuery);
      renderAll();
    });
    clearSearchBtn.addEventListener('click', () => {
      searchQuery = '';
      searchInput.value = '';
      clearSearchBtn.classList.add('hidden');
      renderAll();
    });

    document.getElementById('toggle-color-btn').addEventListener('click', (e) => {
      colorHighlight = !colorHighlight;
      e.currentTarget.textContent = colorHighlight ? '🎨 彩色词性高亮: 开' : '🎨 彩色词性高亮: 关';
      e.currentTarget.className = colorHighlight
        ? 'px-2.5 py-1 rounded-md bg-emerald-700/80 hover:bg-emerald-600 text-white font-medium'
        : 'px-2.5 py-1 rounded-md bg-slate-700 hover:bg-slate-600 text-slate-300 font-medium';
      renderAll();
    });

    document.getElementById('expand-all-btn').addEventListener('click', () => {
      Object.keys(panelState).forEach(uid => {
        panelState[uid].vocab = true;
        panelState[uid].trans = true;
        panelState[uid].exp = true;
        panelState[uid].wordbank = true;
      });
      renderAll();
    });

    document.getElementById('collapse-all-btn').addEventListener('click', () => {
      Object.keys(panelState).forEach(uid => {
        panelState[uid].vocab = false;
        panelState[uid].trans = false;
        panelState[uid].exp = false;
        panelState[uid].wordbank = false;
      });
      renderAll();
    });

    document.getElementById('reset-all-quiz-btn').addEventListener('click', () => {
      Object.keys(quizState).forEach(uid => {
        quizState[uid].selectedBlank = 1;
        quizState[uid].answers = {};
        quizState[uid].checked = false;
      });
      renderAll();
    });

    document.getElementById('close-pop-btn').addEventListener('click', () => {
      document.getElementById('blank-popover').classList.add('hidden');
    });

    // Main delegated click listener
    document.addEventListener('click', (e) => {
      const target = e.target.closest('[data-action]');
      if (!target) return;
      const action = target.getAttribute('data-action');
      const uid = target.getAttribute('data-uid');

      if (action === 'toggle-panel') {
        const panel = target.getAttribute('data-panel');
        panelState[uid][panel] = !panelState[uid][panel];
        renderAll();
      } else if (action === 'show-blank-pop') {
        const bnum = parseInt(target.getAttribute('data-bnum'), 10);
        let foundUnit = null;
        THEMES_DATA.forEach(t => t.units.forEach(u => { if (u.unit_id === uid) foundUnit = u; }));
        if (!foundUnit) return;
        const blank = foundUnit.blanks.find(b => b.num === bnum);
        if (!blank) return;
        document.getElementById('pop-unit-badge').textContent = `单元 ${uid} · 第 ${bnum} 空`;
        document.getElementById('pop-word-title').textContent = `${blank.word} (${blank.pos} ${blank.meaning})`;
        document.getElementById('pop-orig-ref').textContent = `对应考题：${blank.orig_ref}`;
        document.getElementById('pop-explanation').textContent = blank.explanation;
        document.getElementById('blank-popover').classList.remove('hidden');
      } else if (action === 'select-slot') {
        const bnum = parseInt(target.getAttribute('data-bnum'), 10);
        if (quizState[uid].selectedBlank === bnum && quizState[uid].answers[bnum]) {
          // Clicking an already active filled slot clears it
          delete quizState[uid].answers[bnum];
          quizState[uid].checked = false;
        } else {
          quizState[uid].selectedBlank = bnum;
        }
        renderAll();
      } else if (action === 'pick-word') {
        const word = target.getAttribute('data-word');
        const st = quizState[uid];
        st.checked = false;
        st.answers[st.selectedBlank] = word;
        // Advance to next unfilled blank in this unit
        let foundUnit = null;
        THEMES_DATA.forEach(t => t.units.forEach(u => { if (u.unit_id === uid) foundUnit = u; }));
        if (foundUnit) {
          const nextBlank = foundUnit.blanks.find(b => b.num > st.selectedBlank && !st.answers[b.num])
                         || foundUnit.blanks.find(b => !st.answers[b.num]);
          if (nextBlank) st.selectedBlank = nextBlank.num;
        }
        renderAll();
      } else if (action === 'check-unit') {
        quizState[uid].checked = true;
        panelState[uid].exp = true;
        renderAll();
      } else if (action === 'fill-unit') {
        let foundUnit = null;
        THEMES_DATA.forEach(t => t.units.forEach(u => { if (u.unit_id === uid) foundUnit = u; }));
        if (foundUnit) {
          foundUnit.blanks.forEach(b => {
            quizState[uid].answers[b.num] = b.word;
          });
          quizState[uid].checked = true;
          panelState[uid].exp = true;
          renderAll();
        }
      } else if (action === 'reset-unit') {
        quizState[uid].selectedBlank = 1;
        quizState[uid].answers = {};
        quizState[uid].checked = false;
        renderAll();
      } else if (action === 'jump-unit') {
        currentMode = 'memorize';
        currentTheme = 'all';
        searchQuery = '';
        searchInput.value = '';
        clearSearchBtn.classList.add('hidden');
        updateModeButtons();
        panelState[uid].exp = true;
        renderAll();
        const el = document.getElementById(`unit-${uid}`);
        if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' });
      }
    });

    // Initial render
    renderAll();
  </script>
</body>
</html>
