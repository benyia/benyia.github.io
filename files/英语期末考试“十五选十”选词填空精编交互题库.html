nthesis", "phr. 顺便说一句，作为插话"], ["expiry date", "n. 有效期，截止日期"], ["take the wheel", "phr. 掌舵，掌控方向盘"], ["ennobling", "adj. 使人高尚的，升华品格的"], ["entail", "v. 牵涉，伴随，使必要"], ["petty humiliation", "n. 琐碎的屈辱"], ["have a knack for", "phr. 在……方面有诀窍/天分"]], "translation": "我不记得曾告诉过父母自己主修的是古典学；他们很可能是在毕业典礼当天才第一次得知此事。在这个星球上的所有学科中，我觉得要说到谋得（securing）一把高管专用洗手间钥匙（即高薪职位），他们很难再举出（name）一门比希腊神话更没用的专业了。顺便在括号里（parenthesis）声明一下，我并不因为父母的观点而责怪（blame）他们。责怪父母把你引向（steering）错误的方向是有保质期（expiry date）的；一旦（the moment）你到了足够亲自掌舵（take the wheel）的年纪，责任就完全在于（lies with）你自己了。更何况，我无法批评父母希望我永远不要经历贫穷。他们自己就曾经贫穷过，而我后来也经历过贫穷，我非常赞同他们的看法：贫穷绝不是一种能让人变得高尚的（ennobling）经历。贫穷伴随着（entails）恐惧、压力，有时还有抑郁；它意味着成千上万种琐碎的（petty）屈辱（humiliations）和艰辛。靠自己的努力走出贫困，那是值得自豪的事，但贫穷本身只有傻瓜才会去美化（romanticized）。在你们这个年纪，我最害怕的不是贫穷，而是失败。在你们这个年纪，尽管我在大学里明显（distinct）缺乏动力——我花在咖啡馆写故事的时间太长，而去听课的时间太少——但我却有一套通过考试的诀窍（knack），而多年来，这一直是我和同龄人衡量成功的标准。"}, {"unit_id": "1.3", "unit_title": "单元 1.3：毕业七年后的史诗级失败与“剥离无关紧要之物”", "orig_questions": [11], "is_merged": false, "error_note": null, "word_bank": [["A", "Ultimately", "adv.", "最终，归根结底"], ["B", "inessential", "adj./n.", "非必要的（事物），无关紧要的"], ["C", "imploded", "v.", "内爆，崩溃，彻底瓦解"], ["D", "homeless", "adj.", "无家可归的"], ["E", "measure", "n./v.", "衡量标准，尺度"], ["F", "pass", "v./n.", "发生，实现 (come to pass)"], ["G", "jobless", "adj.", "失业的"], ["H", "Ultimate", "adj.", "最终的，根本的"], ["I", "convention", "n.", "惯例，习俗"], ["J", "constitutes", "v.", "构成，算作"], ["K", "that", "pron./conj.", "那，引导从句"], ["L", "composes", "v.", "组成，创作"], ["M", "criteria", "n.", "标准，准则 (criterion的复数)"], ["N", "mattered", "v.", "重要，要紧"], ["O", "constitution", "n.", "宪法，构造，体格"]], "orig_q_keys": [{"q_num": 11, "summary": "1-A (Ultimately) | 2-J (constitutes) | 3-M (criteria) | 4-E (measure) | 5-C (imploded) | 6-G (jobless) | 7-D (homeless) | 8-F (pass) | 9-B (inessential) | 10-N (mattered)"}], "passage_parts": ["", {"b": 1}, ", we all have to decide for ourselves what ", {"b": 2}, " failure, but the world is quite eager to give you a set of ", {"b": 3}, " if you let it. So I think it fair to say that by any conventional ", {"b": 4}, ", a mere seven years after my graduation day, I had failed on an epic scale. An exceptionally short-lived marriage had ", {"b": 5}, ", and I was ", {"b": 6}, ", a lone parent, and as poor as it is possible to be in modern Britain, without being ", {"b": 7}, ". The fears that my parents had had for me, and that I had had for myself, had both come to ", {"b": 8}, ", and by every usual standard, I was the biggest failure I knew. So why do I talk about the benefits of failure? Simply because failure meant a stripping away of the ", {"b": 9}, ". I stopped pretending to myself that I was anything other than what I was, and began to direct all my energy into finishing the only work that ", {"b": 10}, " to me."], "blanks": [{"num": 1, "word": "Ultimately", "opt": "A", "pos": "adv.", "pos_type": "adv", "meaning": "最终，归根结底", "orig_ref": "原题11第1空 [A]", "explanation": "位于句首且有逗号隔开，需用副词修饰整个句子（注意区分 A. Ultimately 副词与 H. Ultimate 形容词）。"}, {"num": 2, "word": "constitutes", "opt": "J", "pos": "v.", "pos_type": "verb", "meaning": "构成，算作", "orig_ref": "原题11第2空 [J]", "explanation": "what 引导宾语从句并在从句中作主语，what constitutes failure 意为“什么才算作失败”。"}, {"num": 3, "word": "criteria", "opt": "M", "pos": "n.", "pos_type": "noun", "meaning": "标准，准则（复数）", "orig_ref": "原题11第3空 [M]", "explanation": "a set of 后接复数名词，a set of criteria 意为“一套评判标准”。"}, {"num": 4, "word": "measure", "opt": "E", "pos": "n.", "pos_type": "noun", "meaning": "衡量标准，尺度", "orig_ref": "原题11第4空 [E]", "explanation": "by any conventional measure 为固定搭配，与下文 by every usual standard 同义，意为“按任何世俗标准来衡量”。"}, {"num": 5, "word": "imploded", "opt": "C", "pos": "v.", "pos_type": "verb", "meaning": "内爆，崩溃，破裂", "orig_ref": "原题11第5空 [C]", "explanation": "助动词 had 后接过去分词构成过去完成时，marriage had imploded 意为“一段极其短暂的婚姻迅速崩溃破裂了”。"}, {"num": 6, "word": "jobless", "opt": "G", "pos": "adj.", "pos_type": "adj", "meaning": "失业的", "orig_ref": "原题11第6空 [G]", "explanation": "系动词 was 后接形容词作表语，描述当时失业（jobless）、单亲妈妈、一贫如洗的处境。"}, {"num": 7, "word": "homeless", "opt": "D", "pos": "adj.", "pos_type": "adj", "meaning": "无家可归的", "orig_ref": "原题11第7空 [D]", "explanation": "as poor as it is possible to be ... without being homeless 意为“除了还不至于流落街头无家可归之外，已经穷到了现代英国所能达到的极限”。"}, {"num": 8, "word": "pass", "opt": "F", "pos": "n./v.", "pos_type": "verb", "meaning": "发生，应验 (come to pass)", "orig_ref": "原题11第8空 [F]", "explanation": "固定习语 come to pass 意为“发生、成为现实、应验”。"}, {"num": 9, "word": "inessential", "opt": "B", "pos": "adj./n.", "pos_type": "adj", "meaning": "无关紧要的事物", "orig_ref": "原题11第9空 [B]", "explanation": "the + 形容词表示一类事物，a stripping away of the inessential 意为“剥离掉一切无关紧要的东西”。"}, {"num": 10, "word": "mattered", "opt": "N", "pos": "v.", "pos_type": "verb", "meaning": "要紧，重要", "orig_ref": "原题11第10空 [N]", "explanation": "定语从句 that ___ to me 修饰 the only work，时态为一般过去时，the only work that mattered to me 意为“唯一真正对我重要的工作”。"}], "vocab": [["constitute", "v. 构成，算作"], ["criteria", "n. 标准，准则（单数为 criterion）"], ["on an epic scale", "phr. 史诗级的，彻头彻尾地"], ["implode", "v. 内爆，骤然瓦解"], ["come to pass", "phr. 发生，变成现实"], ["strip away", "phr. 剥离，除去"], ["inessential", "adj. 非必要的，无关紧要的"]], "translation": "归根结底（Ultimately），我们都必须自己决定什么才算作（constitutes）失败，但如果你听任摆布，这个世界总是迫不及待地想塞给你一套评判标准（criteria）。因此我觉得可以毫不夸张地说，按照任何传统的衡量标准（measure），在毕业仅仅七年之后，我就遭遇了史诗级的惨败。一段极其短暂的婚姻骤然破裂（imploded），我失业了（jobless），成了一名单亲妈妈，除了还不至于无家可归（homeless）之外，我已经穷到了现代英国人所能达到的极致。父母曾为我担心的事，以及我自己曾害怕的事，全都变成了现实（come to pass）；按照任何通常的标准来看，我都是自己所认识的最大的失败者。那么我为什么要谈论失败的好处呢？原因很简单，因为失败意味着剥离掉一切无关紧要的东西（inessential）。我不再向自己伪装成任何不是我本来的样子，并开始把全部精力投入到完成唯一真正对我有意义的（mattered）工作上。"}, {"unit_id": "1.4", "unit_title": "单元 1.4：想象力与共情的力量——拒绝冷漠与精神广场恐惧症", "orig_questions": [10], "is_merged": false, "error_note": null, "word_bank": [["A", "sufferings", "n.", "苦难，痛苦"], ["B", "willfully", "adv.", "蓄意地，任性地"], ["C", "morally", "adv.", "在道德上，道义上"], ["D", "choose", "v.", "选择"], ["E", "except", "conj./prep.", "除……之外，只不过 (except that)"], ["F", "places", "n.", "位置，处境 (into other people's places)"], ["G", "tempted", "adj./v.", "禁不住想，受诱惑的 (be tempted to)"], ["H", "narrow", "adj.", "狭隘的，狭窄的"], ["I", "behalf", "n.", "代表，利益"], ["J", "besides", "prep./adv.", "除……之外（还）"], ["K", "affection", "n.", "慈爱，喜爱"], ["L", "comfortably", "adv.", "安逸地，舒适地"], ["M", "outright", "adj./adv.", "公然的，彻头彻尾的"], ["N", "personally", "adv.", "就个人而言，亲身地"], ["O", "other", "pron./adj.", "其他的，不同的 (other than)"]], "orig_q_keys": [{"q_num": 10, "summary": "1-F (places) | 2-C (morally) | 3-L (comfortably) | 4-O (other) | 5-A (sufferings) | 6-N (personally) | 7-G (tempted) | 8-E (except) | 9-H (narrow) | 10-M (outright)"}], "passage_parts": ["Unlike any other creature on this planet, humans can learn and understand, without having experienced. They can think themselves into other people's ", {"b": 1}, ". This is power, like my brand of fictional magic, is ", {"b": 2}, " neutral. One might use such an ability to manipulate, or control, just as much as to understand or sympathise. And many prefer not to exercise their imaginations at all. They choose to remain ", {"b": 3}, " within the bounds of their own experience, never troubling to wonder how it would feel to have been born ", {"b": 4}, " than they are. They can refuse to hear screams or to peer inside cages; they can close their minds and hearts to any ", {"b": 5}, " that does not touch them ", {"b": 6}, "; they can refuse to know. I might be ", {"b": 7}, " to envy people who can live that way, ", {"b": 8}, " that I do not think they have any fewer nightmares than I do. Choosing to live in ", {"b": 9}, " spaces leads to a form of mental agoraphobia, and that brings its own terrors. What is more, those who choose not to empathise enable real monsters. For without ever committing an act of ", {"b": 10}, " evil ourselves, we collude with it."], "blanks": [{"num": 1, "word": "places", "opt": "F", "pos": "n.", "pos_type": "noun", "meaning": "位置，境地", "orig_ref": "原题10第1空 [F]", "explanation": "名词所有格 other people's 后接名词；think themselves into other people's places 意为“设身处地为他人着想”。"}, {"num": 2, "word": "morally", "opt": "C", "pos": "adv.", "pos_type": "adv", "meaning": "在道德上", "orig_ref": "原题10第2空 [C]", "explanation": "修饰形容词 neutral 需用副词，morally neutral 意为“在道德上是中立的（既可用于操纵，也可用于共情）”。"}, {"num": 3, "word": "comfortably", "opt": "L", "pos": "adv.", "pos_type": "adv", "meaning": "安逸地，舒适地", "orig_ref": "原题10第3空 [L]", "explanation": "修饰介词短语 within the bounds of their own experience，表示“安逸地停留在自身经验的界限之内”。"}, {"num": 4, "word": "other", "opt": "O", "pos": "pron./adj.", "pos_type": "adj", "meaning": "不同的，其他的", "orig_ref": "原题10第4空 [O]", "explanation": "与后文 than 构成固定搭配 other than they are，意为“生来与现在的自己不同（换一种人生境遇）”。"}, {"num": 5, "word": "sufferings", "opt": "A", "pos": "n.", "pos_type": "noun", "meaning": "苦难，痛苦", "orig_ref": "原题10第5空 [A]", "explanation": "限定词 any 后接名词，close their minds and hearts to any sufferings 意为“对任何苦难闭目塞听”。"}, {"num": 6, "word": "personally", "opt": "N", "pos": "adv.", "pos_type": "adv", "meaning": "亲身地，直接地", "orig_ref": "原题10第6空 [N]", "explanation": "修饰动词短语 touch them，that does not touch them personally 意为“没有直接触及他们切身利益的（苦难）”。"}, {"num": 7, "word": "tempted", "opt": "G", "pos": "adj./v.", "pos_type": "verb", "meaning": "禁不住想 (be tempted to)", "orig_ref": "原题10第7空 [G]", "explanation": "固定搭配 be tempted to do sth. 意为“禁不住想要做某事（我或许会禁不住羡慕那样活着的人）”。"}, {"num": 8, "word": "except", "opt": "E", "pos": "conj.", "pos_type": "prep", "meaning": "只不过，除……之外", "orig_ref": "原题10第8空 [E]", "explanation": "固定搭配 except that 引导状语从句，意为“只不过（我不认为他们的噩梦会比我少）”。"}, {"num": 9, "word": "narrow", "opt": "H", "pos": "adj.", "pos_type": "adj", "meaning": "狭隘的，狭窄的", "orig_ref": "原题10第9空 [H]", "explanation": "修饰名词 spaces，narrow spaces（狭隘的心理空间）与后文 mental agoraphobia（精神上的广场恐惧症）形成对比。"}, {"num": 10, "word": "outright", "opt": "M", "pos": "adj.", "pos_type": "adj", "meaning": "公然的，彻头彻尾的", "orig_ref": "原题10第10空 [M]", "explanation": "修饰不可数名词 evil，an act of outright evil 意为“公然/明目张胆的恶行”。"}], "vocab": [["sympathise / empathise", "v. 同情 / 共情"], ["within the bounds of", "phr. 在……的界限之内"], ["be tempted to do", "phr. 禁不住想做某事"], ["agoraphobia", "n. 广场恐惧症"], ["outright", "adj. 彻头彻尾的，公然的"], ["collude with", "phr. 与……同谋，纵容"]], "translation": "与这个星球上的任何其他生物不同，人类无需亲身经历便能学习和理解。他们能够设身处地站到他人的位置（places）去思考。这种力量就像我书中所写的虚构魔法一样，在道德上（morally）是中立的。一个人既可以用这种能力去操纵或控制他人，也可以用它去理解或同情他人。而许多人根本不愿运用自己的想象力。他们选择安逸地（comfortably）停留在自身经验的界限之内，从不费心去想一想，如果生来不是（other than）现在这般境遇会是什么滋味。他们可以拒绝倾听惨叫，拒绝向牢笼内张望；他们可以对任何没有直接触及自身利益（personally）的苦难（sufferings）封闭头脑与内心；他们可以拒绝知晓。我或许会禁不住（tempted）去羡慕那些能够那样活着的人，只不过（except that）我并不觉得他们做的噩梦会比我少半分。选择活在狭隘的（narrow）空间里会导致一种精神上的广场恐惧症，而那会带来它自身的恐惧。更有甚者，那些选择不去共情的人其实是在纵容真正的恶魔。因为哪怕我们自己从未亲手犯下公然的（outright）恶行，我们的冷漠也已成了邪恶的帮凶。"}, {"unit_id": "1.5", "unit_title": "单元 1.5：哈佛毕业生的特权、责任与改变世界的力量", "orig_questions": [9], "is_merged": false, "error_note": null, "word_bank": [["A", "powerless", "adj.", "无权无势的，弱势的"], ["B", "bear", "v.", "施加，承担 (bring to bear on)"], ["C", "celebrate", "v.", "庆祝，歌颂，赞美"], ["D", "except for", "phr.", "除……之外"], ["E", "capacity", "n.", "能力，承受力 (capacity for)"], ["F", "on behalf of", "phr.", "代表，为了……的利益"], ["G", "humble", "adj.", "卑微的，谦逊的"], ["H", "earned", "v.", "赢得，凭努力获得"], ["I", "choose", "v.", "选择"], ["J", "belong to", "phr.", "属于"], ["K", "transfer", "v.", "转移，调动"], ["L", "vary", "v.", "变化，相异"], ["M", "desire", "n./v.", "渴望，愿望"], ["N", "advantages", "n.", "优势，优越条件"], ["O", "transform", "v.", "改变，改造"]], "orig_q_keys": [{"q_num": 9, "summary": "1-E (capacity) | 2-H (earned) | 3-J (belong to) | 4-B (bear) | 5-I (choose) | 6-F (on behalf of) | 7-A (powerless) | 8-N (advantages) | 9-C (celebrate) | 10-O (transform)"}], "passage_parts": ["But how much more are you, Harvard graduates of 2008, likely to touch other people's lives? Your intelligence, your ", {"b": 1}, " for hard work, and the education you have ", {"b": 2}, " and received, give you unique status, and unique responsibilities. Even your nationality sets you apart. The great majority of you ", {"b": 3}, " the world's only remaining superpower. The way you vote, the way you live, the way you protest, the pressure you bring to ", {"b": 4}, " on your government, has an impact way beyond your borders. That is your privilege, and your burden. If you ", {"b": 5}, " to use your status and influence to raise your voice ", {"b": 6}, " those who have no voice; if you choose to identify not only with the powerful, but with the ", {"b": 7}, "; if you retain the ability to imagine yourself into the lives of those who do not have your ", {"b": 8}, ", then it will not only be your proud families who ", {"b": 9}, " your existence, but thousands and millions of people whose reality you have helped change. We do not need magic to ", {"b": 10}, " the world. We carry all the power we need inside ourselves already: we have the power to imagine better."], "blanks": [{"num": 1, "word": "capacity", "opt": "E", "pos": "n.", "pos_type": "noun", "meaning": "能力", "orig_ref": "原题9第1空 [E]", "explanation": "形容词性物主代词 your 后接名词，与 your intelligence 并列；capacity for hard work 意为“刻苦努力的能力”。"}, {"num": 2, "word": "earned", "opt": "H", "pos": "v.", "pos_type": "verb", "meaning": "赢得，挣得", "orig_ref": "原题9第2空 [H]", "explanation": "have ___ and received 构成现在完成时并列过去分词，the education you have earned and received 意为“你们凭努力赢得并接受的教育”。"}, {"num": 3, "word": "belong to", "opt": "J", "pos": "phr.", "pos_type": "verb", "meaning": "属于", "orig_ref": "原题9第3空 [J]", "explanation": "主语 The great majority of you 为复数概念，后接宾语 the world's only remaining superpower，填动词短语 belong to（属于世界上唯一仅存的超级大国）。"}, {"num": 4, "word": "bear", "opt": "B", "pos": "v.", "pos_type": "verb", "meaning": "施加 (bring to bear on)", "orig_ref": "原题9第4空 [B]", "explanation": "固定习语 bring pressure to bear on... 意为“向……施加压力”。"}, {"num": 5, "word": "choose", "opt": "I", "pos": "v.", "pos_type": "verb", "meaning": "选择", "orig_ref": "原题9第5空 [I]", "explanation": "与后半分句排比结构 if you choose to identify... 完全一致，填动词原形 choose。"}, {"num": 6, "word": "on behalf of", "opt": "F", "pos": "phr.", "pos_type": "prep", "meaning": "代表，替……发声", "orig_ref": "原题9第6空 [F]", "explanation": "raise your voice on behalf of those who have no voice 意为“代表那些无法发声的人发出你们的声音”。"}, {"num": 7, "word": "powerless", "opt": "A", "pos": "adj.", "pos_type": "adj", "meaning": "无权无势的，弱势的", "orig_ref": "原题9第7空 [A]", "explanation": "not only with the powerful, but with the powerless 构成鲜明反义对比，the powerless 表示“弱势群体、无权无势的人”。"}, {"num": 8, "word": "advantages", "opt": "N", "pos": "n.", "pos_type": "noun", "meaning": "优势，优越条件", "orig_ref": "原题9第8空 [N]", "explanation": "形容词性物主代词 your 后接名词，those who do not have your advantages 意为“那些不具备你们这些优越条件的人”。"}, {"num": 9, "word": "celebrate", "opt": "C", "pos": "v.", "pos_type": "verb", "meaning": "庆祝，赞美", "orig_ref": "原题9第9空 [C]", "explanation": "定语从句修饰 your proud families，celebrate your existence 意为“为你们的存在而欢呼庆贺”。"}, {"num": 10, "word": "transform", "opt": "O", "pos": "v.", "pos_type": "verb", "meaning": "改变，改造", "orig_ref": "原题9第10空 [O]", "explanation": "不定式 to 后接及物动词原形，transform the world 意为“改变世界”，与前句 helped change 呼应。"}], "vocab": [["capacity for", "phr. ……的能力"], ["set sb. apart", "phr. 使某人鹤立鸡群/与众不同"], ["bring pressure to bear on", "phr. 对……施加压力"], ["on behalf of", "phr. 代表，为了……的利益"], ["identify with", "phr. 与……产生共鸣，认同"]], "translation": "而你们——2008届的哈佛毕业生们——触动他人人生的可能性又会有多大呢？你们的才智、你们刻苦努力的能力（capacity），以及你们凭努力赢得（earned）并接受的教育，赋予了你们独特的地位，也赋予了你们独特的责任。就连你们的国籍也使你们与众不同。你们中的绝大多数人属于（belong to）当今世界上唯一仅存的超级大国。你们投票的方式、生活的方式、抗议的方式，以及你们向政府施加（bring to bear）的压力，都会产生远远超出你们国界的影响。这是你们的特权，也是你们的重担。如果你们选择（choose）利用自己的地位和影响力，代表（on behalf of）那些无法发声的人仗义执言；如果你们选择不仅认同权贵，也认同弱势群体（powerless）；如果你们依然保有设身处地想象那些不具备你们这些优越条件（advantages）之人生活的能力，那么，为你们的存在而欢呼庆贺（celebrate）的将不仅是你们自豪的家人，还有成千上万因你们的帮助而改变了现实命运的人们。我们不需要魔法来改变（transform）世界。我们内心早已拥有所需的全部力量：我们拥有想象更美好世界的力量。"}]}, {"id": "theme2", "title": "专题二：史蒂夫·乔布斯 2005年斯坦福大学毕业演讲", "subtitle": "How to Live Before You Die（共6道原题：第2、5、13、14、18、24题 → 合并精简为4个连贯单元）", "color": "#0F5257", "badge_bg": "#E6F4F1", "orig_q_list": [18, 2, 13, 14, 5, 24], "units": [{"unit_id": "2.1", "unit_title": "单元 2.1：第一个故事——从里德学院退学、旁听与追随好奇心和直觉", "orig_questions": [18], "is_merged": false, "error_note": null, "word_bank": [["A", "romantic", "adj.", "浪漫的"], ["B", "naively", "adv.", "天真地"], ["C", "naturally", "adv.", "自然而然地"], ["D", "scary", "adj.", "可怕的，吓人的"], ["E", "deposits", "n.", "押金，瓶子回收押金"], ["F", "peer", "v./n.", "凝视；同龄人"], ["G", "stumbled", "v.", "偶然接触，无意中发现 (stumble into)"], ["H", "intuition", "n.", "直觉"], ["I", "decided", "v.", "决定"], ["J", "dropping", "v.", "旁听 (drop in on)"], ["K", "required", "adj.", "必修的，规定的"], ["L", "figure", "v.", "弄清楚 (figure out)"], ["M", "choose", "v.", "选择"], ["N", "tuition", "n.", "学费"], ["O", "ambition", "n.", "野心，抱负"]], "orig_q_keys": [{"q_num": 18, "summary": "1-B (naively) | 2-N (tuition) | 3-L (figure) | 4-D (scary) | 5-K (required) | 6-J (dropping) | 7-A (romantic) | 8-E (deposits) | 9-G (stumbled) | 10-H (intuition)"}], "passage_parts": ["And 17 years later I did go to college. But I ", {"b": 1}, " chose a college that was almost as expensive as Stanford, and all of my working-class parents' savings were being spent on my college ", {"b": 2}, ". After six months, I couldn't see the value in it. I had no idea what I wanted to do with my life and no idea how college was going to help me ", {"b": 3}, " it out. And here I was spending all of the money my parents had saved their entire life. So I decided to drop out and trust that it would all work out okay. It was pretty ", {"b": 4}, " at the time, but looking back it was one of the best decisions I ever made. The minute I dropped out I could stop taking the ", {"b": 5}, " classes that didn't interest me, and begin ", {"b": 6}, " in on the ones that looked far more interesting. It wasn't all ", {"b": 7}, ". I didn't have a dorm room, so I slept on the floor in friends' rooms, I returned coke bottles for the five cent ", {"b": 8}, " to buy food with, and I would walk the seven miles across town every Sunday night to get one good meal a week at the Hare Krishna temple. I loved it. And much of what I ", {"b": 9}, " into by following my curiosity and ", {"b": 10}, " turned out to be priceless later on."], "blanks": [{"num": 1, "word": "naively", "opt": "B", "pos": "adv.", "pos_type": "adv", "meaning": "天真地", "orig_ref": "原题18第1空 [B]", "explanation": "主语 I 与谓语 chose 之间需填副词；因为不懂事选了和斯坦福一样昂贵的大学，花光工薪阶层养父母的积蓄，所以是“天真地（naively）”。"}, {"num": 2, "word": "tuition", "opt": "N", "pos": "n.", "pos_type": "noun", "meaning": "学费", "orig_ref": "原题18第2空 [N]", "explanation": "固定搭配 college tuition 意为“大学学费”。"}, {"num": 3, "word": "figure", "opt": "L", "pos": "v.", "pos_type": "verb", "meaning": "弄明白 (figure out)", "orig_ref": "原题18第3空 [L]", "explanation": "help sb. do sth. 后接动词原形，figure it out 为固定短语“弄清楚人生想做什么”。"}, {"num": 4, "word": "scary", "opt": "D", "pos": "adj.", "pos_type": "adj", "meaning": "可怕的，令人害怕的", "orig_ref": "原题18第4空 [D]", "explanation": "程度副词 pretty 后接形容词作表语，与 but looking back it was one of the best decisions 转折呼应，表示当时退学“相当令人害怕（scary）”。"}, {"num": 5, "word": "required", "opt": "K", "pos": "adj.", "pos_type": "adj", "meaning": "必修的", "orig_ref": "原题18第5空 [K]", "explanation": "the required classes 意为“必修课”（与自己感兴趣的旁听课对比）。"}, {"num": 6, "word": "dropping", "opt": "J", "pos": "v.", "pos_type": "verb", "meaning": "旁听 (drop in on)", "orig_ref": "原题18第6空 [J]", "explanation": "与 stop taking 并列，begin doing sth.；固定搭配 drop in on classes 意为“去旁听课程”。"}, {"num": 7, "word": "romantic", "opt": "A", "pos": "adj.", "pos_type": "adj", "meaning": "浪漫的", "orig_ref": "原题18第7空 [A]", "explanation": "后文描述睡朋友房间地板、退可乐瓶换钱吃饭的窘迫生活，说明这一切“并不全然浪漫（romantic）”。"}, {"num": 8, "word": "deposits", "opt": "E", "pos": "n.", "pos_type": "noun", "meaning": "押金", "orig_ref": "原题18第8空 [E]", "explanation": "the five cent deposits 指退还空可乐瓶换回的“5美分押金”。"}, {"num": 9, "word": "stumbled", "opt": "G", "pos": "v.", "pos_type": "verb", "meaning": "偶然发现 (stumble into)", "orig_ref": "原题18第9空 [G]", "explanation": "固定短语 stumble into 意为“偶然涉足、无意中接触到”。"}, {"num": 10, "word": "intuition", "opt": "H", "pos": "n.", "pos_type": "noun", "meaning": "直觉", "orig_ref": "原题18第10空 [H]", "explanation": "与 curiosity 并列作 following 的宾语，my curiosity and intuition 意为“我的好奇心与直觉”。"}], "vocab": [["naively", "adv. 天真地，幼稚地"], ["college tuition", "n. 大学学费"], ["figure out", "phr. 想出，弄明白"], ["required classes", "n. 必修课"], ["drop in on", "phr. 顺便走访，旁听（课程）"], ["stumble into", "phr. 无意中闯入，偶然接触到"], ["intuition", "n. 直觉"]], "translation": "17年后，我真的上了大学。但我当时很天真地（naively）选择了一所几乎和斯坦福一样昂贵的大学，我那工薪阶层养父母的所有积蓄都花在了我的大学学费（tuition）上。六个月后，我看不出这有什么价值。我不知道自己一辈子想干什么，也不知道大学能怎样帮我弄明白（figure out）这一点。而我却正在花光父母攒了一辈子的钱。于是我决定退学，并相信船到桥头自然直。当时这个决定相当可怕（scary），但回过头来看，那是我做过的最正确的决定之一。退学的那一刻起，我就可以停止去上那些我不感兴趣的必修（required）课，开始去旁听（dropping in on）那些看起来有趣得多的课程。这一切并不全然浪漫（romantic）。我没有宿舍，所以只能睡在朋友房间的地板上；我去退还可乐瓶，靠每个瓶子5美分的押金（deposits）买吃的；每个周日晚上，我都要走上七英里横穿整个城镇，去哈瑞·奎师那神庙吃上一顿每周唯一的美食。但我热爱那段时光。我追随自己的好奇心和直觉（intuition）所偶然接触到（stumbled into）的许多东西，在后来看来都成了无价之宝。"}, {"unit_id": "2.2", "unit_title": "单元 2.2：第二个故事——30岁被苹果解雇、公开的失败与“初学者的轻松”（合并原题 2 & 原题 13 & 原题 14）", "orig_questions": [2, 13, 14], "is_merged": true, "error_note": "本单元将连续重叠的三道题【原题2】、【原题13】与【原题14】合并为一段完整叙事（共21处考点，涵盖三题全部30个设空点），下方同时提供三道原题各自的独立答案字母速查。", "word_bank": [["原题2-F", "released", "v.", "发布，推出"], ["原题2-O", "started", "v.", "创办，开创"], ["原题2-D", "hired", "v.", "雇佣，聘请"], ["原题2-G / 13-E", "talented", "adj.", "有才华的，有才能的"], ["原题2-C", "visions", "n.", "愿景，构想"], ["原题2-M", "diverge", "v.", "分歧，背道而驰 (原题13作 differ)"], ["原题2-J", "publicly", "adv.", "公开地"], ["原题2-N", "devastating", "adj.", "毁灭性的，令人崩溃的"], ["原题13-J / 14-N", "what", "pron.", "什么 (what to do)"], ["原题2-L", "previous", "adj.", "先前的，上一代的"], ["原题13-M / 14-C", "down", "adv.", "失望 (let sb. down)"], ["原题14-A", "baton", "n.", "接力棒"], ["原题13-K", "as", "conj.", "当……的时候"], ["原题14-D", "apologize", "v.", "道歉"], ["原题2-A", "screwing", "v.", "搞砸 (screw up)"], ["原题13-N", "public", "adj.", "公开的，众人皆知的"], ["原题14-F", "failure", "n.", "失败者"], ["原题13-A / 14-H", "dawn", "v.", "开始明白，渐渐清楚 (dawn on sb.)"], ["原题14-I", "turn", "n.", "转折，变化 (turn of events)"], ["原题13-G / 14-B", " F]", "explanation": "不定冠词 a 与形容词 public 后接单数可数名词 failure（失败者）。"}, {"num": 18, "word": "dawn", "opt": "原题13-A / 14-H", "pos": "v.", "pos_type": "verb", "meaning": "开始明白 (dawn on sb.)", "orig_ref": "原题13第6空 [A] / 原题14第6空 [H]", "explanation": "【两题共考】固定短语 dawn on sb. 意为“某人渐渐明白/意识到某事”。"}, {"num": 19, "word": "turn", "opt": "原题14-I", "pos": "n.", "pos_type": "noun", "meaning": "转折，变故", "orig_ref": "原题14第7空 [I]", "explanation": "固定搭配 the turn of events 意为“事态的转折/变故”。"}, {"num": 20, "word": "rejected", "opt": "原题13-G / 14-B", "pos": "v.", "pos_type": "verb", "meaning": "被拒绝，被抛弃", "orig_ref": "原题13第7空 [G] / 原题14第8空 [B]", "explanation": "【两题共考】had been rejected 构成过去完成时的被动语态，意为“我虽然被拒绝/抛弃了，但依然热恋着我所做的事”。"}, {"num": 21, "word": "start over", "opt": "原题14-K", "pos": "phr.", "pos_type": "verb", "meaning": "重新开始", "orig_ref": "原题14第9空 [K]", "explanation": "decided to start over 意为“决定从头开始”。"}, {"num": 22, "word": "fired", "opt": "原题13-B", "pos": "v.", "pos_type": "verb", "meaning": "解雇", "orig_ref": "原题13第8空 [B]", "explanation": "getting fired from Apple 意为“被苹果公司解雇”。"}, {"num": 23, "word": "heaviness", "opt": "原题13-H", "pos": "n.", "pos_type": "noun", "meaning": "沉重感", "orig_ref": "原题13第9空 [H]", "explanation": "与后文 the lightness（轻松感）形成反义对称，the heaviness of being successful 意为“成功带来的沉重感”。"}, {"num": 24, "word": "replaced", "opt": "原题14-L", "pos": "v.", "pos_type": "verb", "meaning": "取代，代替", "orig_ref": "原题14第10空 [L]", "explanation": "was replaced by... 意为“被……所取代”。"}, {"num": 25, "word": "less", "opt": "原题13-D", "pos": "adv.", "pos_type": "adv", "meaning": "不那么，更少地", "orig_ref": "原题13第10空 [D]", "explanation": "less sure about everything 意为“对一切都不再那么笃定（从而拥有了初学者的轻松）”。"}], "vocab": [["diverge", "v. 分叉，产生分歧"], ["have a falling out", "phr. 闹翻，决裂"], ["side with", "phr. 站在……一边，支持"], ["devastating", "adj. 毁灭性的，令人备受打击的"], ["let sb. down", "phr. 让某人失望，辜负"], ["screw up", "phr. 搞砸"], ["dawn on sb.", "phr. 使某人渐渐明白"], ["the turn of events", "phr. 事态的转折/变化"]], "translation": "我们努力工作，10年间苹果就从车库里的我们两个人，成长为一家市值20亿美元、拥有4000多名员工的大公司。就在一年前，我们刚刚发布了（released）我们最棒的作品——麦金塔电脑（Macintosh），而我刚满30岁。然后我却被解雇了。你怎么会被自己一手创办（started）的公司解雇呢？嗯，随着苹果的成长，我们聘请了（hired）一位我认为非常有才华（talented）的人来和我一起管理公司，在最初的一年左右进展很顺利。但随后我们对未来的愿景（visions）开始出现分歧（diverge），最终我们闹翻了。当我们决裂时，董事会站在了他那一边。所以在30岁那年我出局了，而且是非常公开地（publicly）出局了。我整个成年生活的重心一下子没了，那种打击是毁灭性的（devastating）。整整几个月里，我真的不知道该做什么（what to do）。我觉得自己辜负了（let ... down）上一代（previous）企业家前辈们——觉得接力棒（baton）正交到（as）我手里时，却被我弄掉了。我约见了大卫·帕卡德和鲍勃·诺伊斯，试图为自己把事情搞砸（screwing up）得这么彻底而道歉（apologize）。我成了一个众人皆知的（public）失败者（failure），甚至想过要逃离硅谷。但渐渐地，有一件事在我脑海中清晰起来（dawn on me）——我依然热爱我所做的事。在苹果公司发生的一系列变故（turn of events）丝毫没有改变这一点。我虽然被拒绝了（rejected），但我依然深爱着我的事业。于是我决定从头开始（start over）。当时我还没看出来，但后来证明，被苹果解雇（fired）是我一生中发生过的最好的事。成功所带来的沉重感（heaviness），被重新成为一名初学者的轻松感所取代（replaced），对一切都不再那么（less）笃定。这让我获得了解放，进入了人生中最具创造力的时期之一。"}, {"unit_id": "2.3", "unit_title": "单元 2.3：第三个故事（上）——胰腺癌诊断、交代后事与罕见可治愈肿瘤", "orig_questions": [5], "is_merged": false, "error_note": "⚠️【原图错题重点纠偏】原PDF第3页截图中，第5题第10空被误填为 D (advised)，导致 D 被重复使用了两次！第3空（My doctor ___ me）确为 D. advised，而第10空（a ___ form of pancreatic cancer）正确答案为 O. rare（一种罕见的胰腺癌）。", "word_bank": [["A", "stuck", "v.", "刺入，伸入 (stick的过去式)"], ["B", "microscope", "n.", "显微镜"], ["C", "common", "adj.", "常见的，普通的"], ["D", "advised", "v.", "建议，忠告"], ["E", "diagnosed", "v.", "诊断 (be diagnosed with)"], ["F", "diagnosis", "n.", "诊断结果"], ["G", "prepared", "v./adj.", "准备好"], ["H", "buttoned up", "phr.", "妥善处理完毕，安排停当"], ["I", "in order", "phr.", "井然有序，安排妥当"], ["J", "incurable", "adj.", "不可治愈的，绝症的"], ["K", "treated", "v.", "治疗，对待"], ["L", "nightmare", "n.", "噩梦"], ["M", "cast", "v.", "投射"], ["N", "needle", "n.", "针，穿刺针"], ["O", "rare", "adj.", "罕见的，稀有的"]], "orig_q_keys": [{"q_num": 5, "summary": "1-E (diagnosed) | 2-J (incurable) | 3-D (advised) | 4-I (in order) | 5-H (buttoned up) | 6-F (diagnosis) | 7-A (stuck) | 8-N (needle) | 9-B (microscope) | 10-O (rare) 【修正原图第10空错填D】"}], "passage_parts": ["About a year ago I was ", {"b": 1}, " with cancer. I had a scan at 7:30 in the morning, and it clearly showed a tumor on my pancreas. The doctors told me this was almost certainly a type of cancer that is ", {"b": 2}, ", and that I should expect to live no longer than three to six months. My doctor ", {"b": 3}, " me to go home and get my affairs ", {"b": 4}, ", which is doctor's code for prepare to die. It means to try to tell your kids everything you thought you'd have the next 10 years to tell them in just a few months. It means to make sure everything is ", {"b": 5}, " so that it will be as easy as possible for your family. I lived with that ", {"b": 6}, " all day. Later that evening I had a biopsy, where they ", {"b": 7}, " an endoscope down my throat, through my stomach and into my intestines, put a ", {"b": 8}, " into my pancreas and got a few cells from the tumor. I was sedated, but my wife told me that when they viewed the cells under a ", {"b": 9}, ", the doctors started crying because it turned out to be a ", {"b": 10}, " form of pancreatic cancer that is curable with surgery."], "blanks": [{"num": 1, "word": "diagnosed", "opt": "E", "pos": "v.", "pos_type": "verb", "meaning": "被诊断出", "orig_ref": "原题5第1空 [E]", "explanation": "固定搭配 be diagnosed with cancer 意为“被诊断出患有癌症”。"}, {"num": 2, "word": "incurable", "opt": "J", "pos": "adj.", "pos_type": "adj", "meaning": "不可治愈的", "orig_ref": "原题5第2空 [J]", "explanation": "由后文 expect to live no longer than three to six months 可知，这几乎可以肯定是一种“无法治愈的（incurable）”癌症。"}, {"num": 3, "word": "advised", "opt": "D", "pos": "v.", "pos_type": "verb", "meaning": "建议", "orig_ref": "原题5第3空 [D]", "explanation": "advise sb. to do sth. 意为“医生建议我回家去处理后事”。"}, {"num": 4, "word": "in order", "opt": "I", "pos": "phr.", "pos_type": "prep", "meaning": "安排妥当", "orig_ref": "原题5第4空 [I]", "explanation": "固定习语 get one's affairs in order 意为“把身后事务安排妥当”。"}, {"num": 5, "word": "buttoned up", "opt": "H", "pos": "phr.", "pos_type": "adj", "meaning": "妥善料理完毕", "orig_ref": "原题5第5空 [H]", "explanation": "make sure everything is buttoned up 是对 get my affai 4第2空 [A]", "explanation": "乔布斯演讲名言：Death is very likely the single best invention of Life（死亡很可能是生命最好的一项发明）。"}, {"num": 3, "word": "agent", "opt": "D", "pos": "n.", "pos_type": "noun", "meaning": "变革推动者 (change agent)", "orig_ref": "原题24第3空 [D]", "explanation": "change agent 为固定表达，意为“变革的推动者/动因（它清除旧事物，为新事物铺路）”。"}, {"num": 4, "word": "gradually", "opt": "E", "pos": "adv.", "pos_type": "adv", "meaning": "逐渐地", "orig_ref": "原题24第4空 [E]", "explanation": "will ___ become 之间填副词，you will gradually become the old 意为“你们也将逐渐变老并被清除”。"}, {"num": 5, "word": "dramatic", "opt": "H", "pos": "adj.", "pos_type": "adj", "meaning": "戏剧性的，危言耸听的", "orig_ref": "原题24第5空 [H]", "explanation": "Sorry to be so dramatic 意为“抱歉说得这么富有戏剧性/危言耸听”。"}, {"num": 6, "word": "limited", "opt": "L", "pos": "adj.", "pos_type": "adj", "meaning": "有限的", "orig_ref": "原题24第6空 [L]", "explanation": "Your time is limited 意为“你们的时间是有限的”。"}, {"num": 7, "word": "dogma", "opt": "M", "pos": "n.", "pos_type": "noun", "meaning": "教条", "orig_ref": "原题24第7空 [M]", "explanation": "后文破折号直接给出了定义 living with the results of other people's thinking（活在别人的思考结果里），即“教条（dogma）”。"}, {"num": 8, "word": "drown", "opt": "N", "pos": "v.", "pos_type": "verb", "meaning": "淹没 (drown out)", "orig_ref": "原题24第8空 [N]", "explanation": "let sb./sth. do sth. 后接动词原形，drown out your own inner voice 意为“淹没你自己内心的声音”。"}, {"num": 9, "word": "intuition", "opt": "J", "pos": "n.", "pos_type": "noun", "meaning": "直觉", "orig_ref": "原题24第9空 [J]", "explanation": "follow your heart and intuition 意为“追随你的内心与直觉”。"}, {"num": 10, "word": "secondary", "opt": "K", "pos": "adj.", "pos_type": "adj", "meaning": "次要的", "orig_ref": "原题24第10空 [K]", "explanation": "Everything else is secondary 意为“其他一切都是次要的”。"}], "vocab": [["change agent", "n. 变革推动者，改变的催化剂"], ["make way for", "phr. 为……让路"], ["dogma", "n. 教条，信条"], ["drown out", "phr. （声音）盖过，淹没"], ["secondary", "adj. 次要的，第二位的"]], "translation": "没有人想死。哪怕是那些想进天堂的人，也不想通过死去那里。然而，死亡是我们所有人共同的终点（destination），从来没有人能逃脱它。这也正是事情本该有的样子，因为死亡很可能是生命最好的一项发明（invention）。它是生命变革的推动者（agent），清除掉旧事物，为新事物让路。此时此刻，你们就是新事物；但在不久的将来有一天，你们也会逐渐（gradually）变成旧事物并被清除掉。很抱歉说得这么危言耸听（dramatic），但这千真万确。你们的时间是有限的（limited），所以不要浪费时间去活在别人的人生里。不要被教条（dogma）所困——那只是活在别人思考的结果里。不要让他人意见的噪音淹没（drown out）你自己内心的声音。最重要的是，要有勇气去追随你的内心和直觉（intuition）。它们不知何故早已知道你真正想成为什么样的人。其他一切都是次要的（secondary）。"}]}, {"id": "theme3", "title": "专题三：戴尔·卡耐基《道开忧虑：不要指望别人感恩》", "subtitle": "How to Stop Worrying and Start Living — Expect Ingratitude（共10道原题：第3、7、8、15、16、17、25、27、28、30题 → 合并精简为6个连贯单元）", "color": "#6B2D5C", "badge_bg": "#F7EDF5", "orig_q_list": [30, 8, 25, 17, 7, 28, 15, 16, 27, 3], "units": [{"unit_id": "3.1", "unit_title": "单元 3.1：德州商人的圣诞奖金之怒与塞缪尔·约翰逊论感恩（合并原题 30 & 原题 8）", "orig_questions": [30, 8], "is_merged": true, "error_note": "本单元将前后衔接且中间段落重合的【原题30】与【原题8】合并为完整故事（共18处考点，其中第7、10空为两题共同设空点），下方同时提供两道原题各自的独立答案字母速查。", "word_bank": [["原题30-O", "indignation", "n.", "愤慨，义愤"], ["原题30-A", "incident", "n.", "事件，小事"], ["原题30-B", "burned up", "phr.", "大发雷霆，恼火"], ["原题30-H", "approximately", "adv.", "大约，近似地"], ["原题30-G", "complained", "v.", "抱怨"], ["原题30-D", "poison", "n.", "毒药，毒素"], ["原题30-M / 8-E", "honestly", "adv.", "老实说，真心地"], ["原题30-E", "average", "n.", "平均水平 (on the average)"], ["原题8-N", "present", "adj.", "现在的，当前的"], ["原题30-I", "remaining", "adj.", "剩下的，余下的"], ["原题30-K / 8-G", "resentment", "n.", "怨恨，愤恨"], ["原题8-J", "wallowing", "v.", "沉溺于 (wallow in)"], ["原题8-O", "appreciation", "n.", "感激，赞赏"], ["原题8-F", "overworked", "v.", "使过度劳累"], ["原题8-C", "unapproachable", "adj.", "难以接近的，冷漠的"], ["原题8-L", "ill-mannered", "adj.", "粗鲁的，没礼貌的"], ["原题8-I", "cultivation", "n.", "教养，修养，培育"], ["原题8-B", "distressing", "adj.", "令人苦恼的，可悲的"]], "orig_q_keys": [{"q_num": 30, "summary": "1-O (indignation) | 2-A (incident) | 3-B (burned up) | 4-H (approximately) | 5-G (complained) | 6-D (poison) | 7-M (honestly) | 8-E (average) | 9-I (remaining) | 10-K (resentment)"}, {"q_num": 8, "summary": "1-E (honestly) | 2-N (present) | 3-G (resentment) | 4-J (wallowing) | 5-O (appreciation) | 6-F (overworked) | 7-C (unapproachable) | 8-L (ill-mannered) | 9-I (cultivation) | 10-B (distressing)"}], "passage_parts": ["I recently met a business man in Texas who was burned up with ", {"b": 1}, ". I was warned that he would tell me about it within fifteen minutes after I met him. He did. The ", {"b": 2}, " he was angry about had occurred eleven months previously, but he was still ", {"b": 3}, " about it. He couldn't speak of anything else. He had given his thirty-four employees ten thousand dollars in Christmas bonuses — ", {"b": 4}, " three hundred dollars each — and no one had thanked him. \"I am sorry,\" he ", {"b": 5}, " bitterly, \"that I ever gave them a penny!\" \"An angry man,\" said Confucius, \"is always full of ", {"b": 6}, ".\" This man was so full of poison that I ", {"b": 7}, " pitied him. He was about sixty years old. Now, life-insurance companies figure that, on the ", {"b": 8}, ", we will live slightly more than two-thirds of the difference between our ", {"b": 9}, " age and eighty. So this man — if he was lucky — probably had about fourteen or fifteen years to live. Yet he had already wasted almost one of his few ", {"b": 10}, " years by his bitterness and ", {"b": 11}, " over an event that was past and gone. Instead of ", {"b": 12}, " in resentment and self-pity, he might have asked himself why he didn't get any ", {"b": 13}, ". Maybe he had underpaid and ", {"b": 14}, " his employees. Maybe they considered a Christmas bonus not a gift, but something they had earned. Maybe he was so critical and ", {"b": 15}, " that no one dared or cared to thank him. Maybe they felt he gave the bonus because most of the profits were going for taxes. On the other hand, maybe the employees were selfish, mean, and ", {"b": 16}, ". I don't know any more about it than you do. But I do know what Dr. Samuel Johnson said: \"Gratitude is a fruit of great ", {"b": 17}, ". You do not find it among gross people.\" Here is the point I am trying to make: this man made the human and ", 恨，愤恨"], ["wallow in", "phr. 沉溺于，深陷于（消极情绪）"], ["unapproachable", "adj. 难以亲近的，冷漠的"], ["ill-mannered", "adj. 粗鲁的，没教养的"], ["cultivation", "n. 教养，修养，栽培"], ["gross", "adj. 粗俗的，愚钝的"]], "translation": "我最近在得克萨斯州遇到一位商人，他正满腔愤慨（indignation）、怒火中烧。别人事先提醒我说，见面不到十五分钟他准会向我倾诉这件事。他果然说了。那件让他大动肝火的事情（incident）发生在十一个月前，但他至今仍对此耿耿于怀、怒火未消（burned up）。除此之外他什么也谈不进去。他曾给手下的34名员工发了一万美元的圣诞奖金——每人大约（approximately）三百美元——却没有一个人向他道谢。“我真后悔，”他苦涩地抱怨道（complained），“当初哪怕给他们一分钱！”孔子曾说：“愤怒的人总是充满了毒素（poison）。”这个人身体里充满了怨毒，我真心地（honestly）替他感到可怜。他大约六十岁了。如今人寿保险公司测算，平均而言（on the average），我们还能活的年数大约是目前（present）年龄与八十岁之差的三分之二多一点。所以这个人——如果他足够幸运的话——大概还有十四五年的寿命。然而，为了已经过去的一件事，他却在苦涩与怨恨（resentment）中白白浪费了自己所剩无几（remaining）的余生中的将近一年。与其沉溺于（wallowing）怨恨与自怜之中，他倒不如问问自己为什么没有得到任何感激（appreciation）。也许是他平时给员工的薪水太低，又让他们过度劳累（overworked）；也许员工们觉得圣诞奖金不是恩赐，而是自己应得的报酬；也许他平时太过挑剔、冷漠而难以接近（unapproachable），以至于没人敢或愿意去感谢他；又或许员工们觉得他发奖金只是因为反正大部分利润都要交税。另一方面，也许那些员工确实自私、刻薄、粗鲁无礼（ill-mannered）。我对内情的了解并不比你多。但我知道塞缪尔·约翰逊博士说过的一句话：“感恩是极高教养（cultivation）结出的果实，在粗俗的人身上是找不到的。”这就是我在本章想要阐明的观点：这个人犯了一个既属人之常情、又令人苦恼（distressing）的错误——指望别人感恩。"}, {"unit_id": "3.2", "unit_title": "单元 3.2：救命之恩与金钱之怨——莱博维茨律师、施瓦布与安德鲁·卡耐基（合并原题 25 & 原题 17）", "orig_questions": [25, 17], "is_merged": true, "error_note": "本单元将高度重合的【原题25】与【原题17】合并为完整段落（共16处考点，其中 matters、speculated 等为两题共同设空点），下方同时列出两道原题各自的独立答案字母速查。", "word_bank": [["原题25-H", "saved", "v.", "拯救，挽救"], ["原题25-D", "chair", "n.", "椅子 (electric chair 电椅)"], ["原题25-G / 17-B", "matters", "n.", "事情，问题 (money matters 金钱问题)"], ["原题17-J", "hopeless", "adj.", "无望的，不可救药的"], ["原题25-B / 17-H", "speculated", "v.", "投机，炒股 (speculate in)"], ["原题25-N", "belonging", "v.", "属于 (belonging to)"], ["原题17-I", "penitentiary", "n.", "州立监狱，感化院"], ["原题17-L", "grateful", "adj.", "感激的"], ["原题25-A", "against", "prep.", "反对，背叛 (turn against)"], ["原题17-N", "reviled", "v.", "辱骂，痛斥"], ["原题17-E", "jail", "n.", "监狱"], ["原题17-C", "cursing", "v.", "咒骂，诅咒"], ["原题17-D", "charities", "n.", "慈善机构"], ["原题17-A", "measly", "adj.", "少得可怜的，微不足道的"], ["原题25-K", "realistic", "adj.", "现实的，实事求是的"] "原题17第6空 [N]", "explanation": "与 and denounced him 并列作过去式谓语，reviled him 意为“辱骂、痛斥他”。"}, {"num": 11, "word": "jail", "opt": "原题17-E", "pos": "n.", "pos_type": "noun", "meaning": "监狱", "orig_ref": "原题17第7空 [E]", "explanation": "kept him out of jail 意为“使他免受牢狱之灾”。"}, {"num": 12, "word": "cursing", "opt": "原题17-C", "pos": "v.", "pos_type": "verb", "meaning": "咒骂", "orig_ref": "原题17第8空 [C]", "explanation": "find sb. doing sth. 结构，find this relative cursing him 意为“震惊地发现这个亲戚正在咒骂他”。"}, {"num": 13, "word": "charities", "opt": "原题17-D", "pos": "n.", "pos_type": "noun", "meaning": "慈善机构", "orig_ref": "原题17第9空 [D]", "explanation": "public charities 意为“公共慈善机构”。"}, {"num": 14, "word": "measly", "opt": "原题17-A", "pos": "adj.", "pos_type": "adj", "meaning": "少得可怜的，微不足道的", "orig_ref": "原题17第10空 [A]", "explanation": "修饰 million，one measly million 意为“区区一百万美元（讽刺亲戚贪得无厌）”。"}, {"num": 15, "word": "realistic", "opt": "原题25-K", "pos": "adj.", "pos_type": "adj", "meaning": "现实的", "orig_ref": "原题25第7空 [K]", "explanation": "be as realistic about it as... 意为“像老马可·奥勒留那样现实地看待这件事”（详见单元3.3）。"}, {"num": 16, "word": "Disturbed", "opt": "原题25-O", "pos": "adj.", "pos_type": "adj", "meaning": "心烦意乱的", "orig_ref": "原题25第8空 [O]", "explanation": "be surprised or disturbed 意为“感到惊讶或心烦意乱”。"}, {"num": 17, "word": "sense", "opt": "原题25-E", "pos": "n.", "pos_type": "noun", "meaning": "道理 (make sense)", "orig_ref": "原题25第9空 [E]", "explanation": "That makes sense 意为“这很有道理”。"}, {"num": 18, "word": "grumbling", "opt": "原题25-F", "pos": "v.", "pos_type": "verb", "meaning": "发牢骚，抱怨", "orig_ref": "原题25第10空 [F]", "explanation": "go around grumbling about ingratitude 意为“到处抱怨别人忘恩负义”。"}], "vocab": [["electric chair", "n. 电椅"], ["speculate in the stock market", "phr. 在股市投机"], ["put up the money", "phr. 出钱，垫付资金"], ["penitentiary", "n. 监狱，感化院"], ["turn against", "phr. 背叛，反目成仇"], ["revile / denounce", "v. 辱骂 / 谴责"], ["measly", "adj. 少得可怜的，微不足道的"]], "translation": "如果你救了（saved）一个人的命，你会指望他感恩吗？你可能会——但塞缪尔·莱博维茨在成为法官之前是一位著名的刑事律师，他曾救下78个人免于坐上电椅（electric chair）！然而没有一个人向他道谢。而一旦涉及到金钱问题（money matters）——那就更没指望了（hopeless）。查尔斯·施瓦布告诉我，他曾救过一名挪用属于（belonging to）银行的资金在股市投机（speculated）的银行出纳员。施瓦布出钱替他补上了窟窿，救他免于被送进监狱（penitentiary）。那个出纳员心存感激（grateful）吗？哦，是的，感激了一小会儿。随后他就反咬一口，与施瓦布反目成仇（turned against），辱骂（reviled）他、公开谴责他——而施瓦布正是那个帮他免受牢狱之灾（jail）的大恩人！如果你留给某位亲戚一百万美元，你会指望他感激你吗？安德鲁·卡耐基就这么做了。但如果安德鲁·卡耐基死后不久能从坟墓里爬出来，他一定会震惊地发现这位亲戚正在咒骂（cursing）他！为什么？因为安迪把3.65亿美元留给了公共慈善机构（charities）——按这位亲戚的话说，只“用了区区（measly）一百万就把他给打发了”。"}, {"unit_id": "3.3", "unit_title": "单元 3.3：马可·奥勒留的日记、忘恩负义的人性与纽约孤独姑妈的抱怨（合并原题 7 & 原题 28 & 原题 15）", "orig_questions": [7, 28, 15], "is_merged": true, "error_note": "本单元将近乎完全重合的【原题7】与【原题28】，以及后半段衔接的【原题15】合并为完整段落（共19处考点）。注意：原题28选项G印作 `seuse`，系考试系统录入拼写错误，实为 `sense`（That makes sense）。", "word_bank": [["原题7-D", "probably", "adv.", "很可能，大概"], ["原题28-L", "change", "v.", "改变"], ["原题7-F / 28-M", "realistic", "adj.", "现实的，实事求是的"], ["原题28-E", "wisest", "adj.", "最睿智的"], ["原题7-M", "ruled", "v.", "统治"], ["原题7-E / 28-B", "egotistical", "adj.", "自私自利的，自我中心的"], ["原题7-N / 28-F", "disturbed", "adj.", "心烦意乱的，困扰的"], ["原题28-G", "sense (seuse)", "n.", "道理 (make sense)"], ["原题7-G / 28-H", "grumbling", "v.", "发牢骚，抱怨"], ["原题15-H", "blame", "v.", "责备 (be to blame)"], ["原题7-I / 28-N / 15-N", "ignorance", "n.", "无知"], ["原题7-A", "gratitude", "n.", "感恩，感激"], ["原题7-O", "occasionally", "adv.", "偶尔"], ["原题28-D / 15-K", "delightful", "adj.", "令人愉快的，欣喜的"], ["原题15-F", "point", "n.", "观点，要点"], ["原题28-J", "natural", "adj.", "自然的，天生的"], ["原题15-M", "headed", "v.", "朝……走去，注定遭受 (be headed for)"], ["原题7-H", "heartaches", "n.", "心痛，苦恼"], ["原题15-A", "near", "prep.", "靠近 (go near)"], ["原题15-G", "nursed", "v.", "照料，看护"], ["原题15-E", "business", "n.", "商业 (business school 商学院)"], ["原题15-I", "dread", "v.", "害怕，畏惧"], ["原题15-C", "endless", "adj.", "无休止的，没完没了的"]], "orig_q_keys": [{"q_num": 7, "summary": "1-D (probably) | 2-F (realistic) | 3-M (ruled) | 4-E (egotistical) | 5-N (disturbed) | 6-G (grumbling) | 7-I (ignorance) | 8-A (gratitude) | 9-O (occasionally) | 10-H (heartaches)"}, {"q_num": 28, "summary": "1-L (change) | 2-M (realistic) | 3-E (wisest) | 4-B (egotistical) | 5-F (disturbed) | 6-G (seuse/sense) | 7-H (grumbling) | 8-N (ignorance) | 9-D (delightful) | 10-J (natural)"}, {"q_num": 15, "summary": "1-H (blame) | 2-N (ignorance) | 3-K (delightful) | 4-F (point) | 5-M (headed) | 6-A (near) | 7-G (nursed) | 8-E (business) | 9-I (dread) | 10-C (endless)"}], "passage_parts": ["That's how it goes. Human nature has always been human nature — and it ", {"b": 1}, " won't ", {"b": 2}, " in your lifetime. So why not accept it? Why not be as ", {"b": 3}, " about it as was old Marcus Aurelius, one of the ", {"b": 4}, " men who ever ", {"b": 5}, " the Roman Empire. He wrote in his diary one day: \"I am going to meet people today who talk too much — people who are selfish, ", {"b": 6}, ", ungrateful. But I won't be surprised or ", {"b": 7}, ", for I couldn't imagine a world without such people.\" That makes ", {"b": 8}, ", doesn't it? If you and I go around ", {"b": 9}, " about ingratitude, who is to ", {"b": 10}, "? Is it human nature — or is it our ", {"b": 11}, " of human nature? Let's not expect ", {"b": 12}, ". Then, if we get some ", {"b": 13}, ", it will come as a ", {"b": 14}, " surprise. If we don't get it, we won't be disturbed. Here is the first ", {"b": 15}, " I am trying to make in this chapter: It is ", {"b": 16}, " for people to forget to be grateful; so, if we go around expecting gratitude, we are ", {"b": 17}, " straight for a lot of ", {"b": 18}, ". I know a woman in New York who is always complaining because she is lonely. Not one of her relatives wants to go ", {"b": 19}, " her — no wonder. If you visit her, she will tell you for hours what she did for her nieces when they were children: she ", {"b": 20}, " them through the measles; she boarded them for years; she helped to send one of them through ", {"b": 21}, " school. Do the nieces come to see her? Yes, now and then, out of a spirit of duty. But they ", {"b": 22}, " these visits. They know they will have to sit and listen for hours to half-veiled reproaches. They will be treated to an ", {"b": 23}, " litany of bitter complaints and self-pitying sighs."], "blanks": [{"num": 1, "word": "probably", "opt": "原题7-D", "pos": "adv.", "pos_type": "adv", "meaning": "很可能", "orig_ref": "原题7第1空 [D]", "explanation": "助动词 won't 前填副词，it probably won't change 意为“人性在你我有生之年很可能不会改变”。"}, {"num": 2, "word": "change", "opt": "原题28-L", "pos": "v.", "pos_type": "verb", "meaning": "改变", "orig_ref": "原题28第1空 [L]", "explanation": "助动词 won't 后接动词原形 change。"}, {"num": 3, "word": "realistic", "opt": "原题7-F / 28-M", "pos": "adj.", "pos_type": "adj", "meaning": "现实的", "orig_ref": "原题7第2空 [F] / 原题28第2空 [M]", "explanation": "【两题共考】be as realistic about it as... 意为“像马可·奥勒留那样现实地看待人性”。"}, {"num": 4, "word": "wisest", "opt": "原题28-E", "pos": "adj.", "pos_type": "adj", "meaning": "最睿智的", "orig_ref": "原题28第3空 [E]", "explanation": "one of the + 形容词最高级 + 复数名词，one of the wisest men 意为“最睿智的人之一”。"}, {"num": 5, "word": "ruled", "opt": "原题7-M", "pos": "v.", "pos_type": "verb", "meaning": "统治", "orig_ref": "原题7第3空 [M]", "explanation": "who ever ruled the Roman Empire 意为“曾统治过罗马帝国的（最睿智的人之一）”。"}, {"num": 6, "word": "egotistical", "opt": "原题7-E / 28-B", "pos": "adj.", "pos_type": "adj", "meaning": "自私自利的，唯我独尊的", "orig_ref": "原题7第4空 [E] / 原题28第4空 [B]", "explanation": "【两题共考】与 selfish, ungrateful 并列，填贬义形容词 egotistical。"}, {"num": 7, "word": "disturbed", "opt": "原题7-N / 28-F", "pos": "adj.", "pos_type": "adj", "meaning": "心烦意乱的", "orig_ref": "原题7第5空 [N] / 原题28第5空 [F]", "explanation": "【两题共考】be surprised or disturbed 意为“感到惊讶或困扰”，后文 we won't be disturbed 原词复现。"}, {"num": 8, "word": "sense", "opt": "原题28-G", "pos": "n.", "pos_type": "noun", "meaning": "道理 (make sense)", "orig_ref": "原题28第6空 [G (印作seuse)]", "explanation": "固定短语 That makes sense（这很有道理）。注意原题28选项G印作 seuse，选 G 即可。"}, {"num": 9, "word": "grumbling", "opt": "原题7-G / 28-H", "pos": "v.", "pos_type": "verb", "meaning": "抱怨，发牢骚", "orig_ref": "原题7第6空 [G] / 原题28第7空 [H]", "explanation": "【两题共考】go around grumbling about ingratitude 意为“到处发牢骚抱怨别人忘恩负义”。"}, {"num": 10, "word": "blame", "opt": "原题15-H", "pos": "v.", "pos_type": "verb", "meaning": "责备 (be to blame)", "orig_ref": "原题15第1空 [H]", "explanation": "固定句型 who is to blame? 意为“该怪谁呢？”。"}, {"num": 11, "word": "ignorance", "opt": "原题7-I / 28-N / 15-N", "pos": "n.", "pos_type": "noun", "meaning": "无知", "orig_ref": "原题7第7空 [I] / 原题28第8空 [N] / 原题15第2空 [N]", "explanation": "【三题共考】our ignorance of human nature 意为“我们对人性的无知”。"}, {"num": 12, "word": "gratitude", "opt": "原题7-A", "pos": "n.", "pos_type": "noun", "meaning": "感恩", "orig_ref": "原题7第8空 [A]", "explanation": "Let's not expect gratitude 意为“让我们不要指望别人感恩”。"}, {"num": 13, "word": "occasionally", "opt": "原题7-O", "pos": "adv.", "pos_type": "adv", "meaning": "偶尔", "orig_ref": "原题7第9空 [O]", "explanation": "修饰动词 get，if we get some occasionally 意为“如果我们偶尔得到一点感恩”。"}, {"num": 14, "word": "delightful", "opt": "原题28-D / 15-K", "pos": "adj.", "pos_type": "adj", "meaning": "令人惊喜的，愉快的", "orig_ref": "原题28第9空 [D] / 原题15第3空 [K]", "explanation": "【两题共考】come as a delightful surprise 意为“成为一份令人愉快的意外惊喜”。"}, {"num": 15, "word": "point", "opt": "原题15-F", "pos": "n.", "pos_type": "noun", "meaning": "要点，观点", "orig_ref": "原题15第4空 [F]", "explanation": "the first point I am trying to make 意为“我在本章想要阐述的第一个观点”。"}, {"num": 16, "word": "natural", "opt": "原题28-J", "pos": "adj.", "pos_type": "adj", "meaning": "自然的", "orig_ref": "原题28第10空 [J]", "explanation": "It is natural for people to forget to be grateful 意为“人们忘记感恩是天经地义/自然而然的”。"}, {"num": 17, "word": "headed", "opt": "原题15-M", "pos": "v.", "pos_type": "verb", "meaning": "朝……走去 (be headed for)", "orig_ref": "原题15第5空 [M]", "explanation": "固定短语 be headed straight for... 意为“径直走向、注定自找（许多心痛苦恼）”。"}, {"num": 18, "word": "heartaches", "opt": "原题7-H", "pos": "n.", "pos_type": "noun", "meaning": "心痛，苦恼", "orig_ref": "原题7第10空 [H]", "explanation": "a lot of heartaches 意为“许多心痛与烦恼”。"}, {"num": 19, "word": "near", "opt": "原题15-A", "pos": "prep.", "pos_type": "prep", "meaning": "靠近", "orig_ref": "原题15第6空 [A]", "explanation": "go near her 意为“靠近她、去探望她”。"}, {"num": 20, "word": "nursed", "opt": "原题15-G", "pos": "v.", "pos_type": "verb", "meaning": "照料，看护", "orig_ref": "原题15第7空 [G]", "explanation": "nursed them through the measles 意为“在她们出麻疹时悉心照料她们”。"}, {"num": 21, "word": "business", "opt": "原题15-E", "pos": "n.", "pos_type": "noun", "meaning": "商业 (business school)", "orig_ref": "原题15第8空 [E]", "explanation": "send one of them through business school 意为“资助其中一个读完商学院”。"}, {"num": 22, "word": "dread", "opt": "原题15-I", "pos": "v.", "pos_type": "verb", "meaning": "害怕，畏惧", "orig_ref": "原题15第9空 [I]", "explanation": "But they dread these visits 意为“但她们非常害怕这些探访”。"}, {"num": 23, "word": "endless", "opt": "原题15-C", "pos": "adj.", "pos_type": "adj", "meaning": "无休止的", "orig_ref": "原题15第10空 [C]", "explanation": "an endless litany of bitter complaints 意为“没完没了的苦涩抱怨”。"}], "vocab": [["egotistical", "adj. 自我中心的，自私自利的"], ["grumble about", "phr. 抱怨，发牢骚"], ["be headed straight for", "phr. 径直走向，自讨（苦吃）"], ["measles", "n. 麻疹"], ["half-veiled reproach", "n. 半遮半掩的数落/责备"], ["litany", "n. 连篇累牍的抱怨，冗长枯燥的陈述"]], "translation": "世事就是如此。人性从来就是人性——而且在你的有生之年，它很可能（probably）不会改变（change）。那为什么不接受它呢？为什么不像老马可·奥勒留——罗马帝国有史以来最睿智的（wisest）统治者（ruled）之一——那样现实地（realistic）看待这件事呢？他有一天在日记里写道：“我今天将会遇到许多话太多的人——自私的人、唯我独尊的（egotistical）人、忘恩负义的人。但我不会感到惊讶或心烦意乱（disturbed），因为我无法想象一个没有这类人的世界。”这话很有道理（makes sense），不是吗？如果你我到处发牢骚（grumbling）抱怨别人忘恩负义，那该怪（blame）谁呢？怪人性——还是怪我们对人性的无知（ignorance）？让我们不要指望感恩（gratitude）。这样，如果我们偶尔（occasionally）得到一点感恩，那就会成为一份令人愉快的（delightful）意外惊喜；如果得不到，我们也不会心烦意乱。这就是我在本章想要阐明的第一个观点（point）：人们忘记感恩是天经地义的（natural）；因此，如果我们到处指望别人感恩，那简直就是径直走向（headed straight for）无数的伤心与苦恼（heartaches）。我在纽约认识一位女士，她总是抱怨自己很孤独。她的亲戚没有一个愿意靠近（near）她——这也难怪。如果你去看望她，她会一连几个小时向你念叨她的侄女们小时候她为她们做过多少事：她们出麻疹时是她悉心照料（nursed）的；她管吃管住养了她们好几年；她还出钱供其中一个读完了商学院（business school）。侄女们会来看她吗？会的，偶尔会来，但纯粹是出于道义。然而她们极为害怕（dread）这些探访。她们知道自己必须坐在那里一连几个小时听她指桑骂槐的数落，忍受一连串没完没了的（endless）苦涩抱怨与顾影自怜的叹息。"}, {"unit_id": "3.4", "unit_title": "单元 3.4：常识与助人为乐的纯粹喜悦——卡耐基父母对孤儿院的捐赠", "orig_questions": [16], "is_merged": false, "error_note": "⚠️【题库特殊录入勘误说明】本段第5空原著原文为：\"My own mother and father gave for the joy of helping others.\"（我自己的父母纯粹是为了助人为乐而付出）。但考试系统录入题干时误将 `gave` 打成了 `[空格] me`，且15个备选项中漏掉了 `gave`。在排除其余9个确定无疑的答案及前后题干扰项（gratitude / measly / natural）后，若按过去式动词语法匹配可选 I. headed（或 N. favor / K. into），建议答题时优先留意第5空。", "word_bank": [["A", "gratitude", "n.", "感激，感恩"], ["B", "neglect", "n./v.", "忽视，冷落"], ["C", "overwhelmed", "adj./v.", "被压垮的，债台高筑的"], ["D", "home", "n.", "家，收容院/孤儿院"], ["E", "without", "prep.", "没有，不带"], ["F", "horse", "n.", "马 (horse sense 普通常识)"], ["G", "as", "conj.", "尽管，虽然 (poor as we were)"], ["H", "richly", "adv.", "丰厚地，充分地"], ["I", "headed", "v.", "引导，前往 (题库第5空备选)"], ["J", "measly", "adj.", "微不足道的"], ["K", "into", "prep.", "进入"], ["L", "happiness", "n.", "幸福，快乐"], ["M", "natural", "adj.", "自然的"], ["N", "favor", "n./v.", "恩惠，偏爱 (题库第5空备选)"], ["O", "due", "n.", "应得的东西 (it's her due)"]], "orig_q_keys": [{"q_num": 16, "summary": "1-O (due) | 2-B (neglect) | 3-F (horse) | 4-L (happiness) | 5-I/N (原著为 gave，题库选 I. headed 或 N. favor) | 6-C (overwhelmed) | 7-G (as) | 8-D (home) | 9-H (richly) | 10-E (without)"}], "passage_parts": ["What this woman really wants is love and attention. But she calls it \"gratitude\". And she will never get gratitude or love, because she demands it. She thinks it's her ", {"b": 1}, ". There are thousands of women like her, women who are ill from \"ingratitude\", loneliness and ", {"b": 2}, ". They long to be loved. Does that sound like sheer, impractical, visionary idealism? It isn't. It is just ", {"b": 3}, " sense. It is a good way for you and me to find the ", {"b": 4}, " we long for. I know, I have seen it happen right in my own family. My own mother and father ", {"b": 5}, " me for the joy for helping others. We were poor — always ", {"b": 6}, " by debts. Yet, poor ", {"b": 7}, " we were, my father and mother always managed to send money every year to an orphans' home — the Christian Home in Council Bluffs, Iowa. Mother and Father never visited the ", {"b": 8}, ". Probably no one thanked them for their gifts — except by letter — but they were ", {"b": 9}, " repaid, for they had the joy of helping little children — ", {"b": 10}, " wishing for or expecting any gratitude in return."], "blanks": [{"num": 1, "word": "due", "opt": "O", "pos": "n.", "pos_type": "noun", "meaning": "应得的东西", "orig_ref": "原题16第1空 [O]", "explanation": "形容词性物主代词 her 后接名词，She thinks it's her due 意为“她认为这是她理所应当得到的”。"}, {"num": 2, "word": "neglect", "opt": "B", "pos": "n.", "pos_type": "noun", "meaning": "冷落，忽视", "orig_ref": "原题16第2空 [B]", "explanation": "与 ingratitude, loneliness 并列作介词 from 的宾语，填名词 neglect（被冷落）。"}, {"num": 3, "word": "horse", "opt": "F", "pos": "n.", "pos_type": "noun", "meaning": "常识 (horse sense)", "orig_ref": "原题16第3空 [F]", "explanation": "美式英语固定习语 horse sense 意为“普通常识、起码的道理（与 impractical idealism 相对）”。"}, {"num": 4, "word": "happiness", "opt": "L", "pos": "n.", "pos_type": "noun", "meaning": "幸福", "orig_ref": "原题16第4空 [L]", "explanation": "find the happiness we long for 意为“找到我们所渴望的幸福”。"}, {"num": 5, "word": "headed [原著: gave]", "opt": "I (或N)", "pos": "v.", "pos_type": "verb", "meaning": "引导/付出", "orig_ref": "原题16第5空 [I/N]", "explanation": "【题库录入勘误】卡耐基原著为 My own mother and father gave for the joy of helping others，考题误录为 ___ me，备选项中唯一过去式动词为 I. headed（或 N. favor）。"}, {"num": 6, "word": "overwhelmed", "opt": "C", "pos": "adj./v.", "pos_type": "verb", "meaning": "被压垮的", "orig_ref": "原题16第6空 [C]", "explanation": "always overwhelmed by debts 意为“总是被债务压得喘不过气来”。"}, {"num": 7, "word": "as", "opt": "G", "pos": "conj.", "pos_type": "prep", "meaning": "尽管，虽然", "orig_ref": "原题16第7空 [G]", "explanation": "形容词前置的让步状语从句倒装结构：poor as we were (= although we were poor)，意为“尽管我们如此贫穷”。"}, {"num": 8, "word": "home", "opt": "D", "pos": "n.", "pos_type": "noun", "meaning": "孤儿院", "orig_ref": "原题16第8空 [D]", "explanation": "指代前一句提到的 an orphans' home — the Christian Home，填 home。"}, {"num": 9, "word": "richly", "opt": "H", "pos": "adv.", "pos_type": "adv", "meaning": "丰厚地", "orig_ref": "原题16第9空 [H]", "explanation": "修饰过去分词 repaid，they were richly repaid 意为“他们得到了丰厚的回报（内心的喜悦）”。"}, {"num": 10, "word": "without", "opt": "E", "pos": "prep.", "pos_type": "prep", "meaning": "不带，没有", "orig_ref": "原题16第10空 [E]", "explanation": "without wishing for or expecting any gratitude in return 意为“从不希求或指望任何感恩作为回报”。"}], "vocab": [["one's due", "n. 某人应得之物/权利"], ["horse sense", "n. 普通常识，实事求是的判断力"], ["be overwhelmed by debts", "phr. 债台高筑，被债务压垮"], ["poor as we were", "phr. 尽管我们很穷（让步倒装）"], ["richly repaid", "phr. 得到丰厚的回报"]], "translation": "这位女士真正想要的是爱与关注，但她却称之为“感恩”。而她永远也得不到感恩或爱，因为她在强求。她觉得那是她理所应得的（due）。世上有成千上万像她这样的女性，因所谓的“忘恩负义”、孤独和冷落（neglect）而郁郁成疾。她们渴望被爱。这听起来像是纯粹不切实际的空想主义吗？并不是。这只是最基本的普通常识（horse sense），是你我找到所渴望的幸福（happiness）的好方法。我知道这一点，因为我在自己家里就亲眼见证过。我自己的父母纯粹是为了助人为乐的喜悦而付出（gave / headed）。我们家很穷——总是被债务压得喘不过气来（overwhelmed）。然而，尽管（as）我们如此贫穷，我的父母每年总能设法寄钱给一家孤儿院——爱荷华州康瑟尔布拉夫斯的基督教孤儿院。父母从未亲自去过那家孤儿院（home）。除了回信之外，大概也没有人当面感谢过他们的捐赠——但他们已经得到了丰厚的（richly）回报，因为他们拥有帮助年幼孩子的纯粹喜悦——而毫不（without）希求或指望任何感恩作为回报。"}, {"unit_id": "3.5", "unit_title": "单元 3.5：芝加哥继父的苦力付出与继子及母亲的“理所当然”", "orig_questions": [27], "is_merged": false, "error_note": null, "word_bank": [["A", "coolie", "n.", "苦力"], ["B", "granted", "adj.", "理所当然 (take ... for granted)"], ["C", "through", "prep.", "读完，完成 (through college)"], ["D", "least", "adj./n.", "最少，起码 (the least he can do)"], ["E", "earning", "v.", "挣得，赚取"], ["F", "Imagined", "v.", "想象"], ["G", "blame", "v.", "责备 (be to blame)"], ["H", "persuaded", "v.", "说服"], ["I", "burden", "v.", "使负重担"], ["J", "salary", "n.", "薪水，工资"], ["K", "though", "conj.", "虽然"], ["L", "convinced", "v./adj.", "确信"], ["M", "demanded", "v.", "要求"], ["N", "shoulder", "v./n.", "肩负"], ["O", "best", "adj./n.", "最好"]], "orig_q_keys": [{"q_num": 27, "summary": "1-E (earning) | 2-H (persuaded) | 3-J (salary) | 4-A (coolie) | 5-B (granted) | 6-F (Imagined) | 7-G (blame) | 8-I (burden) | 9-C (through) | 10-D (least)"}], "passage_parts": ["I know a man in Chicago who has cause to complain of the ingratitude of his stepsons. He slaved in a box factory, seldom ", {"b": 1}, " more than forty dollars a week. He married a widow, and she ", {"b": 2}, " him to borrow money and send her two grown sons to college. Out of his ", {"b": 3}, " of forty dollars a week, he had to pay for food, rent, fuel, clothes, and also for the payments on his notes. He did this for four years, working like a ", {"b": 4}, ", and never complaining. Did he get any thanks? No, his wife took it all for ", {"b": 5}, " — and so did her sons. They never ", {"b": 6}, " that they owed their stepfather anything — not even thanks! Who was to ", {"b": 7}, "? The boys? Yes; but the mother was even more to blame. She thought it was a shame to ", {"b": 8}, " their young lives with \"a sense of obligation\". She didn't want her sons to \"start out under debt\". So she never dreamed of saying: \"What a prince your stepfather is to help you ", {"b": 9}, " college!\" Instead, she took the attitude: \"Oh, that's the ", {"b": 10}, " he can do.\""], "blanks": [{"num": 1, "word": "earning", "opt": "E", "pos": "v.", "pos_type": "verb", "meaning": "挣得，赚取", "orig_ref": "原题27第1空 [E]", "explanation": "现在分词作伴随状语，seldom earning more than forty dollars a week 意为“每周很少能挣到四十美元以上”。"}, {"num": 2, "word": "persuaded", "opt": "H", "pos": "v.", "pos_type": "verb", "meaning": "说服", "orig_ref": "原题27第2空 [H]", "explanation": "persuade sb. to do sth. 意为“她说服他借钱送她的两个成年儿子去上大学”。"}, {"num": 3, "word": "salary", "opt": "J", "pos": "n.", "pos_type": "noun", "meaning": "薪水", "orig_ref": "原题27第3空 [J]", "explanation": "Out of his salary of forty dollars a week 意为“从他每周四十美元的微薄薪水里”。"}, {"num": 4, "word": "coolie", "opt": "A", "pos": "n.", "pos_type": "noun", "meaning": "苦力", "orig_ref": "原题27第4空 [A]", "explanation": "working like a coolie 意为“像苦力一样拼命干活”，与首句 slaved in a box factory 呼应。"}, {"num": 5, "word": "granted", "opt": "B", "pos": "adj.", "pos_type": "adj", "meaning": "理所当然 (take for granted)", "orig_ref": "原题27第5空 [B]", "explanation": "固定短语 take it all for granted 意为“把这一切都视为理所当然”。"}, {"num": 6, "word": "Imagined", "opt": "F", "pos": "v.", "pos_type": "verb", "meaning": "想象，想到", "orig_ref": "原题27第6空 [F]", "explanation": "They never imagined that... 意为“他们从来没想过自己欠继父什么”。"}, {"num": 7, "word": "blame", "opt": "G", "pos": "v.", "pos_type": "verb", "meaning": "责备 (be to blame)", "orig_ref": "原题27第7空 [G]", "explanation": "Who was to blame? 意为“这该怪谁呢？”，后句 even more to blame 原词复现。"}, {"num": 8, "word": "burden", "opt": "I", "pos": "v.", "pos_type": "verb", "meaning": "使负重担", "orig_ref": "原题27第8空 [I]", "explanation": "固定搭配 burden sb./sth. with... 意为“让‘亏欠感’成为他们年轻生命的负担”。"}, {"num": 9, "word": "through", "opt": "C", "pos": "prep.", "pos_type": "prep", "meaning": "读完 (through college)", "orig_ref": "原题27第9空 [C]", "explanation": "help you through college 意为“供你们读完大学”。"}, {"num": 10, "word": "least", "opt": "D", "pos": "adj./n.", "pos_type": "adj", "meaning": "最起码的", "orig_ref": "原题27第10空 [D]", "explanation": "固定口语表达 that's the least he can do 意为“那不过是他最起码该做的事”。"}], "vocab": [["slave", "v. 像奴隶一样苦干"], ["notes", "n. 借据，期票"], ["coolie", "n. 苦力"], ["take ... for granted", "phr. 认为……理所当然"], ["burden ... with", "phr. 使背负……的负担"], ["help sb. through college", "phr. 资助某人读完大学"]], "translation": "我在芝加哥认识一个人，他完全有理由抱怨继子们的忘恩负义。他在一家纸箱厂做苦工，每周很少能挣到（earning）四十美元以上。他娶了一个寡妇，妻子说服（persuaded）他借钱送她的两个已经成年的儿子去上大学。从他每周四十美元的微薄薪水（salary）中，他不仅要支付伙食、房租、燃料和衣服的开销，还要偿还借据上的欠款。他这样熬了整整四年，像个苦力（coolie）一样干活，却从无半句怨言。他得到过任何感谢吗？没有，他的妻子把这一切都视为理所当然（took it all for granted）——她的儿子们也是如此。他们从来没想过（imagined）自己欠继父任何东西——哪怕是一句谢谢！这该怪（blame）谁呢？怪那两个儿子吗？是的；但做母亲的更应该受到责备。她觉得让“亏欠感”成为儿子们年轻生命的负担（burden）是一件可耻的事。她不想让儿子们“背着人情债步入社会”。因此，她做梦也不会对儿子说：“你们的继父供你们读完（through）大学，真是天大的恩人啊！”相反，她采取的态度是：“哦，那不过是他最起码（least）该做的事。”"}, {"unit_id": "3.6", "unit_title": "单元 3.6：李尔王之叹、野草与玫瑰——感恩需要从小培养", "orig_questions": [3], "is_merged": false, "error_note": null, "word_bank": [["A", "stop", "v.", "停止"], ["B", "make", "v.", "提出，阐明 (make a point)"], ["C", "thankless", "adj.", "不知感恩的，忘恩负义的"], ["D", "train", "v.", "训练，培养"], ["E", "tearing", "v.", "撕扯 (tear one's hair 苦恼抓狂)"], ["F", "natural", "adj.", "自然的，天生的"], ["G", "thankful", "adj.", "感谢的，感恩的"], ["H", "express", "v.", "表达"], ["I", "brain", "n.", "大脑"], ["J", "cultivated", "v.", "培育，栽培"], ["K", "blame", "v.", "责备 (be to blame)"], ["L", "criticize", "v.", "批评"], ["M", "what", "pron.", "……的样子 (what we make them)"], ["N", "that", "conj.", "那"], ["O", "gratitude", "n.", "感恩"]], "orig_q_keys": [{"q_num": 3, "summary": "1-B (make) | 2-A (stop) | 3-E (tearing) | 4-C (thankless) | 5-D (train) | 6-F (natural) | 7-J (cultivated) | 8-K (blame) | 9-H (express) | 10-M (what)"}], "passage_parts": ["Here is the second point I am trying to ", {"b": 1}, " in this chapter: If we want to find happiness, let's ", {"b": 2}, " thinking about gratitude or ingratitude and give for the inner joy of giving. Parents have been ", {"b": 3}, " their hair about the ingratitude of children for ten thousand years. Even Shakespeare's King Lear cried out: \"How sharper than a serpent's tooth it is to have a ", {"b": 4}, " child!\" But why should children be thankful — unless we ", {"b": 5}, " them to be? Ingratitude is ", {"b": 6}, " — like weeds. Gratitude is like a rose. It has to be fed and watered and ", {"b": 7}, " and loved and protected. If our children are ungrateful, who is to ", {"b": 8}, "? Maybe we are. If we have never taught them to ", {"b": 9}, " gratitude to others, how can we expect them to be grateful to us? We must remember that our children are very much ", {"b": 10}, " we make them. So let us remember that to raise grateful children, we have to be grateful."], "blanks": [{"num": 1, "word": "make", "opt": "B", "pos": "v.", "pos_type": "verb", "meaning": "提出，阐述", "orig_ref": "原题3第1空 [B]", "explanation": "固定搭配 make a point 意为“阐述一个观点”。"}, {"num": 2, "word": "stop", "opt": "A", "pos": "v.", "pos_type": "verb", "meaning": "停止", "orig_ref": "原题3第2空 [A]", "explanation": "let's stop thinking about gratitude or ingratitude 意为“让我们停止去想别人感不感恩”。"}, {"num": 3, "word": "tearing", "opt": "E", "pos": "v.", "pos_type": "verb", "meaning": "扯头发 (tear one's hair)", "orig_ref": "原题3第3空 [E]", "explanation": "固定习语 tear one's hair (about sth.) 意为“因某事苦恼得抓耳挠腮/扯头发”，have been tearing 构成现在完成进行时。"}, {"num": 4, "word": "thankless", "opt": "C", "pos": "adj.", "pos_type": "adj", "meaning": "忘恩负义的，不知感恩的", "orig_ref": "原题3第4空 [C]", "explanation": "莎士比亚《李尔王》名句：How sharper than a serpent's tooth it is to have a thankless child!（养一个不知感恩的逆子，比毒蛇的利齿还要伤人！）"}, {"num": 5, "word": "train", "opt": "D", "pos": "v.", "pos_type": "verb", "meaning": "训练，培养", "orig_ref": "原题3第5空 [D]", "explanation": "unless we train them to be 意为“除非我们训练/培养他们学会感恩”。"}, {"num": 6, "word": "natural", "opt": "F", "pos": "adj.", "pos_type": "adj", "meaning": "天生的，自然的", "orig_ref": "原题3第6空 [F]", "explanation": "Ingratitude is natural — like weeds 意为“忘恩负义是天生的——就像野草一样自然生长”。"}, {"num": 7, "word": "cultivated", "opt": "J", "pos": "v.", "pos_type": "verb", "meaning": "培育，栽培", "orig_ref": "原题3第7空 [J]", "explanation": "与 fed, watered, loved, protected 并列用过去分词，把感恩比作玫瑰，必须“施肥、浇水、精心培育（cultivated）”。"}, {"num": 8, "word": "blame", "opt": "K", "pos": "v.", "pos_type": "verb", "meaning": "责备 (be to blame)", "orig_ref": "原题3第8空 [K]", "explanation": "固定句型 who is to blame? 意为“这该怪谁呢？”。"}, {"num": 9, "word": "express", "opt": "H", "pos": "v.", "pos_type": "verb", "meaning": "表达", "orig_ref": "原题3第9空 [H]", "explanation": "express gratitude to others 意为“向他人表达感谢”。"}, {"num": 10, "word": "what", "opt": "M", "pos": "pron.", "pos_type": "noun", "meaning": "……的样子", "orig_ref": "原题3第10空 [M]", "explanation": "what 引导表语从句并在从句中作宾语补足语，our children are very much what we make them 意为“孩子很大程度上就是我们塑造出来的样子”。"}], "vocab": [["tear one's hair", "phr. 苦恼万分，抓狂"], ["serpent", "n. 毒蛇"], ["thankless", "adj. 忘恩负义的，吃力不讨好的"], ["cultivate", "v. 培育，栽培，培养"]], "translation": "这就是我在本章想要阐明的（make）第二个观点：如果我们想要获得幸福，就让我们停止（stop）去计较感恩或忘恩负义，纯粹为了给予本身所带来的内心喜悦而给予吧。一万年来，父母们一直在为孩子的忘恩负义而抓狂苦恼（tearing their hair）。就连莎士比亚笔下的李尔王也痛呼道：“养一个不知感恩的（thankless）孩子，比毒蛇的利齿还要伤人啊！”可是，除非我们从小培养（train）孩子学会感恩，否则他们怎么会懂得感恩呢？忘恩负义是天生的（natural）——就像野草；而感恩则像一朵玫瑰，必须施肥、浇水、精心培育（cultivated）、疼爱并呵护。如果我们的孩子不懂感恩，那该怪（blame）谁呢？也许该怪我们自己。如果我们从未教过他们向他人表达（express）感激之情，又怎么能指望他们对我们感恩呢？我们必须记住，孩子在很大程度上就是我们把他们塑造出来的样子（what we make them）。所以让我们记住，要想养育出懂得感恩的孩子，我们自己首先要懂得感恩。"}]}, {"id": "theme4", "title": "专题四：《史蒂夫·乔布斯传》深度书评与领导力评述", "subtitle": "Review of Walter Isaacson's Biography Steve Jobs（共11道原题：第4、6、12、19、21、22、26、29、31、32、33题 → 合并精简为8个连贯单元）", "color": "#7C2D12", "badge_bg": "#FDF2ED", "orig_q_list": [33, 6, 31, 22, 26, 12, 4, 32, 29, 21, 19], "units": [{"unit_id": "4.1", "unit_title": "单元 4.1：乔布斯的科技传奇、尖锐批评与基督教期刊的领导力审视（合并原题 33 & 原题 6 & 原题 31）", "orig_questions": [33, 6, 31], "is_merged": true, "error_note": "本单元将连续递进且高度重叠的【原题33】、【原题6】与【原题31】合并为完整开篇（共21处考点，完整覆盖三题全部30个设空点），下方同时提供三道原题各自的独立答案字母速查。", "word_bank": [["原题33-C", "complicated", "adj.", "复杂的"], ["原题6-A", "talked-about", "adj.", "备受谈论的，热门的"], ["原题33-J / 6-G", "ultimately", "adv.", "最终"], ["原题33-D / 6-J", "commanding", "adj.", "居高临下的，统领性的"], ["原题6-B", "assembled", "v.", "召集，组建"], ["原题33-I / 6-C", "admired", "adj.", "受人钦佩的，令人赞叹的"], ["原题33-E", "being", "n.", "存在 (come into being 诞生)"], ["原题33-H", "critics", "n.", "批评者"], ["原题31-D", "mistreated", "v.", "虐待，苛待"], ["原题33-F", "dealings", "n.", "交易，往来 (business dealings)"], ["原题31-C", "vindictive", "adj.", "怀恨在心的，报复心强的"], ["原题33-A", "lacked", "v.", "缺乏"], ["原题6-M", "compassion", "n.", "同情心，怜悯"], ["原题31-E", "stuff", "n.", "东西，事情 (the light stuff)"], ["原题6-I", "imagine", "v.", "想象"], ["原题33-G", "fantasy", "n.", "幻想，空想"], ["原题33-B / 6-E / 31-H", "trigger", "n.", "触发器，诱因，契机"], ["原题31-G", "professing", "adj.", "公开表白信仰的 (professing Christian)"], ["原题6-O / 31-I", "doctrinal", "adj.", "教义上的，教条的"], ["原题31-L", "journal", "n.", "期刊，杂志"], ["原题31-O", "yields", "v.", "产生，提供"], ["原题6-L / 31-N", "hig 一番冷静思考的契机。我们都知道史蒂夫·乔布斯并非一名公开信教的（professing）基督徒。虽然他尊敬耶稣，但他早年就远离了基督教——至少是远离了其组织化和教义化（doctrinal）的形式。那么，为什么要在一本基督教期刊（journal）上写他呢？答案是：因为他的一生在领导力这一课题上提供了（yields）正反两方面的宝贵启示；同时也突显了（highlights）基督教领袖可以借以触动像他这样的人灵魂的切入点。这部乔布斯传记让我意识到，有多少领导者是由他们最早年的生活经历所塑造（shaped）的。"}, {"unit_id": "4.2", "unit_title": "单元 4.2：养父保罗·乔布斯的工匠精神——把篱笆背面也刷得完美无瑕", "orig_questions": [22], "is_merged": false, "error_note": null, "word_bank": [["A", "outer", "adj.", "外部的，外表的"], ["B", "man", "n.", "男人"], ["C", "go", "v.", "去"], ["D", "outside", "n./adj.", "外部"], ["E", "ethic", "n.", "职业道德 (work ethic)"], ["F", "invisible", "adj.", "看不见的"], ["G", "veteran", "n.", "退伍军人，老兵"], ["H", "marked", "v.", "以……为特征，打上烙印 (be marked with)"], ["I", "planted", "v.", "植下，灌输"], ["J", "exceptional", "adj.", "卓越的，非凡的"], ["K", "hang", "v.", "闲逛，待在一起 (hang out with)"], ["L", "visible", "adj.", "看得见的，外露的"], ["M", "bearing", "v.", "带有，冠以 (bearing the Apple name)"], ["N", "shape", "v.", "塑造，影响"], ["O", "Promote", "v.", "促进，推广"]], "orig_q_keys": [{"q_num": 22, "summary": "1-G (veteran) | 2-J (exceptional) | 3-K (hang) | 4-I (planted) | 5-E (ethic) | 6-H (marked) | 7-L (visible) | 8-N (shape) | 9-M (bearing) | 10-A (outer)"}], "passage_parts": ["Paul Jobs, Steve's adoptive father, was a Coast Guard ", {"b": 1}, ", a man of ", {"b": 2}, " mechanical and carpentry skill. When Steve was old enough, father and son began to tinker with cars, build furniture, and repair things about the house. \"I wasn't into fixing cars,\" Steve Jobs said years later, \"but I was eager to ", {"b": 3}, " out with my dad.\" In their time together, the father ", {"b": 4}, " a powerful work ", {"b": 5}, " in his son. All work, Steve Jobs learned, was to be ", {"b": 6}, " with excellence. When father and son painted a fence together, for example, the boy learned that the unexposed side was to be treated with the same thoroughness as the ", {"b": 7}, " side. \"(My father) loved doing things right,\" Jobs reflected. \"He even cared about the look of the parts you couldn't see.\" Decades later this principle learned in boyhood would ", {"b": 8}, " the development of Apple devices. Jobs always insisted that the inner parts of anything ", {"b": 9}, " the Apple name be as perfectly designed and built as the ", {"b": 10}, " parts, even though a customer would never see them."], "blanks": [{"num": 1, "word": "veteran", "opt": "G", "pos": "n.", "pos_type": "noun", "meaning": "退伍军人", "orig_ref": "原题22第1空 [G]", "explanation": "a Coast Guard veteran 意为“一名海岸警卫队退伍军人”。"}, {"num": 2, "word": "exceptional", "opt": "J", "pos": "adj.", "pos_type": "adj", "meaning": "卓越的，高超的", "orig_ref": "原题22第2空 [J]", "explanation": "a man of exceptional mechanical and carpentry skill 意为“一个拥有高超机械和木工手艺的人”。"}, {"num": 3, "word": "hang", "opt": "K", "pos": "v.", "pos_type": "verb", "meaning": "相伴，待在一起 (hang out with)", "orig_ref": "原题22第3空 [K]", "explanation": "固定短语 hang out with my dad 意为“渴望和爸爸待在一起”。"}, {"num": 4, "word": "planted", "opt": "I", "pos": "v.", "pos_type": "verb", "meaning": "植下，根植", "orig_ref": "原题22第4空 [I]", "explanation": "planted a powerful work ethic in his son 意为“在儿子心中植下了强大的敬业精神”。"}, {"num": 5, "word": "ethic", "opt": "E", "pos": "n.", "pos_type": "noun", "meaning": "职业道德 (work ethic)", "orig_ref": "原题22第5空 [E]", "explanation": "固定搭配 work ethic 意为“职业道德、敬业精神”。"}, {"num": 6, "word": "marked", "opt": "H", "pos": "v.", "pos_type": "verb", "meaning": "以……为特征 (be marked with)", "orig_ref": "原题22第6空 [H]", "explanation": "be marked with excellence 意为“所有工作都必须以卓越为标准/打上卓越的烙印”。"}, {"num": 7, "word": "visible", "opt": "L", "pos": "adj.", "pos_type": "adj", "meaning": "看得见的，外露的", "orig_ref": "原题22第7空 [L]", "explanation": "与前文 the unexposed side（不外露的背面）形成反义对比，填 visible（看得见的正面）。"}, {"num": 8, "word": "shape", "opt": "N", "pos": "v.", "pos_type": "verb", "meaning": "塑造，影响", "orig_ref": "原题22第8空 [N]", "explanation": "情态动词 would 后接动词原形，shape the development of Apple devices 意为“塑造/影响了苹果设备的研发理念”。"}, {"num": 9, "word": "bearing", "opt": "M", "pos": "v.", "pos_t
