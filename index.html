<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>思齐 | 个人主页</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --primary:#6366f1;--primary2:#8b5cf6;--accent:#06b6d4;
  --bg:#f8fafc;--card:#fff;--text:#1e293b;--text2:#64748b;--text3:#94a3b8;
  --border:#e2e8f0;--radius:16px;--shadow:0 4px 24px rgba(0,0,0,.06);
  --shadow-hover:0 12px 40px rgba(99,102,241,.15);
}
html{scroll-behavior:smooth}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text);line-height:1.6}

/* Hero */
.hero{
  background:linear-gradient(135deg,#1e1b4b 0%,#312e81 40%,#4338ca 70%,#6366f1 100%);
  color:#fff;padding:80px 24px 120px;text-align:center;position:relative;overflow:hidden;
}
.hero::before{
  content:"";position:absolute;inset:0;
  background:radial-gradient(circle at 20% 50%,rgba(139,92,246,.3) 0%,transparent 50%),
             radial-gradient(circle at 80% 20%,rgba(6,182,212,.25) 0%,transparent 50%);
}
.hero::after{
  content:"";position:absolute;bottom:-2px;left:0;right:0;height:60px;
  background:var(--bg);
  clip-path:ellipse(55% 100% at 50% 100%);
}
.hero-inner{position:relative;z-index:1}
.hero h1{font-size:3rem;font-weight:800;letter-spacing:.3em;margin-bottom:8px;
  background:linear-gradient(90deg,#fff,#c7d2fe,#fff);-webkit-background-clip:text;-webkit-text-fill-color:transparent;
  animation:fadeUp .8s ease}
.hero .subtitle{font-size:1.1rem;opacity:.85;margin-bottom:20px;animation:fadeUp .8s ease .1s both}
.hero .domain{display:inline-block;padding:6px 20px;background:rgba(255,255,255,.15);border-radius:99px;
  font-size:.9rem;backdrop-filter:blur(10px);animation:fadeUp .8s ease .2s both}
.admin-link{position:absolute;top:20px;right:24px;z-index:10;color:rgba(255,255,255,.7);font-size:.85rem;
  text-decoration:none;transition:all .2s}
.admin-link:hover{color:#fff;transform:translateY(-1px)}

/* Nav */
.nav{
  position:sticky;top:0;z-index:100;background:rgba(255,255,255,.85);backdrop-filter:blur(20px);
  border-bottom:1px solid var(--border);padding:0 24px;display:flex;gap:4px;overflow-x:auto;
}
.nav button{
  padding:16px 20px;border:none;background:transparent;color:var(--text2);font-size:.9rem;cursor:pointer;
  white-space:nowrap;border-bottom:2px solid transparent;transition:all .2s;font-family:inherit;
}
.nav button:hover{color:var(--primary)}
.nav button.active{color:var(--primary);border-bottom-color:var(--primary);font-weight:600}

/* Main */
.main{max-width:1100px;margin:0 auto;padding:32px 24px 80px}
.section{display:none;animation:fadeIn .4s ease}
.section.active{display:block}
.section-header{margin-bottom:24px}
.section-header h2{font-size:1.5rem;font-weight:700;margin-bottom:4px}
.section-header p{color:var(--text2);font-size:.9rem}

/* Cards Grid */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:20px}
.link-card{
  background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:24px;
  text-decoration:none;color:var(--text);transition:all .3s cubic-bezier(.4,0,.2,1);
  display:block;position:relative;overflow:hidden;
}
.link-card::before{
  content:"";position:absolute;top:0;left:0;right:0;height:3px;
  background:linear-gradient(90deg,var(--primary),var(--primary2),var(--accent));
  transform:scaleX(0);transition:transform .3s ease;
}
.link-card:hover{transform:translateY(-4px);box-shadow:var(--shadow-hover);border-color:var(--primary)}
.link-card:hover::before{transform:scaleX(1)}
.card-icon{font-size:2rem;margin-bottom:12px}
.card-title{font-weight:600;font-size:1.05rem;margin-bottom:4px}
.card-desc{font-size:.85rem;color:var(--text2)}
.file-badge{display:inline-block;margin-top:10px;padding:3px 10px;background:#eef2ff;color:var(--primary);
  border-radius:99px;font-size:.75rem}

/* List */
.list{display:flex;flex-direction:column;gap:12px}
.list-item{
  background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:16px 20px;
  display:flex;justify-content:space-between;align-items:center;transition:all .2s;
}
.list-item:hover{border-color:var(--primary);box-shadow:var(--shadow)}
.item-title{font-weight:600;margin-bottom:2px}
.item-meta{font-size:.82rem;color:var(--text2)}
.item-tag{padding:4px 12px;border-radius:99px;font-size:.75rem;font-weight:500}
.tag-red{background:#fef2f2;color:#dc2626}
.tag-orange{background:#fff7ed;color:#ea580c}
.tag-blue{background:#eff6ff;color:#2563eb}
.tag-green{background:#f0fdf4;color:#16a34a}
.tag-purple{background:#faf5ff;color:#9333ea}

/* Ledger */
.ledger-stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:16px;margin-bottom:24px}
.stat-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;text-align:center}
.stat-card .num{font-size:1.5rem;font-weight:700}
.stat-card .label{font-size:.8rem;color:var(--text2)}
.stat-income .num{color:#16a34a}
.stat-expense .num{color:#dc2626}
.ledger-form{display:flex;gap:10px;margin-bottom:20px;flex-wrap:wrap}
.ledger-form input,.ledger-form select{padding:10px 14px;border:1px solid var(--border);border-radius:8px;font-size:.9rem}
.ledger-form input:first-child{flex:2;min-width:150px}
.btn{padding:10px 20px;border:none;border-radius:8px;background:var(--primary);color:#fff;font-size:.9rem;cursor:pointer;transition:all .2s}
.btn:hover{background:#4f46e5;transform:translateY(-1px)}

/* Diary */
.diary-item{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:12px}
.diary-date{font-size:.8rem;color:var(--text3);margin-bottom:8px}
.diary-content{white-space:pre-wrap;font-size:.95rem}

/* Empty */
.empty{text-align:center;padding:60px 20px;color:var(--text3)}
.empty .icon{font-size:3rem;margin-bottom:12px;opacity:.5}

/* Footer */
.footer{text-align:center;padding:40px 20px;color:var(--text3);font-size:.85rem;border-top:1px solid var(--border);margin-top:40px}

/* Animations */
@keyframes fadeUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}

/* Responsive */
@media(max-width:640px){
  .hero{padding:60px 16px 100px}
  .hero h1{font-size:2rem}
  .main{padding:20px 16px 60px}
  .grid{grid-template-columns:1fr}
  .nav{padding:0 12px}
  .nav button{padding:14px 14px;font-size:.82rem}
}
</style>
</head>
<body>

<div class="hero">
  <a href="admin.html" class="admin-link">管理后台 →</a>
  <div class="hero-inner">
    <h1>思 齐</h1>
    <p class="subtitle">个人主页 · 学习资源 · 生活记录</p>
    <span class="domain">benyia.com</span>
  </div>
</div>

<nav class="nav" id="nav">
  <button class="active" data-t="courses">我的课程</button>
  <button data-t="papers">论文</button>
  <button data-t="notices">学校通知</button>
  <button data-t="class">班级事务</button>
  <button data-t="life">生活服务</button>
  <button data-t="softwares">软件下载</button>
  <button data-t="ledger">生活记账</button>
  <button data-t="diary">日记</button>
  <button data-t="advisor">导师指导</button>
</nav>

<main class="main">
  <div class="section active" id="sec-courses">
    <div class="section-header"><h2>我的课程</h2><p>本学期课程资料与学习资源</p></div>
    <div class="grid" id="coursesList"></div>
  </div>

  <div class="section" id="sec-papers">
    <div class="section-header"><h2>论文</h2><p>研究方向与学术成果</p></div>
    <div class="list" id="papersList"></div>
  </div>

  <div class="section" id="sec-notices">
    <div class="section-header"><h2>学校重要通知</h2><p>最新教务与学院通知</p></div>
    <div class="list" id="noticesList"></div>
  </div>

  <div class="section" id="sec-class">
    <div class="section-header"><h2>班级事务</h2><p>班级通知与活动安排</p></div>
    <div class="list" id="classList"></div>
  </div>

  <div class="section" id="sec-life">
    <div class="section-header"><h2>生活服务</h2><p>常用生活服务快捷入口</p></div>
    <div class="grid" id="lifeList"></div>
  </div>

  <div class="section" id="sec-softwares">
    <div class="section-header"><h2>软件下载</h2><p>常用软件与工具下载</p></div>
    <div class="grid" id="softList"></div>
  </div>

  <div class="section" id="sec-ledger">
    <div class="section-header"><h2>生活记账</h2><p>日常收支记录</p></div>
    <div class="ledger-stats">
      <div class="stat-card stat-income"><div class="num" id="statInc">¥0.00</div><div class="label">本月收入</div></div>
      <div class="stat-card stat-expense"><div class="num" id="statExp">¥0.00</div><div class="label">本月支出</div></div>
      <div class="stat-card"><div class="num" id="statBal">¥0.00</div><div class="label">本月结余</div></div>
    </div>
    <div class="ledger-form">
      <select id="lgType"><option value="expense">支出</option><option value="income">收入</option></select>
      <input type="number" id="lgAmt" placeholder="金额（元）" step="0.01">
      <input type="text" id="lgDesc" placeholder="备注">
      <button class="btn" onclick="addLedger()">记一笔</button>
    </div>
    <div class="list" id="ledgerList"></div>
  </div>

  <div class="section" id="sec-diary">
    <div class="section-header"><h2>日记</h2><p>生活点滴记录</p></div>
    <div class="ledger-form">
      <input type="date" id="diaryDate" style="flex:1">
      <button class="btn" onclick="openDiary()">写日记</button>
    </div>
    <div id="diaryList"></div>
  </div>

  <div class="section" id="sec-advisor">
    <div class="section-header"><h2>导师指导记录</h2><p>与导师沟通与指导记录</p></div>
    <div class="ledger-form">
      <input type="date" id="advDate" style="flex:1">
      <button class="btn" onclick="openAdvisor()">新增记录</button>
    </div>
    <div id="advisorList"></div>
  </div>
</main>

<div class="footer">© 2026 思齐 · benyia.com · Powered by GitHub Pages</div>

<script>
const GH_OWNER = "benyia";
const GH_REPO = "benyia.github.io";

const DEFAULT_DATA = {
  courses: [
    {icon:"📐", title:"自动控制原理", desc:"教材、PPT、课后习题答案", link:"#", file:"", fileName:""},
    {icon:"🧠", title:"神经网络与深度学习", desc:"课件、上机指导、参考书", link:"#", file:"", fileName:""},
    {icon:"💻", title:"计算机控制系统", desc:"教材、章节PPT、习题解答", link:"#", file:"", fileName:""},
    {icon:"⚙️", title:"现代控制理论", desc:"状态空间分析、最优控制", link:"#", file:"", fileName:""}
  ],
  papers: [
    {title:"基于深度学习的故障诊断方法研究", status:"在投", year:"2026", desc:"", file:"", fileName:""},
    {title:"自适应控制算法综述", status:"阅读中", year:"", desc:"参考文献", file:"", fileName:""}
  ],
  notices: [
    {title:"2026年秋季学期选课通知", source:"研究生院", date:"2026-09-01", level:"red"},
    {title:"研究生奖学金评定工作安排", source:"学院", date:"2026-09-10", level:"orange"},
    {title:"图书馆数据库访问方式变更通知", source:"图书馆", date:"2026-09-05", level:"blue"}
  ],
  classItems: [
    {title:"组会时间调整为每周四下午2点", type:"通知", date:"2026-09-15", file:"", fileName:""},
    {title:"班级聚餐（时间待定）", type:"活动", date:"", file:"", fileName:""}
  ],
  lifeServices: [
    {icon:"🛒", title:"淘宝", desc:"购物", url:"https://www.taobao.com", file:"", fileName:""},
    {icon:"🚄", title:"12306", desc:"火车票预订", url:"https://www.12306.cn", file:"", fileName:""},
    {icon:"🍜", title:"饿了么", desc:"外卖订餐", url:"https://www.ele.me", file:"", fileName:""},
    {icon:"🗺️", title:"百度地图", desc:"导航出行", url:"https://map.baidu.com", file:"", fileName:""},
    {icon:"💡", title:"知乎", desc:"知识问答", url:"https://www.zhihu.com", file:"", fileName:""},
    {icon:"🐙", title:"GitHub", desc:"代码托管", url:"https://github.com", file:"", fileName:""},
    {icon:"☁️", title:"百度网盘", desc:"云存储 / 文件分享", url:"https://pan.baidu.com", file:"", fileName:""},
    {icon:"🅰️", title:"阿里云盘", desc:"不限速云盘", url:"https://www.alipan.com", file:"", fileName:""},
    {icon:"✨", title:"夸克网盘", desc:"夸克云存储", url:"https://pan.quark.cn", file:"", fileName:""},
    {icon:"📁", title:"123云盘", desc:"不限速云盘", url:"https://www.123pan.com", file:"", fileName:""},
    {icon:"🟦", title:"腾讯微云", desc:"腾讯云存储", url:"https://www.weiyun.com", file:"", fileName:""},
    {icon:"📧", title:"网易邮箱", desc:"邮件服务", url:"https://mail.163.com", file:"", fileName:""}
  ],
  softwares: [
    {icon:"🐍", title:"Python", desc:"多版本下载", url:"https://www.python.org/downloads/"},
    {icon:"📝", title:"VS Code", desc:"代码编辑器", url:"https://code.visualstudio.com/"},
    {icon:"📊", title:"Anaconda", desc:"Python 数据科学发行版", url:"https://www.anaconda.com/download"},
    {icon:"🔢", title:"MATLAB", desc:"数学计算与仿真", url:"https://www.mathworks.com/products/matlab.html"},
    {icon:"🔧", title:"Vivado", desc:"FPGA 开发工具", url:"https://www.xilinx.com/products/design-tools/vivado.html"},
    {icon:"📦", title:"Git", desc:"版本控制工具", url:"https://git-scm.com/downloads"}
  ],
  ledger: [],
  diary: [],
  advisor: []
};

let blogData = null;

function esc(s){ return String(s||"").replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }

async function loadData(){
  try {
    const res = await fetch("data.json?v=" + Date.now());
    if(res.ok){
      blogData = await res.json();
      // 确保所有字段都存在
      for(const k in DEFAULT_DATA){
        if(!blogData[k]) blogData[k] = DEFAULT_DATA[k];
      }
    } else {
      blogData = JSON.parse(JSON.stringify(DEFAULT_DATA));
    }
  } catch(e) {
    blogData = JSON.parse(JSON.stringify(DEFAULT_DATA));
  }
  renderAll();
}

function renderAll(){
  // 课程
  document.getElementById("coursesList").innerHTML = blogData.courses.map(c=>`
    <a class="link-card" href="${c.link||"#"}" target="_blank">
      <div class="card-icon">${c.icon||"📄"}</div>
      <div class="card-title">${esc(c.title)}</div>
      <div class="card-desc">${esc(c.desc)}</div>
      ${c.file ? `<span class="file-badge">📎 ${esc(c.fileName||"下载文件")}</span>` : ""}
    </a>`).join("") || '<div class="empty"><div class="icon">📚</div>暂无课程</div>';

  // 论文
  document.getElementById("papersList").innerHTML = blogData.papers.map(p=>`
    <div class="list-item">
      <div>
        <div class="item-title">${esc(p.title)}</div>
        <div class="item-meta">${esc(p.desc||"")} ${p.year?("· "+p.year):""}</div>
        ${p.file ? `<a href="${p.file}" target="_blank" class="file-badge" style="text-decoration:none">📎 ${esc(p.fileName||"下载PDF")}</a>` : ""}
      </div>
      <span class="item-tag tag-${p.status==="已发表"?"green":p.status==="在投"?"orange":"blue"}">${esc(p.status)}</span>
    </div>`).join("") || '<div class="empty"><div class="icon">📝</div>暂无论文</div>';

  // 通知
  const tagMap = {red:"重要", orange:"关注", blue:"一般"};
  document.getElementById("noticesList").innerHTML = blogData.notices.map(n=>`
    <div class="list-item">
      <div>
        <div class="item-title">${esc(n.title)}</div>
        <div class="item-meta">${esc(n.source)} · ${esc(n.date)}</div>
      </div>
      <span class="item-tag tag-${n.level||"blue"}">${tagMap[n.level]||"一般"}</span>
    </div>`).join("") || '<div class="empty"><div class="icon">🔔</div>暂无通知</div>';

  // 班级
  document.getElementById("classList").innerHTML = blogData.classItems.map(c=>`
    <div class="list-item">
      <div>
        <div class="item-title">${esc(c.title)}</div>
        <div class="item-meta">${c.date?esc(c.date):""}</div>
        ${c.file ? `<a href="${c.file}" target="_blank" class="file-badge" style="text-decoration:none">📎 ${esc(c.fileName||"下载附件")}</a>` : ""}
      </div>
      <span class="item-tag tag-${c.type==="活动"?"green":"blue"}">${esc(c.type)}</span>
    </div>`).join("") || '<div class="empty"><div class="icon">👥</div>暂无班级事务</div>';

  // 生活服务
  document.getElementById("lifeList").innerHTML = blogData.lifeServices.map(s=>`
    <a class="link-card" href="${s.url||"#"}" target="_blank">
      <div class="card-icon">${s.icon||"🛒"}</div>
      <div class="card-title">${esc(s.title)}</div>
      <div class="card-desc">${esc(s.desc)}</div>
      ${s.file ? `<span class="file-badge">📎 ${esc(s.fileName||"附件")}</span>` : ""}
    </a>`).join("") || '<div class="empty"><div class="icon">🏪</div>暂无服务</div>';

  // 软件
  document.getElementById("softList").innerHTML = blogData.softwares.map(s=>`
    <a class="link-card" href="${s.url||"#"}" target="_blank">
      <div class="card-icon">${s.icon||"💾"}</div>
      <div class="card-title">${esc(s.title)}</div>
      <div class="card-desc">${esc(s.desc)}</div>
    </a>`).join("") || '<div class="empty"><div class="icon">💿</div>暂无软件</div>';

  renderLedger();
  renderDiary();
  renderAdvisor();
}

// Tab
document.querySelectorAll("#nav button").forEach(btn=>{
  btn.onclick = ()=>{
    document.querySelectorAll("#nav button").forEach(b=>b.classList.remove("active"));
    document.querySelectorAll(".section").forEach(s=>s.classList.remove("active"));
    btn.classList.add("active");
    document.getElementById("sec-"+btn.dataset.t).classList.add("active");
  };
});

// ===== 记账 =====
function todayStr(){ const d=new Date(); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }

function renderLedger(){
  const records = blogData.ledger||[];
  const ym = todayStr().slice(0,7);
  let inc=0, exp=0;
  records.forEach(r=>{ if(r.date.startsWith(ym)){ r.type==="income"?inc+=parseFloat(r.amount):exp+=parseFloat(r.amount); }});
  document.getElementById("statInc").textContent = "¥"+inc.toFixed(2);
  document.getElementById("statExp").textContent = "¥"+exp.toFixed(2);
  document.getElementById("statBal").textContent = "¥"+(inc-exp).toFixed(2);
  document.getElementById("ledgerList").innerHTML = records.slice().reverse().map(r=>`
    <div class="list-item">
      <div>
        <div class="item-title">${esc(r.desc||"无备注")}</div>
        <div class="item-meta">${esc(r.date)}</div>
      </div>
      <span class="item-tag tag-${r.type==="income"?"green":"red"}">${r.type==="income"?"+":"-"}¥${parseFloat(r.amount).toFixed(2)}</span>
    </div>`).join("") || '<div class="empty"><div class="icon">💰</div>暂无记录</div>';
}

async function addLedger(){
  const amt = parseFloat(document.getElementById("lgAmt").value);
  const desc = document.getElementById("lgDesc").value.trim();
  const type = document.getElementById("lgType").value;
  if(!amt || amt<=0){ alert("请输入有效金额"); return; }
  blogData.ledger.push({date:todayStr(), type, amount:amt, desc});
  await saveData();
  document.getElementById("lgAmt").value="";
  document.getElementById("lgDesc").value="";
  renderLedger();
}

// ===== 日记 =====
function renderDiary(){
  const list = (blogData.diary||[]).slice().reverse();
  document.getElementById("diaryList").innerHTML = list.map(d=>`
    <div class="diary-item">
      <div class="diary-date">${esc(d.date)}</div>
      <div class="diary-content">${esc(d.content)}</div>
    </div>`).join("") || '<div class="empty"><div class="icon">📖</div>暂无日记</div>';
}

async function openDiary(){
  const date = document.getElementById("diaryDate").value || todayStr();
  const content = prompt("写日记：");
  if(content === null || !content.trim()) return;
  blogData.diary.push({date, content: content.trim()});
  await saveData();
  renderDiary();
}

// ===== 导师指导 =====
function renderAdvisor(){
  const list = (blogData.advisor||[]).slice().reverse();
  document.getElementById("advisorList").innerHTML = list.map(d=>`
    <div class="diary-item">
      <div class="diary-date">${esc(d.date)}</div>
      <div class="diary-content">${esc(d.content)}</div>
    </div>`).join("") || '<div class="empty"><div class="icon">👨‍🏫</div>暂无记录</div>';
}

async function openAdvisor(){
  const date = document.getElementById("advDate").value || todayStr();
  const content = prompt("记录导师指导内容：");
  if(content === null || !content.trim()) return;
  blogData.advisor.push({date, content: content.trim()});
  await saveData();
  renderAdvisor();
}

// ===== 保存数据到 GitHub =====
async function saveData(){
  const token = localStorage.getItem("benyia_gh_token");
  if(!token){
    alert("记账/日记/导师记录是本地保存的，换浏览器会丢失。如需跨设备同步，请在后台设置 GitHub Token。");
    localStorage.setItem("benyia_blog_local", JSON.stringify(blogData));
    return;
  }
  try {
    const content = btoa(unescape(encodeURIComponent(JSON.stringify(blogData, null, 2))));
    // 获取当前文件 sha
    let sha = "";
    try {
      const res = await fetch(`https://api.github.com/repos/${GH_OWNER}/${GH_REPO}/contents/data.json`);
      if(res.ok){ const d = await res.json(); sha = d.sha; }
    } catch(e){}
    await fetch(`https://api.github.com/repos/${GH_OWNER}/${GH_REPO}/contents/data.json`, {
      method: "PUT",
      headers: {"Authorization":"token "+token, "Content-Type":"application/json"},
      body: JSON.stringify({message:"Update blog data", content, sha})
    });
  } catch(e){
    console.error("保存失败", e);
    alert("同步到 GitHub 失败，已保存在本地");
    localStorage.setItem("benyia_blog_local", JSON.stringify(blogData));
  }
}

loadData();
</script>
