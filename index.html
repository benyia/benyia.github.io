<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>思齐个人主页</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --primary:#10b981;--primary-light:#d1fae5;--primary-dark:#059669;
  --bg:#f0fdf4;--card:rgba(255,255,255,.94);--text:#1e293b;--text2:#64748b;--text3:#94a3b8;
  --border:#e2e8f0;--radius:12px;--shadow:0 2px 12px rgba(0,0,0,.05);
  --shadow-hover:0 8px 30px rgba(16,185,129,.15);
}
html{scroll-behavior:smooth}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
  color:var(--text);line-height:1.6;
  background-image:url("image1.png");background-size:cover;background-attachment:fixed;background-position:center;min-height:100vh;
}
body::before{content:"";position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(255,255,255,.38);z-index:-1}

/* Top Nav */
.topnav{background:rgba(255,255,255,.92);border-bottom:1px solid var(--border);padding:0 24px;position:sticky;top:0;z-index:100;backdrop-filter:blur(20px)}
.topnav-inner{max-width:1200px;margin:0 auto;display:flex;align-items:center;gap:8px;height:60px}
.nav-brand{display:flex;align-items:center;gap:8px;font-weight:700;font-size:1.1rem;color:var(--text);text-decoration:none;white-space:nowrap}
.nav-brand .dot{width:10px;height:10px;border-radius:50%;background:var(--primary)}
.nav-links{display:flex;gap:4px;margin-left:20px;overflow-x:auto;flex:1}
.nav-links button{padding:8px 14px;border:none;background:transparent;color:var(--text2);font-size:.9rem;cursor:pointer;white-space:nowrap;border-radius:8px;transition:all .2s;font-family:inherit}
.nav-links button:hover{background:var(--primary-light);color:var(--primary-dark)}
.nav-links button.active{background:var(--primary);color:#fff}
.nav-search{position:relative;margin-left:auto}
.nav-search input{padding:8px 14px 8px 36px;border:1px solid var(--border);border-radius:99px;font-size:.85rem;width:200px;outline:none;transition:all .2s;background:#fff}
.nav-search input:focus{border-color:var(--primary);width:240px}
.nav-search .icon{position:absolute;left:12px;top:50%;transform:translateY(-50%);opacity:.5;font-size:.85rem}
.search-results{position:absolute;top:120%;right:0;background:var(--card);border-radius:12px;box-shadow:0 10px 40px rgba(0,0,0,.15);width:350px;max-height:400px;overflow-y:auto;display:none;z-index:100}
.search-results.show{display:block}
.search-result-item{padding:10px 16px;cursor:pointer;border-bottom:1px solid var(--border)}
.search-result-item:hover{background:#f8fafc}
.search-result-item .type{font-size:.72rem;color:var(--primary);font-weight:600}
.search-result-item .title{font-size:.88rem}

/* Page Title */
.page-title{background:rgba(255,255,255,.55);padding:32px 24px;text-align:center;border-bottom:1px solid var(--border)}
.page-title h1{font-size:1.8rem;font-weight:800;margin-bottom:4px}
.page-title p{color:var(--text2);font-size:.95rem}

/* Main Layout */
.main{max-width:1200px;margin:0 auto;padding:24px;display:grid;grid-template-columns:240px 1fr 240px;gap:24px}
.left-col,.right-col{display:flex;flex-direction:column;gap:20px}
.center-col{min-width:0}

/* Card */
.side-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;backdrop-filter:blur(10px)}
.side-card h3{font-size:.95rem;margin-bottom:14px;padding-left:10px;border-left:3px solid var(--primary)}

/* Profile */
.profile{text-align:center}
.avatar{width:80px;height:80px;border-radius:50%;background:linear-gradient(135deg,var(--primary),#34d399);margin:0 auto 12px;display:flex;align-items:center;justify-content:center;font-size:2rem;color:#fff;overflow:hidden}
.avatar img{width:100%;height:100%;object-fit:cover}
.profile .name{font-size:1.1rem;font-weight:700;margin-bottom:4px}
.profile .bio{font-size:.82rem;color:var(--text2);margin-bottom:12px}

/* Category/Tag list */
.cat-list{display:flex;flex-direction:column;gap:6px}
.cat-item{display:flex;justify-content:space-between;padding:6px 10px;border-radius:6px;cursor:pointer;transition:all .2s;font-size:.88rem}
.cat-item:hover{background:var(--primary-light);color:var(--primary-dark)}
.cat-item .count{background:var(--primary-light);color:var(--primary-dark);padding:0 8px;border-radius:99px;font-size:.75rem}
.tag-list{display:flex;flex-wrap:wrap;gap:6px}
.tag-chip{padding:4px 10px;background:var(--primary-light);color:var(--primary-dark);border-radius:99px;font-size:.78rem;cursor:pointer;transition:all .2s}
.tag-chip:hover{background:var(--primary);color:#fff}

/* Center content */
.section{display:none}
.section.active{display:block;animation:fadeIn .3s ease}
.section-header{margin-bottom:16px;display:flex;justify-content:space-between;align-items:center}
.section-header h2{font-size:1.2rem}
.back-btn{padding:6px 14px;background:var(--card);border:1px solid var(--border);border-radius:8px;cursor:pointer;font-size:.82rem;color:var(--text2)}
.back-btn:hover{border-color:var(--primary);color:var(--primary)}

/* Filter bar */
.filter-bar{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px}
.filter-bar button{padding:6px 14px;border:1px solid var(--border);background:var(--card);border-radius:99px;cursor:pointer;font-size:.82rem;color:var(--text2);font-family:inherit}
.filter-bar button.active{background:var(--primary);color:#fff;border-color:var(--primary)}

/* Article Card */
.article-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);margin-bottom:16px;overflow:hidden;transition:all .3s;cursor:pointer;backdrop-filter:blur(10px)}
.article-card:hover{box-shadow:var(--shadow-hover);transform:translateY(-2px)}
.article-cover{height:120px;background:linear-gradient(135deg,#d1fae5,#a7f3d0);display:flex;align-items:center;justify-content:center;font-size:2.6rem}
.article-body{padding:18px}
.article-title{font-size:1.1rem;font-weight:700;margin-bottom:8px}
.article-meta{font-size:.8rem;color:var(--text3);margin-bottom:8px;display:flex;gap:12px;flex-wrap:wrap}
.article-meta .time{color:var(--primary);font-weight:500}
.article-desc{font-size:.88rem;color:var(--text2);line-height:1.7;white-space:pre-wrap}
.article-tags{margin-top:10px;display:flex;gap:6px;flex-wrap:wrap}

/* Detail page */
.detail-header{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:28px;margin-bottom:16px;backdrop-filter:blur(10px)}
.detail-header .icon{font-size:2.5rem;margin-bottom:12px}
.detail-header h2{font-size:1.5rem;margin-bottom:8px}
.detail-header .intro{color:var(--text2);line-height:1.8;margin-bottom:16px;white-space:pre-wrap}
.detail-header .abstract{background:#f8fafc;border-left:3px solid var(--primary);padding:12px 16px;border-radius:8px;color:var(--text2);line-height:1.8;margin:12px 0;white-space:pre-wrap;font-size:.9rem}
.progress-bar-wrap{background:#e2e8f0;height:8px;border-radius:99px;overflow:hidden;margin-bottom:6px}
.progress-bar{background:linear-gradient(90deg,var(--primary),#34d399);height:100%;border-radius:99px}
.progress-text{font-size:.82rem;color:var(--text2)}

.file-item{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:14px 18px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center}
.file-item .name{font-weight:500;font-size:.9rem;word-break:break-all}
.file-item .type{font-size:.75rem;color:var(--text3)}
.file-item a{padding:5px 12px;background:var(--primary);color:#fff;border-radius:6px;font-size:.78rem;text-decoration:none}

/* Right sidebar */
.stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.stat-item{text-align:center;padding:12px;background:#f8fafc;border-radius:8px}
.stat-item .num{font-size:1.2rem;font-weight:700;color:var(--primary)}
.stat-item .label{font-size:.75rem;color:var(--text2)}
.quick-links{display:flex;flex-direction:column;gap:4px}
.quick-link{padding:6px 10px;font-size:.85rem;color:var(--text2);cursor:pointer;border-radius:6px;display:flex;justify-content:space-between}
.quick-link:hover{background:var(--primary-light);color:var(--primary-dark)}
.quick-link a{color:inherit;text-decoration:none;display:flex;justify-content:space-between;width:100%}

/* Ledger */
.ledger-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:16px}
.stat-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:16px;text-align:center;backdrop-filter:blur(10px)}
.stat-card .num{font-size:1.3rem;font-weight:700}
.stat-card .label{font-size:.78rem;color:var(--text2)}
.income .num{color:#10b981}.expense .num{color:#ef4444}
.ledger-form{display:flex;gap:8px;margin-bottom:8px;flex-wrap:wrap}
.ledger-form input,.ledger-form select{padding:8px 12px;border:1px solid var(--border);border-radius:8px;font-size:.85rem;background:var(--card)}
.ledger-form select{flex:1;min-width:90px}
.ledger-form input[type=number]{flex:1;min-width:90px}
.ledger-form input[type=text]{flex:2;min-width:120px}
.btn{padding:8px 16px;border:none;border-radius:8px;background:var(--primary);color:#fff;font-size:.85rem;cursor:pointer;font-family:inherit}
.btn:hover{background:var(--primary-dark)}

/* Ledger / diary / advisor items */
.ledger-item{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:16px;margin-bottom:10px;border-left:4px solid var(--primary);backdrop-filter:blur(10px);display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px}
.ledger-item .date{font-size:.78rem;color:var(--text3)}
.ledger-item .amount{font-weight:700}
.diary-item{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:16px;margin-bottom:10px;backdrop-filter:blur(10px)}
.diary-date{font-size:.78rem;color:var(--text3);margin-bottom:6px}
.diary-content{font-size:.9rem;white-space:pre-wrap;line-height:1.7}

.empty{text-align:center;padding:40px;color:var(--text3);font-size:.88rem}
.gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px;margin-bottom:12px}
.gallery img{width:100%;height:140px;object-fit:cover;border-radius:10px;border:1px solid var(--border)}
.roster-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:18px;margin-bottom:12px;display:flex;gap:16px;flex-wrap:wrap;backdrop-filter:blur(10px)}
.roster-photo{width:72px;height:72px;border-radius:50%;background:linear-gradient(135deg,var(--primary),#34d399);color:#fff;display:flex;align-items:center;justify-content:center;font-size:1.4rem;overflow:hidden;flex:0 0 72px}
.roster-info{flex:1;min-width:220px;display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:6px 18px}
.roster-row{font-size:.86rem;display:flex;gap:8px}
.roster-row .k{color:var(--text3);flex:0 0 72px}
.roster-row .v{color:var(--text);font-weight:500;word-break:break-all}
.folder-title{font-size:.86rem;font-weight:600;margin:14px 0 6px;color:var(--primary-dark)}
.list-cols{display:grid;gap:16px;align-items:start}
.list-cols.cols-1{grid-template-columns:1fr}
.list-cols.cols-2{grid-template-columns:repeat(2,minmax(0,1fr))}
.list-cols.cols-3{grid-template-columns:repeat(3,minmax(0,1fr))}
.list-cols .article-card{margin-bottom:0}
.list-cols .article-cover{height:110px}
@media(max-width:1000px){.list-cols.cols-3{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:760px){.list-cols{grid-template-columns:1fr !important}}
.diary-title{font-size:1.05rem;font-weight:700;margin:2px 0 10px}
.diary-media{margin-top:10px}
.diary-media audio{width:100%;max-width:440px;margin-top:8px}
.diary-media video{width:100%;max-width:560px;border-radius:10px;margin-top:8px}
details.diary-item{padding:0;overflow:hidden}
.diary-summary{cursor:pointer;padding:16px 18px;display:flex;justify-content:space-between;align-items:center;gap:12px;list-style:none;outline:none}
.diary-summary::-webkit-details-marker{display:none}
.diary-summary-main{min-width:0;flex:1}
.diary-summary-title{display:block;font-size:1.02rem;font-weight:700;color:var(--text)}
.diary-summary-preview{display:block;font-size:.8rem;color:var(--text3);margin-top:4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.diary-summary-date{font-size:.76rem;color:var(--text3);white-space:nowrap}
.diary-summary-arrow{color:var(--text3);font-size:.8rem;transition:transform .2s}
details[open] .diary-summary-arrow{transform:rotate(180deg)}
.diary-body{padding:0 18px 18px}
.icon-img{width:100%;height:100%;object-fit:cover;border-radius:50%}
.footer{text-align:center;padding:32px;color:var(--text3);font-size:.82rem;border-top:1px solid var(--border);margin-top:20px;background:rgba(255,255,255,.55)}

@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}

/* About */
.about-content{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:32px;backdrop-filter:blur(10px);line-height:1.8;white-space:pre-wrap;font-size:.95rem}

/* Responsive */
@media(max-width:900px){
  .main{grid-template-columns:1fr}
  .left-col,.right-col{order:2}
  .nav-links{display:none}
  .nav-search input{width:140px}
  .nav-search input:focus{width:160px}
}
</style>
</head>
<body>

<nav class="topnav">
  <div class="topnav-inner">
    <a href="/" class="nav-brand"><span class="dot"></span>思齐的博客</a>
    <div class="nav-links" id="navLinks">
      <button class="active" data-t="home">首页</button>
      <button data-t="courses">课程</button>
      <button data-t="papers">论文</button>
      <button data-t="notices">通知</button>
      <button data-t="class">班级</button>
      <button data-t="advisor">导师指导</button>
      <button data-t="roster">名单</button>
      <button data-t="life">生活服务</button>
      <button data-t="ledger">记账</button>
      <button data-t="diary">日记</button>
      <button data-t="about">关于</button>
    </div>
    <div class="nav-search">
      <span class="icon">🔍</span>
      <input type="text" id="searchInput" placeholder="搜索..." oninput="doSearch(this.value)">
      <div class="search-results" id="searchResults"></div>
    </div>
  </div>
</nav>

<div class="page-title" id="pageTitle">
  <h1 id="titleH1">思齐个人主页</h1>
  <p id="titleP">钟爱奥迪A6</p>
</div>

<div class="main">
  <!-- Left Column -->
  <div class="left-col">
    <div class="side-card profile">
      <div class="avatar" id="profileAvatar">思</div>
      <div class="name" id="profileName">思齐</div>
      <div class="bio" id="profileBio">控制工程研究生</div>
    </div>
    <div class="side-card">
      <h3>分类</h3>
      <div class="cat-list" id="catList"></div>
    </div>
    <div class="side-card">
      <h3>标签</h3>
      <div class="tag-list" id="tagList"></div>
    </div>
  </div>

  <!-- Center Column -->
  <div class="center-col">
    <div class="section active" id="sec-home">
      <div id="homeList"></div>
    </div>

    <div class="section" id="sec-courses">
      <div id="coursesList"></div>
    </div>

    <div class="section" id="sec-courseDetail">
      <div class="section-header"><button class="back-btn" onclick="backToCourses()">← 返回</button></div>
      <div class="detail-header">
        <div class="icon" id="cdIcon">📐</div>
        <h2 id="cdName">课程名称</h2>
        <p class="intro" id="cdIntro"></p>
        <div class="progress-bar-wrap"><div class="progress-bar" id="cdProgressBar" style="width:0%"></div></div>
        <div class="progress-text" id="cdProgressText">学习进度：0%</div>
      </div>
      <div id="cdFiles"></div>
    </div>

    <div class="section" id="sec-papers">
      <div class="filter-bar" id="paperFilters"></div>
      <div id="papersList"></div>
    </div>

    <div class="section" id="sec-paperDetail">
      <div class="section-header"><button class="back-btn" onclick="backToPapers()">← 返回</button></div>
      <div class="detail-header">
        <h2 id="pdTitle"></h2>
        <div class="article-meta" id="pdMeta"></div>
        <div class="article-tags" id="pdTags"></div>
        <div class="abstract" id="pdAbstract" style="display:none"></div>
        <p class="intro" id="pdDesc"></p>
      </div>
      <div id="pdFiles"></div>
    </div>

    <div class="section" id="sec-notices">
      <div id="noticesList"></div>
    </div>

    <div class="section" id="sec-noticeDetail">
      <div class="section-header"><button class="back-btn" onclick="backToNotices()">← 返回</button></div>
      <div class="detail-header" id="noticeDetailBox">
        <h2 id="ndTitle"></h2>
        <div class="article-meta" id="ndMeta"></div>
        <p class="intro" id="ndContent"></p>
      </div>
      <div id="ndFiles"></div>
    </div>

    <div class="section" id="sec-class">
      <div class="filter-bar" id="classFilters"></div>
      <div id="classList"></div>
    </div>

    <div class="section" id="sec-classDetail">
      <div class="section-header"><button class="back-btn" onclick="backToClass()">← 返回</button></div>
      <div class="detail-header">
        <h2 id="clDetailTitle"></h2>
        <div class="article-meta" id="clDetailMeta"></div>
        <p class="intro" id="clDetailContent"></p>
      </div>
      <div id="clDetailFiles"></div>
    </div>

    <div class="section" id="sec-roster">
      <div id="rosterList"></div>
    </div>

    <div class="section" id="sec-life">
      <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px" id="lifeList"></div>
      <h3 style="margin:26px 0 12px;font-size:1rem;padding-left:10px;border-left:3px solid var(--primary)">🎵 音乐 · 🎬 视频 · 🖼️ 图片</h3>
      <div class="filter-bar" id="mediaFilters"></div>
      <div id="mediaList"></div>
    </div>

    <div class="section" id="sec-ledger">
      <div class="ledger-stats">
        <div class="stat-card income"><div class="num" id="statInc">¥0</div><div class="label">本月收入</div></div>
        <div class="stat-card expense"><div class="num" id="statExp">¥0</div><div class="label">本月支出</div></div>
        <div class="stat-card"><div class="num" id="statBal">¥0</div><div class="label">本月结余</div></div>
      </div>
      <div class="ledger-form">
        <select id="lgType" onchange="updateLgCategories()"><option value="expense">支出</option><option value="income">收入</option></select>
        <select id="lgCategory"></select>
        <input type="number" id="lgAmt" placeholder="金额">
        <input type="text" id="lgDesc" placeholder="备注">
        <button class="btn" onclick="addLedgerFromFront()">记一笔</button>
      </div>
      <div id="lgHint" style="font-size:.8rem;color:var(--text3);margin-bottom:12px"></div>
      <div id="ledgerList"></div>
    </div>

    <div class="section" id="sec-diary">
      <div id="diaryList"></div>
    </div>

    <div class="section" id="sec-advisor">
      <div id="advisorList"></div>
    </div>

    <div class="section" id="sec-about">
      <div class="about-content" id="aboutContent">加载中...</div>
    </div>
  </div>

  <!-- Right Column -->
  <div class="right-col">
    <div class="side-card">
      <h3>站点统计</h3>
      <div class="stat-grid">
        <div class="stat-item"><div class="num" id="statArticles">0</div><div class="label">文章数</div></div>
        <div class="stat-item"><div class="num" id="statCourses">0</div><div class="label">课程数</div></div>
        <div class="stat-item"><div class="num" id="statPapers">0</div><div class="label">论文数</div></div>
        <div class="stat-item"><div class="num" id="statDays">171</div><div class="label">建站天数</div></div>
      </div>
    </div>
    <div class="side-card">
      <h3>快速链接</h3>
      <div class="quick-links" id="quickLinks"></div>
    </div>
  </div>
</div>

<div class="footer">© 2026 思齐个人主页 · Powered by GitHub Pages</div>

<script>
const GH_OWNER = "benyia";
const GH_REPO = "benyia.github.io";

const PAGE_TITLES = {
  home: ["思齐个人主页", "钟爱奥迪A6"],
  courses: ["我的课程", "课程资料与学习资源"],
  papers: ["论文", "学术论文与研究进展"],
  notices: ["学校通知", "重要通知与公告"],
  class: ["班级事务", "通知、名单与活动"],
  roster: ["班级名单", "同学个人信息"],
  life: ["生活服务", "常用网站与工具"],
  media: ["影音", "音乐 / 视频 / 图片"],
  ledger: ["生活记账", "记录每一笔开销"],
  diary: ["日记", "记录生活点滴"],
  advisor: ["导师指导", "与导师交流记录"],
  about: ["关于我", "了解更多关于思齐"],
  courseDetail: ["课程详情", ""],
  paperDetail: ["论文详情", ""],
  noticeDetail: ["通知详情", ""],
  classDetail: ["班级事务详情", ""]

function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g, function(c){return ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]);}); }
function todayStr(){ var d=new Date(); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
function nowStr(){ var d=new Date(); return todayStr()+" "+String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0"); }
function fmtSize(bytes){
  if(!bytes && bytes!==0) return "";
  if(bytes < 1024) return bytes+" B";
  if(bytes < 1024*1024) return (bytes/1024).toFixed(1)+" KB";
  return (bytes/1024/1024).toFixed(2)+" MB";
}
function collectImages(item){
  if(!item || !Array.isArray(item.images)) return [];
  return item.images.filter(function(x){ return x && x.url; });
}
function isImgUrl(v){
  v = String(v||"").trim();
  if(!v) return false;
  if(v.indexOf("data:image") === 0) return true;
  if(v.indexOf("http://") === 0 || v.indexOf("https://") === 0) return true;
  if(v.indexOf("//") === 0) return true;
  if(v.indexOf("files/") === 0) return true;
  if(v.indexOf("/") === 0) return true;
  if(/[.](png|jpe?g|gif|webp|svg|bmp|avif|ico)$/i.test(v)) return true;
  return false;
}
function iconHTML(icon, fallback){
  var v = String(icon||"").trim();
  var fb = esc(fallback || "📄");
  if(isImgUrl(v)){
    return '<img src="'+esc(v)+'" style="width:100%;height:100%;object-fit:cover" alt="" onerror="this.style.display=&#39;none&#39;;var n=this.nextElementSibling;if(n){n.style.display=&#39;inline-block&#39;;}"><span style="display:none;font-size:1.6rem">'+fb+'</span>';
  }
  return esc(v || fallback || "📄");
}
function coverHTML(item, iconFallback){
  var imgs = collectImages(item);
  if(imgs.length) return '<div class="article-cover" style="padding:0;overflow:hidden"><img src="'+esc(imgs[0].url)+'" style="width:100%;height:100%;object-fit:cover" alt=""></div>';
  var def = (blogData.siteConfig && blogData.siteConfig.defaultImage) || "";
  if(def) return '<div class="article-cover" style="padding:0;overflow:hidden"><img src="'+esc(def)+'" style="width:100%;height:100%;object-fit:cover" alt=""></div>';
  var ic = (item && item.icon) || iconFallback || "📄";
  return '<div class="article-cover">'+iconHTML(ic, "📄")+'</div>';
}
function imgStrip(item){
  var imgs = collectImages(item);
  if(!imgs.length) return "";
  return '<div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:8px">'+imgs.map(function(f){
    return '<img src="'+esc(f.url)+'" style="width:72px;height:72px;object-fit:cover;border-radius:8px" alt="">';
  }).join("")+'</div>';
}
function galleryHTML(item){
  var imgs = collectImages(item);
  if(!imgs.length) return "";
  return '<div class="gallery">'+imgs.map(function(f){
    return '<a href="'+esc(f.url)+'" target="_blank" rel="noopener"><img src="'+esc(f.url)+'" alt=""></a>';
  }).join("")+'</div>';
}

function collectFiles(item){
  if(!item) return [];
  if(Array.isArray(item.files) && item.files.length) return item.files;
  if(item.file) return [{name:item.fileName||"附件", url:item.file, type:"文件"}];
  return [];
}
function fileListGrouped(item){
  var files = collectFiles(item);
  if(!files.length) return '<div class="empty">暂无文件</div>';
  var groups = {}, order = [];
  files.forEach(function(f){
    var g = f.folder || "";
    if(!groups[g]){ groups[g] = []; order.push(g); }
    groups[g].push(f);
  });
  var html = "";
  order.forEach(function(g){
    html += '<div class="folder-title">' + (g ? ('📁 ' + esc(g)) : '📄 文件') + '</div>';
    groups[g].forEach(function(f){
      html += '<div class="file-item"><div><div class="name">'+esc(f.name)+'</div><div class="type">'+esc(f.type||"文件")+(f.size?" · "+fmtSize(f.size):"")+'</div></div>'+(f.url?'<a href="'+esc(f.url)+'" target="_blank" rel="noopener">下载</a>':"<span>待上传</span>")+'</div>';
    });
  });
  return html;
}

function fileListHTML(item){
  var files = collectFiles(item);
  return files.map(function(f){
    return '<div class="file-item"><div><div class="name">'+esc(f.name)+'</div><div class="type">'+esc(f.type||"文件")+(f.size?" · "+fmtSize(f.size):"")+'</div></div>'+(f.url?'<a href="'+esc(f.url)+'" target="_blank" rel="noopener">下载</a>':"<span>待上传</span>")+'</div>';
  }).join("") || '<div class="empty">暂无文件</div>';
}

async function loadData(){
  try {
    var res = await fetch("data.json?v=" + Date.now());
    if(res.ok){ blogData = await res.json(); }

  } catch(e) {
    blogData = JSON.parse(JSON.stringify(DEFAULT_DATA));
  }
  for(var k in DEFAULT_DATA){ if(blogData[k]==null) blogData[k] = DEFAULT_DATA[k]; }
  if(!blogData.siteConfig || typeof blogData.siteConfig!=="object") blogData.siteConfig = {};
  blogData.siteConfig = Object.assign({}, DEFAULT_DATA.siteConfig, blogData.siteConfig);
  if(!Array.isArray(blogData.categories) || !blogData.categories.length) blogData.categories = DEFAULT_DATA.categories;
  if(!Array.isArray(blogData.tags)) blogData.tags = DEFAULT_DATA.tags;
  if(!Array.isArray(blogData.quickLinks)) blogData.quickLinks = DEFAULT_DATA.quickLinks;
  if(!blogData.ledgerCategories) blogData.ledgerCategories = DEFAULT_DATA.ledgerCategories;

  document.getElementById("titleH1").textContent = blogData.siteConfig.title || "思齐个人主页";
  document.getElementById("titleP").textContent = blogData.siteConfig.subtitle || "";
  renderAll();
}

function itemTime(x){
  return String((x && x.time) || (x && x.date) || "");
}
function byTimeDesc(a, b){
  var ta = itemTime(a), tb = itemTime(b);
  if(!ta && !tb) return 0;
  if(!ta) return 1;
  if(!tb) return -1;
  return tb.localeCompare(ta);
}

  records.forEach(function(r){ if(String(r.date||"").indexOf(ym)===0){ r.type==="income"?inc+=parseFloat(r.amount):exp+=parseFloat(r.amount); }});
  document.getElementById("statInc").textContent = "¥"+inc.toFixed(0);
  document.getElementById("statExp").textContent = "¥"+exp.toFixed(0);
  document.getElementById("statBal").textContent = "¥"+(inc-exp).toFixed(0);
  document.getElementById("ledgerList").innerHTML = records.slice().reverse().map(function(r){
    var imgs = collectImages(r);
    var bills = imgs.length ? '<div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:8px">'+imgs.map(function(f){ return '<a href="'+esc(f.url)+'" target="_blank" rel="noopener"><img src="'+esc(f.url)+'" style="width:64px;height:64px;object-fit:cover;border-radius:8px" alt=""></a>'; }).join("")+'</div>' : "";
    return '<div class="ledger-item" style="border-left-color:'+(r.type==="income"?"#10b981":"#ef4444")+'"><div style="flex:1;min-width:180px"><div class="date">'+esc(r.date)+(r.time?(' '+esc(r.time)):"")+' · '+esc(r.category||"其他")+'</div><div>'+esc(r.desc||"无备注")+'</div>'+bills+'</div><div class="amount" style="color:'+(r.type==="income"?"#10b981":"#ef4444")+'">'+(r.type==="income"?"+":"-")+'¥'+(parseFloat(r.amount)||0).toFixed(2)+'</div></div>';
  }).join("") || '<div class="empty">暂无记录</div>';
  updateLgCategories();
}
async function addLedgerFromFront(){
  var amt = parseFloat(document.getElementById("lgAmt").value);
  var desc = document.getElementById("lgDesc").value.trim();
  var type = document.getElementById("lgType").value;
  var category = document.getElementById("lgCategory").value;
  var hint = document.getElementById("lgHint");
  if(!amt || amt<=0){ if(hint){ hint.textContent="请输入金额"; hint.style.color="#ef4444"; } return; }
  var token = (localStorage.getItem("benyia_gh_token")||"").trim();
  if(!token){ if(hint){ hint.textContent="记账需要在管理后台「站点设置」里保存 GitHub Token（仅你自己的浏览器）"; hint.style.color="#ef4444"; } return; }
  hint.textContent = "保存中…"; hint.style.color = "#64748b";
  try{
    var h = {"Authorization":"Bearer "+token, "Accept":"application/vnd.github+json", "Content-Type":"application/json"};
    var raw = await (await fetch("data.json?v="+Date.now(), {cache:"no-store"})).json();
    var meta = await (await fetch("https://api.github.com/repos/"+GH_OWNER+"/"+GH_REPO+"/contents/data.json?ref=main&t="+Date.now(), {headers:h, cache:"no-store"})).json();
    raw.ledger = raw.ledger || [];
    raw.ledger.push({date:todayStr(), type:type, amount:amt, desc:desc, category:category});
    var bytes = new TextEncoder().encode(JSON.stringify(raw, null, 2));
    var bin = ""; var CHUNK = 0x8000;
    for(var i=0;i<bytes.length;i+=CHUNK) bin += String.fromCharCode.apply(null, bytes.subarray(i, i+CHUNK));
    var content = btoa(bin);
    var r = await fetch("https://api.github.com/repos/"+GH_OWNER+"/"+GH_REPO+"/contents/data.json", {method:"PUT", headers:h, body:JSON.stringify({message:"记账", content:content, branch:"main", sha:meta.sha})});
    if(!r.ok){ var m="HTTP "+r.status; try{ var j=await r.json(); if(j.message) m+="："+j.message; }catch(e){} throw new Error(m); }
    blogData = raw;
    document.getElementById("lgAmt").value=""; document.getElementById("lgDesc").value="";
    renderLedger();
    hint.textContent = "✅ 已记一笔，稍等约 1 分钟前台生效"; hint.style.color = "#059669";
  }catch(e){ hint.textContent = "保存失败："+e.message; hint.style.color = "#ef4444"; }
}

function autoTitle(text, date){
  var s = String(text||"");
  var lines = s.split(String.fromCharCode(10));
  var first = "";
  for(var i=0;i<lines.length;i++){
    var t = lines[i].replace(/^[#>*\-\s]+/, "").trim();
    if(t){ first = t; break; }
  }
  first = first.split("  ").join(" ").trim();
  if(!first) return date || "无标题";
  if(first.length > 24) return first.slice(0, 24) + "…";
  return first;
}
function renderDiary(){
  var list = (blogData.diary||[]).slice().reverse();
  document.getElementById("diaryList").innerHTML = list.map(function(d, idx){
    var title = d.title || autoTitle(d.content, d.date);
    var preview = String(d.content||"").split(String.fromCharCode(10)).join(" ").trim();
    if(preview.length > 46) preview = preview.slice(0,46) + "…";
    var media = (d.media||[]).map(function(m){
      var url = esc(m.url);
      var nm = String(m.name||"");
      var dot = nm.lastIndexOf(".");
      var ext = dot >= 0 ? nm.slice(dot+1).toLowerCase() : "";
      var player = "";
      if(["mp4","webm","mov","mkv","avi"].indexOf(ext) >= 0) player = '<video controls preload="metadata" src="'+url+'"></video>';
      else if(["mp3","wav","m4a","ogg","flac","aac"].indexOf(ext) >= 0) player = '<audio controls preload="metadata" src="'+url+'"></audio>';
      return '<div class="diary-media">'+player+'<div><a class="btn" href="'+url+'" download target="_blank" rel="noopener" style="text-decoration:none;display:inline-block;font-size:.78rem;margin-top:6px">下载 '+esc(nm)+'</a></div></div>';
    }).join("");
    return '<details class="diary-item"'+(idx===0?" open":"")+'>'
      + '<summary class="diary-summary">'
      +   '<span class="diary-summary-main"><span class="diary-summary-title">'+esc(title)+'</span>'
      +   (preview?'<span class="diary-summary-preview">'+esc(preview)+'</span>':"")+'</span>'
      +   '<span class="diary-summary-date">'+esc(d.date)+'</span>'
      +   '<span class="diary-summary-arrow">▼</span>'
      + '</summary>'
      + '<div class="diary-body"><div class="diary-content">'+esc(d.content)+'</div>'+galleryHTML(d)+media+'</div>'
      + '</details>';
  }).join("") || '<div class="empty">暂无日记</div>';
}
function renderAdvisor(){
  document.getElementById("advisorList").innerHTML = (blogData.advisor||[]).slice().reverse().map(function(d){
    return '<div class="diary-item"><div class="diary-date">'+(d.count?('第 '+d.count+' 次指导 · '):"")+esc(d.date)+(d.time?' '+esc(d.time):"")+'</div><div class="diary-content">'+esc(d.content)+'</div>'+galleryHTML(d)+'</div>';
  }).join("") || '<div class="empty">暂无记录</div>';
}

function renderRoster(){
  var FIELDS = [
    ["studentId","学号"], ["name","姓名"], ["gender","性别"], ["className","班级"],
    ["college","学院"], ["major","专业"], ["dorm","宿舍号"], ["advisor","导师"],
    ["ethnicity","民族"], ["political","政治面貌"], ["birthday","出生日期"],
    ["phone","电话"], ["email","邮箱"], ["idCard","身份证号"], ["homeAddress","家庭住址"], ["note","备注"]
  ];
  var SENSITIVE = ["idCard", "homeAddress", "phone", "email", "birthday"];
  var list = (blogData.roster||[]).filter(function(r){ return r.show !== false; });
  var globalShow = !!(blogData.rosterConfig && blogData.rosterConfig.showSensitive);
  document.getElementById("rosterList").innerHTML = list.map(function(r){
    var hide = r.hide || [];
    var photo = r.photo
      ? '<div class="roster-photo">'+iconHTML(r.photo, (r.name||"?").slice(0,1))+'</div>'
      : '<div class="roster-photo">'+esc((r.name||"?").slice(0,1))+'</div>';
    var rows = FIELDS.filter(function(f){
      var k = f[0];
      if(!r[k]) return false;
      if(hide.indexOf(k) >= 0) return false;
      if(SENSITIVE.indexOf(k) >= 0 && !globalShow) return false;
      return true;
    }).map(function(f){
      return '<div class="roster-row"><span class="k">'+f[1]+'</span><span class="v">'+esc(r[f[0]])+'</span></div>';
    }).join("");
    return '<div class="roster-card">'+photo+'<div class="roster-info">'+rows+'</div>'+galleryHTML(r)+'</div>';
  }).join("") || '<div class="empty">暂无名单</div>';
}

function doSearch(q){
  var box = document.getElementById("searchResults");
  q = q.trim().toLowerCase();
  if(!q){ box.classList.remove("show"); return; }
  var results = [];
  (blogData.courses||[]).forEach(function(c,i){ if((c.title+c.desc+(c.intro||"")).toLowerCase().indexOf(q)>=0) results.push({type:"课程", title:c.title, click:"openCourse("+i+")"}); });
  (blogData.papers||[]).forEach(function(p,i){ if((p.title+(p.abstract||"")+(p.desc||"")).toLowerCase().indexOf(q)>=0) results.push({type:"论文", title:p.title, click:"openPaper("+i+")"}); });
  (blogData.notices||[]).forEach(function(n,i){ if((n.title+(n.content||"")).toLowerCase().indexOf(q)>=0) results.push({type:"通知", title:n.title, click:"openNotice("+i+")"}); });
  (blogData.classItems||[]).forEach(function(c,i){ if((c.title+(c.content||"")).toLowerCase().indexOf(q)>=0) results.push({type:"班级", title:c.title, click:"openClass("+i+")"}); });
  document.getElementById("searchResults").innerHTML = results.slice(0,15).map(function(r){
    return '<div class="search-result-item" onclick="document.getElementById(\'searchResults\').classList.remove(\'show\');document.getElementById(\'searchInput\').value=\'\';'+r.click+'"><div class="type">'+r.type+'</div><div class="title">'+esc(r.title)+'</div></div>';
  }).join("") || '<div class="search-result-item" style="color:var(--text3)">无结果</div>';
  box.classList.add("show");
}

function setPageTitle(key, h1, p){
  document.getElementById("titleH1").textContent = h1 || (PAGE_TITLES[key]?PAGE_TITLES[key][0]:"思齐个人主页");
  document.getElementById("titleP").textContent = p !== undefined ? p : (PAGE_TITLES[key]?PAGE_TITLES[key][1]:"");
}
function showSection(name){
  document.querySelectorAll(".section").forEach(function(s){s.classList.remove("active");});
  document.getElementById("sec-"+name).classList.add("active");
  window.scrollTo(0,0);
}
function switchTab(t){
  document.querySelectorAll(".nav-links button").forEach(function(b){b.classList.remove("active");});
  var btn = document.querySelector('.nav-links button[data-t="'+t+'"]');
  if(btn) btn.classList.add("active");
  setPageTitle(t);
  showSection(t);
}
document.querySelectorAll(".nav-links button").forEach(function(btn){ btn.onclick = function(){switchTab(btn.dataset.t);}; });

document.addEventListener("click", function(e){
  if(!e.target.closest(".nav-search")) document.getElementById("searchResults").classList.remove("show");
});

loadData();
</script>
